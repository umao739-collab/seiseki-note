<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"><title>せいせきノート（画面の見本）</title>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
  :root {
    --bg: #FFF7EE; --card: #FFFFFF; --ink: #4A3F35; --mute: #8A7D70; --line: #F1E3D3;
    --peach: #FF8F6B; --peach-soft: #FFE6DC; --mint: #4FB68C; --mint-soft: #DCF3E8;
    --sky: #5FA8E0; --sky-soft: #E0EFFB; --lemon: #F2BE3A; --lemon-soft: #FFF2C9;
    --berry: #E3779A; --berry-soft: #FCE3EB;
    --A: #4FB68C; --B: #5FA8E0; --C: #F29A5B;
    --radius: 18px; --shadow: 0 2px 0 #F1E3D3, 0 6px 18px rgba(165, 120, 80, .10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'Meiryo', sans-serif; font-size: 16px; line-height: 1.6; }
  button, input, select, textarea { font: inherit; color: inherit; }
  #app { max-width: 1180px; margin: 0 auto; padding: 14px 16px 60px; }
  .hidden { display: none !important; }

  /* ---------- 上の帯 ---------- */
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-size: 24px; font-weight: 900; letter-spacing: .04em; }
  .brand small { display: block; font-size: 12px; color: var(--mute); margin-top: -4px; }
  .file-chip { margin-left: auto; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 13px; color: var(--mute); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-chip.demo { background: var(--lemon-soft); border-color: #F5DD8E; color: #8A6A10; }

  /* ---------- タブ ---------- */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 4px; }
  .tab { flex: 0 0 auto; border: none; cursor: pointer; background: #fff; border-radius: 999px; padding: 9px 18px; font-weight: 700; box-shadow: var(--shadow); color: var(--ink); }
  .tab:hover { background: var(--peach-soft); }
  .tab.on { background: var(--peach); color: #fff; box-shadow: 0 3px 0 #E06E4B; }
  .tab .ico { margin-right: 4px; }

  .termbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
  .termbar .q { font-size: 14px; color: var(--mute); font-weight: 700; }
  .chip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 14px; cursor: pointer; font-weight: 700; font-size: 14px; }
  .chip:hover { border-color: var(--peach); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---------- カード ---------- */
  .card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .card h2 .sub { font-size: 13px; font-weight: 500; color: var(--mute); }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--mute); font-size: 14px; }
  .small { font-size: 13px; }
  .spacer { flex: 1; }

  /* ---------- ボタン ---------- */
  .btn { border: none; cursor: pointer; border-radius: 14px; padding: 10px 18px; font-weight: 700; background: var(--peach); color: #fff; box-shadow: 0 3px 0 #E06E4B; transition: transform .05s; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #E06E4B; }
  .btn.mint { background: var(--mint); box-shadow: 0 3px 0 #3A9672; }
  .btn.sky { background: var(--sky); box-shadow: 0 3px 0 #4588BD; }
  .btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
  .btn.ghost:hover { border-color: var(--peach); }
  .btn.big { font-size: 18px; padding: 14px 24px; border-radius: 18px; }
  .btn:disabled { background: #DDD3C8 !important; box-shadow: none !important; color: #fff !important; cursor: default; }
  .btn.ghost:disabled { background: #fff !important; color: #C7BBAE !important; }

  /* ---------- マスコットの吹き出し ---------- */
  .hello { display: flex; gap: 14px; align-items: center; }
  .bubble { position: relative; background: #fff; border-radius: 18px; padding: 12px 16px; box-shadow: var(--shadow); flex: 1; }
  .bubble:before { content: ''; position: absolute; left: -10px; top: 22px; border: 6px solid transparent; border-right: 10px solid #fff; }
  .bubble b { font-size: 18px; }

  /* ---------- ホーム ---------- */
  .tile { border-radius: var(--radius); padding: 14px 16px; cursor: pointer; border: none; text-align: left; box-shadow: var(--shadow); background: #fff; position: relative; overflow: hidden; }
  .tile .nm { font-weight: 900; font-size: 18px; }
  .tile .val { font-size: 30px; font-weight: 900; line-height: 1.1; }
  .tile .val small { font-size: 14px; }
  .tile .band { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; }
  .action { display: flex; gap: 12px; align-items: flex-start; text-align: left; cursor: pointer; border: none; background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .action:hover { background: #FFFBF6; }
  .action .em { font-size: 34px; line-height: 1; }
  .action b { display: block; font-size: 17px; }
  .alert { background: var(--lemon-soft); border: 2px dashed #EBCB6A; border-radius: var(--radius); padding: 12px 16px; display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .note { background: var(--sky-soft); border-radius: 14px; padding: 10px 14px; font-size: 14px; }

  /* ---------- 2列（名簿＋本文） ---------- */
  .split { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: start; }
  .roster { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; max-height: 76vh; overflow-y: auto; position: sticky; top: 8px; }
  .roster button { display: flex; width: 100%; gap: 8px; align-items: center; border: none; background: none; text-align: left; padding: 7px 10px; border-radius: 12px; cursor: pointer; font-size: 15px; }
  .roster button:hover { background: var(--peach-soft); }
  .roster button.on { background: var(--peach); color: #fff; }
  .roster .no { display: inline-block; min-width: 24px; font-weight: 900; color: var(--mute); }
  .roster button.on .no { color: #fff; }
  @media (max-width: 760px) { .split { grid-template-columns: 1fr; } .roster { max-height: 200px; position: static; } .file-chip { margin-left: 0; max-width: 100%; } }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; flex: 0 0 auto; background: #EEE4D9; }
  .dot.saved { background: var(--mint); } .dot.draft { background: var(--lemon); }

  /* ---------- 評価のバッジ・タグ ---------- */
  .ev { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 900; font-size: 14px; flex: 0 0 auto; }
  .ev.A { background: var(--A); } .ev.B { background: var(--B); } .ev.C { background: var(--C); } .ev.none { background: #E6DCD0; }
  .tag { display: inline-flex; gap: 4px; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; }
  .tag.good { background: var(--lemon-soft); color: #8A6A10; }
  .tag.grow { background: var(--mint-soft); color: #2E7D5B; }
  .tag.up { background: var(--sky-soft); color: #2F6E9E; }
  .tag.miss { background: #F3ECE4; color: var(--mute); }

  /* ---------- バー ---------- */
  .bar { display: grid; grid-template-columns: 110px 1fr 46px; gap: 8px; align-items: center; font-size: 14px; margin: 4px 0; }
  .bar .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { position: relative; height: 14px; background: #F4ECE3; border-radius: 999px; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
  .avgmark { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--ink); opacity: .55; }
  .bar .v { text-align: right; font-weight: 700; }
  .stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: #F4ECE3; }
  .stack span { display: block; height: 100%; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--mute); align-items: center; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  /* ---------- 一覧表（ヒートマップ） ---------- */
  .heatwrap { overflow-x: auto; }
  table.heat { border-collapse: separate; border-spacing: 3px; font-size: 13px; }
  table.heat th { font-weight: 700; color: var(--mute); padding: 2px 4px; white-space: nowrap; }
  table.heat th.u { writing-mode: vertical-rl; text-orientation: mixed; height: 120px; vertical-align: bottom; max-height: 140px; }
  table.heat td { text-align: center; min-width: 38px; height: 28px; border-radius: 8px; font-weight: 700; }
  table.heat td.nm { text-align: left; background: none; position: sticky; left: 0; background: #fff; white-space: nowrap; padding-right: 8px; cursor: pointer; }
  table.heat td.nm:hover { color: var(--peach); }
  td.hA { background: var(--mint-soft); color: #2E7D5B; } td.hB { background: var(--sky-soft); color: #2F6E9E; } td.hC { background: #FFE2CF; color: #B4592A; } td.h0 { background: #F6F1EB; color: #C9BCAE; }

  /* ---------- 所見 ---------- */
  textarea.shoken { width: 100%; min-height: 190px; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; line-height: 1.8; background: #FFFDF9; resize: vertical; }
  textarea.shoken:focus { outline: none; border-color: var(--peach); box-shadow: 0 0 0 3px var(--peach-soft); }
  .seg { display: inline-flex; background: #F4ECE3; border-radius: 999px; padding: 3px; }
  .seg button { border: none; background: none; border-radius: 999px; padding: 5px 14px; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--mute); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .count { font-size: 13px; color: var(--mute); }
  .count.over { color: #C0532B; font-weight: 700; }
  label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 14px; }
  label.check input { width: 18px; height: 18px; accent-color: var(--peach); }

  /* ---------- はじめに ---------- */
  .steps { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .step { display: flex; gap: 8px; align-items: center; background: #fff; border-radius: 999px; padding: 6px 14px 6px 6px; box-shadow: var(--shadow); font-weight: 700; font-size: 14px; }
  .step i { font-style: normal; display: inline-flex; width: 28px; height: 28px; border-radius: 50%; align-items: center; justify-content: center; background: var(--peach); color: #fff; }
  .filelist button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; background: #FFFBF6; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
  .filelist button:hover { border-color: var(--peach); background: #fff; }
  .filelist .d { margin-left: auto; color: var(--mute); font-size: 13px; white-space: nowrap; }
  input.text { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
  input.text:focus { outline: none; border-color: var(--peach); }
  input[type=range] { accent-color: var(--peach); width: 220px; }

  /* ---------- よみこみ中・おしらせ ---------- */
  .loading { text-align: center; padding: 70px 10px; color: var(--mute); }
  .loading .m { animation: bob 1.2s ease-in-out infinite; display: inline-block; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.2); z-index: 50; max-width: 90vw; font-weight: 700; }
  .toast.err { background: #C0532B; }
  .empty { text-align: center; padding: 30px 10px; }
  .empty b { font-size: 20px; display: block; margin-top: 8px; }

  /* ---------- 個票（画面と印刷で同じ形） ---------- */
  .sheet { background: #fff; border-radius: 10px; padding: 22px 24px; box-shadow: var(--shadow); max-width: 820px; }
  .sheet-head { display: flex; align-items: flex-end; gap: 12px; border-bottom: 3px dotted var(--line); padding-bottom: 10px; margin-bottom: 12px; }
  .ribbon { background: var(--peach); color: #fff; font-weight: 900; padding: 4px 18px 4px 14px; border-radius: 10px 999px 999px 10px; font-size: 15px; }
  .sheet-name { margin-left: auto; text-align: right; }
  .sheet-name small { display: block; color: var(--mute); font-size: 13px; }
  .sheet-name b { font-size: 26px; font-weight: 900; }
  .points { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .pbox { border-radius: 14px; padding: 8px 12px; font-size: 14px; }
  .pbox h4 { margin: 0 0 4px; font-size: 14px; }
  .pbox.good { background: var(--lemon-soft); } .pbox.grow { background: var(--mint-soft); } .pbox.up { background: var(--sky-soft); }
  .pbox ul { margin: 0; padding-left: 18px; }
  .subjgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 640px) { .subjgrid { grid-template-columns: 1fr; } }
  .scard { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; break-inside: avoid; }
  .scard .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .spill { color: #fff; font-weight: 900; border-radius: 999px; padding: 1px 12px; font-size: 15px; }
  .scard .rt { margin-left: auto; font-weight: 900; font-size: 18px; }
  .scard .bar { grid-template-columns: 78px 1fr 40px; font-size: 13px; margin: 3px 0; }
  .ulist { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 4px; }
  .ulist div { display: flex; gap: 6px; align-items: center; font-size: 12.5px; padding: 1px 0; }
  .ulist .ev { width: 18px; height: 18px; font-size: 11px; }
  .ulist .u { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ulist .r { color: var(--mute); }
  .sheet-msg { margin-top: 12px; border: 2px solid var(--peach-soft); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; line-height: 1.8; }
  .sheet-msg h4 { margin: 0 0 4px; color: var(--peach); }
  .sheet-foot { margin-top: 10px; font-size: 11px; color: #B8AA9B; display: flex; justify-content: space-between; }

  #print { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 10mm; }
    html, body { background: #fff; }
    #app, .toast { display: none !important; }
    #print { display: block; }
    #print .sheet { box-shadow: none; max-width: none; padding: 0; page-break-after: always; break-after: page; }
    #print .sheet:last-child { page-break-after: auto; break-after: auto; }
    #print .subjgrid { grid-template-columns: repeat(2, 1fr); }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

</head>
<body>
  <div id="app"><div class="loading"><div class="m">📒</div><p>ひらいています…</p></div></div>
  <div id="print"></div>
  
<script>
/**
 * Config.gs — 設定と定数の一次ソース。
 *
 * ★このアプリは「成績を先生の手元から出さない」作り。
 *   - Webアプリは「アクセスしたユーザーとして実行」（appsscript.json の executeAs: USER_ACCESSING）。
 *     開いた先生の権限で、その先生が開けるSMILEファイルだけを読む。
 *   - 成績をどこにも写さない（マスタ・年度データ・キャッシュに入れない）。ログにも書かない。
 *   - 先生ごとの設定（えらんだファイル・表示の好み）は UserProperties（その先生だけの場所）に置く。
 *   - 所見を保存するときだけ、先生自身のSMILEファイルに「所見メモ」シートを足して書く。
 *
 * ★他校に配るときに書きかえるのは ALLOWED_DOMAINS の1か所だけ。
 */
var APP_TITLE = 'せいせきノート';
var APP_VERSION = '1.0.0';
var TZ = 'Asia/Tokyo';

/**
 * 使ってよい Google アカウントのドメイン（@ のうしろ）。
 * ここにないドメインのアカウントは、ファイルを開く前に断る（拒否が既定）。
 * コードに書くのは「画面や他の先生から書きかえられないように」するため（Script Properties は使わない）。
 */
var ALLOWED_DOMAINS = ['e-net.nara.jp'];

/** 先生ごとの保存場所（UserProperties）のキー。 */
var USER_PROP = { fileId: 'SMILE_FILE_ID', settings: 'SETTINGS' };

/** SMILEファイルの目じるし。メニューシートの B1 にこの文字が入っている。 */
var SMILE_MARK = 'SMILE';
var MENU_SHEET = 'メニュー';
/** 教科のシート名（あるものだけ読む）。 */
var SUBJECTS = ['国語', '社会', '算数', '理科', '生活', '音楽', '図工', '家庭', '体育', '外国語'];
/** 所見を保存するシート（先生自身のSMILEファイルの中に作る）。 */
var SHOKEN_SHEET = '所見メモ（せいせきノート）';
var SHOKEN_HEADER = ['番号', '名前', '時期', '所見', '更新日時'];

var MAX_STUDENTS = 45;
var MAX_FILES = 30;
var MAX_LEN = { shoken: 800, url: 500 };
/** 所見を一度に保存できる人数。 */
var MAX_SHOKEN_BATCH = MAX_STUDENTS * 4;
/** 時期の書き方（画面から来る値はこの形だけ受けつける）。 */
var TERM_RE = /^(1学期|2学期|3学期|前期|後期|1年間)$/;

/** 先生が変えられる設定と、その初期値・範囲。 */
var SETTINGS_DEFAULT = { strongRate: 85, weakRate: 70, shokenLength: 'normal', showClassAvg: true, includeChallenge: true };
var SETTINGS_RANGE = { strongRate: [60, 100], weakRate: [30, 90] };
var SHOKEN_LENGTHS = ['short', 'normal', 'long'];

/**
 * google.script.run から呼べるのは末尾 `_` の無い関数すべて。ここに置く公開関数はこの一覧だけ。
 * tools/run-local-tests.js が、グローバル関数とこの一覧を照らし合わせる。
 */
var PUBLIC_FUNCTIONS = ['bootstrap', 'findMyFiles', 'chooseFile', 'chooseFileByUrl', 'forgetFile',
  'loadMyClass', 'loadDemoClass', 'saveShoken', 'saveSettings'];
var ENTRY_FUNCTIONS = ['doGet'];

/** 画面にそのまま出してよい文言の例外。それ以外の例外は guard_ で固定の文言に置き換える。 */
function appError_(message) {
  var e = new Error(message);
  e.isApp = true;
  return e;
}

/**
 * Rules.gs — 入力の検査と、文字・数のそろえ方（純粋関数）。
 *
 * シートや Session に触らない。tools/run-local-tests.js で Node からも試せる。
 */

function normEmail_(s) { return String(s === null || s === undefined ? '' : s).trim().toLowerCase(); }

/** 先頭が = + - @ ' の文字列は、シートで数式にならないように ' を付ける。 */
function escapeFormula_(s) {
  s = String(s === null || s === undefined ? '' : s);
  return /^[=+\-@']/.test(s) ? "'" + s : s;
}

/** 全角の数字・記号を半角にし、前後の空白を取る。 */
function toHalf_(v) {
  return String(v === null || v === undefined ? '' : v).trim()
    .replace(/[０-９．－]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
}

/** 点数として読めれば数、読めなければ null（空・「欠」・#REF! など）。 */
function toScore_(v) {
  var s = toHalf_(v);
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  var n = Number(s);
  return isFinite(n) && n >= 0 ? n : null;
}

/** Drive のファイル ID の形か。 */
function isFileId_(id) {
  return typeof id === 'string' && /^[A-Za-z0-9_-]{20,128}$/.test(id);
}

/** スプレッドシートの URL から ID を取り出す。取り出せなければ ''。 */
function fileIdFromUrl_(url) {
  var s = String(url || '').trim();
  if (s.length > MAX_LEN.url) return '';
  var m = /^https:\/\/docs\.google\.com\/spreadsheets\/(?:u\/\d+\/)?d\/([A-Za-z0-9_-]{20,128})(?:[\/?#]|$)/.exec(s);
  return m ? m[1] : '';
}

/** 設定の検査。知らない項目は捨て、範囲の外は断る。 */
function validateSettings_(input) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) throw appError_('設定の形が正しくありません。');
  var out = {};
  Object.keys(SETTINGS_DEFAULT).forEach(function (k) { out[k] = SETTINGS_DEFAULT[k]; });
  ['strongRate', 'weakRate'].forEach(function (k) {
    if (input[k] === undefined) return;
    var n = Number(input[k]);
    var r = SETTINGS_RANGE[k];
    if (!isFinite(n) || Math.round(n) !== n || n < r[0] || n > r[1]) throw appError_('数の設定が範囲の外です。');
    out[k] = n;
  });

<script>
/*
 * Logic.html — 分析と所見づくり（純粋関数）。画面（App.html）が使う。
 *
 * ★ここはブラウザの中だけで動く。成績をどこにも送らない。

(function (root) {
  'use strict';
  var SL = {};

  /** 所見で単元名を出さない単元（まとめのテストなど）。 */
  var TEST_UNIT_RE = /たしかめ|まとめ|テスト|ふくしゅう|復習|総合/;

  function r1(x) { return Math.round(x * 10) / 10; }
  function rate(sum, max) { return max > 0 ? r1(sum / max * 100) : null; }
  function evalOf(rt, th) {

  }

  /** 観点の名前から種類を決める（漢字・言葉は国語の知識・技能の中身）。 */
  function kantenType(label) {
    if (/漢字/.test(label)) return 'kanji';
    if (/言葉|ことば|語彙/.test(label)) return 'words';
    if (/思考|判断|表現/.test(label)) return 'think';
    if (/知識|技能/.test(label)) return 'know';
    return 'other';
  }
  SL.kantenType = kantenType;
  /** 観点の短い呼び名（画面のラベル用）。 */
  SL.shortLabel = function (label) {

  };

  /** 1人の子の、1つの単元の結果。点数が1つも入っていなければ null。 */
  function unitResult(sub, u, idx) {
    var row = u.scores[idx];
    if (!row) return null;
    var sum = 0, max = 0, any = false;
    var k = row.map(function (v, ki) {
      if (v === null || v === undefined) return null;
      any = true; sum += v; max += u.kanten[ki].max;
      return v;
    });
    if (!any) return null;
    var rt = rate(sum, max);
    return { sum: sum, max: max, rate: rt, kanten: k, eval: u.evals[idx] || evalOf(rt, sub.thresholds[u.term]) };
  }

  /** 単元ごとの学級のようすを計算して、単元に _st としてつける。 */
  SL.analyze = function (model) {
    model.subjects.forEach(function (sub) {
      sub.units.forEach(function (u) {
        var st = { entered: 0, sumRate: 0, abc: { A: 0, B: 0, C: 0 },
          kSum: u.kanten.map(function () { return 0; }), kMax: u.kanten.map(function () { return 0; }), res: {} };
        model.students.forEach(function (s) {

          st.entered++;
          st.sumRate += res.rate;
          if (st.abc[res.eval] !== undefined) st.abc[res.eval]++;
          res.kanten.forEach(function (v, ki) {
            if (v === null) return;
            st.kSum[ki] += v; st.kMax[ki] += u.kanten[ki].max;

        st.kAvg = st.kSum.map(function (v, ki) { return rate(v, st.kMax[ki]); });

    return model;
  };

  /** 教科×時期の、1人の子のまとめ（観点ごと・単元ごと）。 */
  function subjectSummary(sub, idx, term, settings) {
    var units = sub.units.filter(function (u) { return inTerm(u, term) && u._st.entered > 0; });
    if (!units.length) return null;

    var sum = 0, max = 0, cSum = 0, cMax = 0;
    var list = [];
    var cCount = 0;

      var res = u._st.res[idx];
      u.kanten.forEach(function (kt, ki) {
        var k = kmap[kt.label];
        if (!k) { k = kmap[kt.label] = { label: kt.label, sum: 0, max: 0, cSum: 0, cMax: 0 }; korder.push(kt.label); }
        k.cSum += u._st.kSum[ki]; k.cMax += u._st.kMax[ki];
        if (res && res.kanten[ki] !== null) { k.sum += res.kanten[ki]; k.max += kt.max; }
      });
      cSum += u._st.kSum.reduce(function (a, b) { return a + b; }, 0);
      cMax += u._st.kMax.reduce(function (a, b) { return a + b; }, 0);
      if (!res) { list.push({ term: u.term, name: u.name, rate: null, classAvg: u._st.avg, eval: '', tag: 'missing' }); return; }

        kanten: u.kanten.map(function (kt, ki) { return { label: kt.label, score: res.kanten[ki], max: kt.max, classAvg: u._st.kAvg[ki] }; }) });
    });

      name: sub.name, rate: rt, classRate: crt, eval: evalOf(rt, th), cCount: cCount,
      kanten: korder.map(function (l) {

  /** 学級の中での位置（その子の到達率 − 学級の平均）。 */

    }).sort(function (a, b) { return (b.rate + b.diff * 1.5) - (a.rate + a.diff * 1.5); });

      return c.rate < settings.weakRate || c.diff <= -12;
    }).sort(function (a, b) { return (a.rate + a.diff) - (b.rate + b.diff); });

  var HINTS = {
    think: '考えを説明したり書いたりする場面を増やすと、力がつきやすくなります。ペアで説明し合う活動もおすすめです。',
    know: '基本の問題を短い時間でくり返す練習（朝学習・宿題）が効果的です。',
    kanji: '新しく習った漢字の小テストを、間をあけてくり返すと定着しやすくなります。',
    words: '言葉の意味を例文で確かめたり、実際に使ってみたりする活動がおすすめです。',

  SL.classView = function (model, subName, term, settings) {

    if (!sub) return null;
    var units = sub.units.filter(function (u) { return inTerm(u, term) && u._st.entered > 0; });
    var kmap = {}, korder = [];
    units.forEach(function (u) {

    updateCount();
    function setDraft(text) { S.drafts[key] = text; ta.value = text; updateCount(); }

    var lens = [['short', '短め'], ['normal', 'ふつう'], ['long', '長め']];
    var chips = h('div', { class: 'row', style: { marginBottom: '10px' } },
      p.strengths.map(function (x) { return h('span', { class: 'tag good' }, '★ ' + x.subject + '・' + SL.shortLabel(x.label)); }),
      p.growth.map(function (x) { return h('span', { class: 'tag up' }, '↗ ' + x.subject); }),
      p.challenges.map(function (x) { return h('span', { class: 'tag grow' }, '🌱 ' + x.subject + '・' + SL.shortLabel(x.label)); }),
      !p.strengths.length && !p.growth.length && !p.challenges.length ? h('span', { class: 'muted small' }, 'この時期のテストの結果が少ないようです') : null);

    var editor = h('div', { class: 'card' },
      h('h2', null, '✏️ ' + st.no + '番 ' + st.name, h('span', { class: 'sub' }, S.term + 'の所見')),
      chips,
      h('div', { class: 'row', style: { marginBottom: '10px' } },
        h('div', { class: 'seg' }, lens.map(function (l) {
          return h('button', { class: S.settings.shokenLength === l[0] ? 'on' : '', onclick: function () { S.settings.shokenLength = l[0]; setDraft(makeDraft(st)); render(); } }, l[1]);
        })),
        h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: S.settings.includeChallenge, onchange: function (e) { S.settings.includeChallenge = e.target.checked; setDraft(makeDraft(st)); render(); } }), '課題も1つ入れる'),
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn', onclick: function () { setDraft(makeDraft(st)); render(); } }, '✨ 下書きをつくる'),
        h('button', { class: 'btn ghost', onclick: function () { S.seeds[key] = (S.seeds[key] || 0) + 1; setDraft(makeDraft(st)); render(); } }, '🔁 別の言い方')),
      ta,
      h('div', { class: 'row', style: { marginTop: '8px' } }, counter, h('span', { class: 'spacer' }),
        saved ? h('span', { class: 'muted small' }, '💾 ' + saved.at + ' に保存') : null),
      h('div', { class: 'row', style: { marginTop: '10px' } },
        h('button', { class: 'btn mint', disabled: isDemo(), onclick: function () { saveItems([{ no: st.no, term: S.term, text: ta.value }], st.name + 'さんの所見を保存しました'); } }, '💾 保存する'),
        h('button', { class: 'btn ghost', onclick: function () { copyText(ta.value, 'コピーしました'); } }, '📋 コピー'),
        h('button', { class: 'btn ghost', onclick: function () { copyText(SL.aiPrompt(p, { length: S.settings.shokenLength, grade: S.model.meta.grade }), 'AIに頼む文をコピーしました（名前・点数は入っていません）'); } }, '🤖 AIに頼む文をコピー'),
        h('button', { class: 'btn ghost', onclick: function () { moveSel(1); } }, '次の子 ▶')),
      isDemo() ? h('p', { class: 'muted small' }, '🧸 見本のクラスでは保存できません。') : null,
      h('p', { class: 'muted small', style: { marginBottom: '0' } }, '※ 下書きは、テストの結果だけをもとにしています。授業中の様子など、先生にしかわからないことを書き足してください。'));

    var bulk = h('div', { class: 'card row', style: { padding: '12px 16px' } },
      h('span', { class: 'muted small row', style: { gap: '14px' } }, h('span', null, h('span', { class: 'dot saved', style: { display: 'inline-block', marginRight: '4px' } }), '保存ずみ'), h('span', null, h('span', { class: 'dot draft', style: { display: 'inline-block', marginRight: '4px' } }), '下書き（まだ保存していない）')),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn ghost', onclick: function () {
        var n = 0;
        studentsOf().forEach(function (x) {
          var k = x.idx + '|' + S.term;
          if (S.drafts[k] !== undefined || (savedOf(x) && savedOf(x).text)) return;
          S.drafts[k] = makeDraft(x); n++;
        });
        toast(n ? n + '人ぶんの下書きを作りました（まだ書いていない子だけ）' : 'みんな、もう下書きか保存ずみです');
        render();
      } }, '✨ 全員の下書きをいっきに'),
      h('button', { class: 'btn mint', disabled: isDemo(), onclick: function () {
        var items = [];
        studentsOf().forEach(function (x) {
          var k = x.idx + '|' + S.term;
          if (S.drafts[k] === undefined) return;
          var sv = savedOf(x);
          if (sv && sv.text === S.drafts[k]) return;
          items.push({ no: x.no, term: S.term, text: S.drafts[k] });
        });
        if (!items.length) { toast('保存していない下書きはありません'); return; }
        saveItems(items, items.length + '人ぶんの所見を保存しました');
      } }, '💾 下書きをまとめて保存'));
    return h('div', null, bulk, h('div', { class: 'split' }, rosterList(render, dotOf), editor));
  }

  // ================= 入れわすれ =================
  function viewCheck() {
    var list = SL.missingCheck(S.model);
    if (!list.length) return h('div', { class: 'card empty' }, mascot(90), h('b', null, 'ぜんぶ入っています！'), h('p', { class: 'muted' }, 'テストをした単元は、全員の点数が入っています。'));
    return h('div', null,
      h('div', { class: 'note', style: { marginBottom: '14px' } }, '🔍 何人かは点数が入っているのに、空いている子がいる単元です。おやすみでテストを受けていない子もここに出ます。SMILEファイルで確かめてください。'),
      h('div', { class: 'grid g2' }, list.map(function (x) {
        return h('div', { class: 'card' },
          h('div', { class: 'row', style: { marginBottom: '6px' } }, h('span', { class: 'spill', style: { background: colorOf(x.subject) } }, x.subject), h('span', { class: 'tag miss' }, x.term), h('b', null, x.unit)),
          h('div', { class: 'muted small', style: { marginBottom: '6px' } }, x.total + '人中 ' + x.entered + '人 入力ずみ'),
          h('div', { class: 'row' }, x.missing.map(function (st) { return h('span', { class: 'chip', style: { cursor: 'default' } }, st.no + ' ' + st.name); })));
      })));
  }

  // ================= 設定 =================
  function viewSettings() {
    var st = JSON.parse(JSON.stringify(S.settings));
    function rangeRow(label, key, min, max, desc) {
      var val = h('b', null, st[key] + '%');
      return h('div', { style: { marginBottom: '12px' } }, h('div', { class: 'row' }, h('span', { style: { minWidth: '150px', fontWeight: '700' } }, label),
        h('input', { type: 'range', min: min, max: max, step: 1, value: st[key], oninput: function (e) { st[key] = Number(e.target.value); val.textContent = st[key] + '%'; } }), val),
        h('div', { class: 'muted small' }, desc));
    }
    var lenSel = h('select', { class: 'text', style: { width: 'auto' }, onchange: function (e) { st.shokenLength = e.target.value; } },
      [['short', '短め（100字くらい）'], ['normal', 'ふつう（200字くらい）'], ['long', '長め（300字くらい）']].map(function (o) { return h('option', { value: o[0], selected: st.shokenLength === o[0] }, o[1]); }));
    return h('div', null,
      h('div', { class: 'card' }, h('h2', null, '📗 読みこむファイル'),
        h('p', null, S.model.fileName),
        h('div', { class: 'row' },
          h('button', { class: 'btn ghost', onclick: function () {
            call('forgetFile').then(function () { S.model = null; S.files = null; S.fileMsg = ''; go('setup'); }).catch(fail);
          } }, '別のファイルをえらぶ'),
          isDemo() ? null : h('button', { class: 'btn ghost', onclick: loadMine }, '🔄 読みこみなおす'),
          isDemo() ? null : h('button', { class: 'btn ghost', onclick: loadDemo }, '🧸 見本を見る'))),
      h('div', { class: 'card' }, h('h2', null, '🎯 「とくい」「のびしろ」の決め方'),
        rangeRow('★ とくい', 'strongRate', 60, 100, 'この%以上で、学級平均より少し高い観点を「とくい」にします。'),
        rangeRow('🌱 のびしろ', 'weakRate', 30, 90, 'この%より低いか、学級平均よりかなり低い観点を「のびしろ」にします。')),
      h('div', { class: 'card' }, h('h2', null, '✏️ 所見・個票'),
        h('div', { class: 'row', style: { marginBottom: '10px' } }, h('span', { style: { minWidth: '150px', fontWeight: '700' } }, '所見の長さ'), lenSel),
        h('div', { style: { marginBottom: '6px' } }, h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: st.includeChallenge, onchange: function (e) { st.includeChallenge = e.target.checked; } }), '所見に課題を1つ入れる（前向きな言い方で）')),
        h('div', null, h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: st.showClassAvg, onchange: function (e) { st.showClassAvg = e.target.checked; } }), '個票に学級平均の線を出す'))),
      h('button', { class: 'btn big mint', onclick: function () {
        call('saveSettings', st).then(function (r) { S.settings = r; S.kohyo.avg = r.showClassAvg; toast('設定を保存しました'); render(); }).catch(fail);
      } }, '💾 設定を保存'),
      h('div', { style: { height: '14px' } }),
      safetyCard(),
      h('p', { class: 'muted small' }, 'せいせきノート ' + (S.boot ? 'ver.' + S.boot.version : '')));
  }

  start();
})();
</script>

</body>
</html>
