<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"><title>せいせきノート（画面の見本）</title>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
  /* ============ 土台（色・形のもと） ============
     下の「教室と黒板」で、色・字・形を上書きしている。
     紙の色の上に、水彩のにじみ。線はえんぴつのような茶色で、少しゆがんだ手がきのふち。
     観点の色: 知＝そら色 / 思＝さくら色 / 主＝わかば色 / 評定＝ふじ色
     評価の色: A＝わかば / B＝そら / C＝みかん（Cも、こわくないやさしい色） */
  :root {
    --paper: #FBF5EA; --card: #FFFDF7; --ink: #5A4636; --ink-soft: #8C7663; --line: #E6D8C2; --line-d: #CDB99B;
    --sakura: #F6C9C6; --sakura-d: #E28F8B; --wakaba: #CDE5B7; --wakaba-d: #6FAA5E; --sora: #C7E0F3; --sora-d: #5E9ACB;
    --kinari: #F7EBD3; --mikan: #F9D8AE; --mikan-d: #DD8F4A; --fuji: #DDD0EE; --fuji-d: #8F75BE; --kumo: #FFFFFF;
    --A: #6FAA5E; --B: #5E9ACB; --C: #DD8F4A;
    --wobble: 18px 24px 16px 26px / 24px 16px 26px 18px;
    --wobble2: 26px 14px 22px 18px / 16px 24px 14px 22px;
    --shadow: 3px 4px 0 rgba(90, 70, 54, .10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    color: var(--ink);
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif; font-size: 16px; line-height: 1.7;
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse 520px 380px at 8% 12%, rgba(246, 201, 198, .35), transparent 70%),
      radial-gradient(ellipse 600px 420px at 92% 8%, rgba(199, 224, 243, .45), transparent 70%),
      radial-gradient(ellipse 700px 500px at 85% 92%, rgba(205, 229, 183, .35), transparent 70%),
      radial-gradient(ellipse 500px 360px at 5% 88%, rgba(249, 216, 174, .30), transparent 70%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .27 0 0 0 0 .2 0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-attachment: fixed;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3, .title { font-family: 'Kiwi Maru', 'Zen Maru Gothic', serif; font-weight: 500; letter-spacing: .04em; }
  #app { max-width: 1240px; margin: 0 auto; padding: 0 18px 80px; }
  .hidden { display: none !important; }
  .muted { color: var(--ink-soft); font-size: 14px; }
  .small { font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .stack > * + * { margin-top: 14px; }

  /* ============ 表紙（上の絵） ============ */
  .cover { position: relative; margin: 0 -18px 6px; height: 150px; overflow: hidden; }
  .cover svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cover .head { position: absolute; left: 28px; top: 22px; display: flex; gap: 14px; align-items: center; }
  .cover h1 { margin: 0; font-size: 34px; line-height: 1.1; color: var(--ink); text-shadow: 0 2px 0 rgba(255, 253, 247, .9); }
  .cover .sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .cover .who { position: absolute; right: 24px; top: 20px; background: rgba(255, 253, 247, .85); border: 2px solid var(--line-d); border-radius: var(--wobble2); padding: 4px 14px; font-size: 14px; }
  @media (max-width: 700px) { .cover { height: 170px; } .cover h1 { font-size: 26px; } .cover .who { top: auto; bottom: 10px; right: 14px; } }

  /* ============ 本のしおり（タブ） ============ */
  .shelf { display: flex; gap: 6px; align-items: flex-end; overflow-x: auto; padding: 8px 6px 0; margin-bottom: -2px; position: relative; z-index: 2; }
  .tab { flex: 0 0 auto; border: 2px solid var(--line-d); border-bottom: none; cursor: pointer; padding: 8px 16px 10px; font-weight: 700; font-size: 15px;
    border-radius: 16px 20px 0 0 / 14px 18px 0 0; background: var(--kinari); color: var(--ink-soft); transform: translateY(4px); transition: transform .15s; }
  .tab:hover { transform: translateY(0); }
  .tab.on { background: var(--card); color: var(--ink); transform: translateY(2px); padding-bottom: 14px; }
  .tab .ico { margin-right: 6px; }
  .tab.t1 { background: #FCE8E6; } .tab.t2 { background: #E7F1FA; } .tab.t3 { background: #ECF5E3; } .tab.t4 { background: #F2ECF8; } .tab.t5 { background: #FDF1E1; } .tab.t6 { background: #F4EFE6; }
  .tab.on { background: var(--card); }
  .page { background: var(--card); border: 2px solid var(--line-d); border-radius: 6px 24px 22px 26px / 6px 20px 26px 22px; padding: 22px 24px 26px; box-shadow: var(--shadow); position: relative; }
  @media (max-width: 700px) { .page { padding: 16px 12px 20px; } }

  /* ============ カード・見出し ============ */
  .card { background: var(--card); border: 2px solid var(--line); border-radius: var(--wobble); padding: 16px 20px; box-shadow: var(--shadow); }
  .card.soft { background: rgba(255, 253, 247, .7); }
  .card h2, .page h2 { font-size: 21px; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
  .card h2 .sub, .page h2 .sub { font-family: 'Zen Maru Gothic', sans-serif; font-size: 13px; color: var(--ink-soft); letter-spacing: 0; }
  .grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .grid3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .wash { position: relative; display: inline-block; padding: 0 6px; z-index: 0; }
  .wash:before { content: ''; position: absolute; left: -2px; right: -4px; bottom: 2px; height: 46%; border-radius: 40% 60% 50% 50%; z-index: -1; opacity: .8; background: var(--mikan); }
  .wash.sora:before { background: var(--sora); } .wash.sakura:before { background: var(--sakura); } .wash.wakaba:before { background: var(--wakaba); } .wash.fuji:before { background: var(--fuji); }

  /* ============ ボタン ============ */
  .btn { border: 2px solid var(--ink); background: var(--mikan); cursor: pointer; padding: 8px 18px; font-weight: 700; border-radius: var(--wobble2); box-shadow: 2px 3px 0 rgba(90, 70, 54, .25); transition: transform .08s, box-shadow .08s; }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 4px 0 rgba(90, 70, 54, .25); }
  .btn:active { transform: translate(1px, 2px); box-shadow: 0 0 0 rgba(90, 70, 54, .25); }
  .btn.sakura { background: var(--sakura); } .btn.sora { background: var(--sora); } .btn.wakaba { background: var(--wakaba); } .btn.fuji { background: var(--fuji); }
  .btn.plain { background: var(--card); border-color: var(--line-d); box-shadow: none; font-weight: 500; }
  .btn.plain:hover { border-color: var(--ink); }
  .btn.big { font-size: 18px; padding: 12px 26px; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
  .linkbtn { border: none; background: none; cursor: pointer; color: var(--sora-d); text-decoration: underline wavy rgba(94, 154, 203, .5); padding: 0; }

  /* ============ えらぶ（教科・学期） ============ */
  .pick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pick .q { font-weight: 700; color: var(--ink-soft); font-size: 14px; margin-right: 4px; }
  .pill { border: 2px solid var(--line-d); background: var(--card); border-radius: 999px; padding: 3px 14px; cursor: pointer; font-weight: 700; font-size: 14px; }
  .pill:hover { border-color: var(--ink); }
  .pill.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .pill.sub-on { color: var(--ink); }
  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 2px dashed var(--line); }

  /* ============ 表（スプレッドシートのように） ============ */
  .gridwrap { position: relative; overflow: auto; max-height: 68vh; border: 2px solid var(--line-d); border-radius: 12px 16px 12px 18px / 16px 12px 18px 12px; background: var(--card); }
  table.grid { border-collapse: separate; border-spacing: 0; font-size: 15px; font-variant-numeric: tabular-nums; }
  table.grid th, table.grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); height: 34px; padding: 0 8px; white-space: nowrap; }
  table.grid thead th { position: sticky; background: var(--kinari); z-index: 3; font-weight: 700; font-size: 13px; color: var(--ink); text-align: center; user-select: none; cursor: default; }
  table.grid thead tr.grow th { top: 0; height: 30px; }
  table.grid thead tr.hrow th { top: 0; }
  table.grid thead tr.grow + tr.hrow th { top: 30px; }
  table.grid th.ghead { font-family: 'Kiwi Maru', serif; font-size: 14px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; border-bottom: 2px solid var(--line-d); }
  table.grid th.corner { left: 0; z-index: 5; }
  table.grid th.corner.nm, table.grid th.rh.nm { left: 44px; }
  table.grid th.no { min-width: 44px; width: 44px; }
  table.grid th.nm { min-width: 110px; text-align: left; }
  table.grid th.rh { position: sticky; left: 0; background: #FFF9EE; z-index: 2; font-weight: 500; color: var(--ink); cursor: pointer; user-select: none; }
  table.grid th.rh.no { color: var(--ink-soft); text-align: center; }
  table.grid th.rh.nm { border-right: 2px solid var(--line-d); }
  table.grid td.cell { min-width: 52px; text-align: center; cursor: cell; user-select: none; position: relative; }
  table.grid td.ro { background: #FBF7F0; color: var(--ink-soft); }
  table.grid td.ed { background: var(--card); }
  table.grid td.sel { background: rgba(249, 216, 174, .45) !important; }
  table.grid td.act { outline: 2.5px solid var(--ink); outline-offset: -2px; border-radius: 3px; }
  table.grid tbody tr:hover th.rh { background: #FFF1DD; }
  th.k-know, td.k-know { box-shadow: inset 0 3px 0 var(--sora); } th.k-think, td.k-think { box-shadow: inset 0 3px 0 var(--sakura); }
  th.k-att, td.k-att { box-shadow: inset 0 3px 0 var(--wakaba); } th.k-hy, td.k-hy { box-shadow: inset 0 3px 0 var(--fuji); }
  thead th.k-know { background: #E7F1FA; } thead th.k-think { background: #FCE8E6; } thead th.k-att { background: #ECF5E3; } thead th.k-hy { background: #F2ECF8; }
  table.grid td.vA { color: var(--A); font-weight: 900; } table.grid td.vB { color: var(--B); font-weight: 900; } table.grid td.vC { color: var(--C); font-weight: 900; }
  td.manual:after { content: '✎'; position: absolute; right: 3px; top: 0; font-size: 10px; color: var(--fuji-d); }
  td.over { background: #FDE3D9 !important; color: #B24C2A; }
  td.gsep { border-left: 2px solid var(--line-d); }
  td.slash { color: var(--ink-soft); }
  .grid-sink { position: absolute; z-index: 6; opacity: 0; border: none; outline: none; padding: 0 8px; text-align: center; background: transparent; pointer-events: none; font-size: 15px; }
  .gridwrap.editing .grid-sink { opacity: 1; background: #FFFFFF; outline: 3px solid var(--sora-d); border-radius: 3px; pointer-events: auto; }
  .gridhelp { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }
  .gridhelp kbd { font-family: inherit; background: var(--kinari); border: 1px solid var(--line-d); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; margin: 0 2px; color: var(--ink); }

  /* ============ 保存の帯 ============ */
  .savebar { position: sticky; bottom: 14px; z-index: 20; margin-top: 14px; display: flex; gap: 12px; align-items: center; padding: 10px 16px;
    background: #FFF4E2; border: 2px solid var(--mikan-d); border-radius: var(--wobble2); box-shadow: 3px 4px 0 rgba(221, 143, 74, .25); }
  .savebar.clean { background: #EEF6E7; border-color: var(--wakaba-d); box-shadow: 3px 4px 0 rgba(111, 170, 94, .2); }

  /* ============ 評価のしるし ============ */
  .ev { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; font-weight: 900; font-family: 'Kiwi Maru', serif; color: #fff; border-radius: 52% 48% 55% 45% / 48% 55% 45% 52%; }
  .ev.A { background: var(--A); } .ev.B { background: var(--B); } .ev.C { background: var(--C); } .ev.none { background: var(--line); }
  .ggall { flex-basis: 100%; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .subjcopy { display: flex; gap: 6px; flex-wrap: wrap; }
  .subjcopy .btn { padding: 4px 10px; font-size: 13px; }
  .legend { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  /* ============ わたしのクラス（本のならぶ棚） ============ */
  .books { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
  .book { width: 190px; height: 230px; border: 2px solid var(--ink); border-radius: 6px 18px 16px 6px / 6px 14px 18px 6px; cursor: pointer; position: relative; text-align: left; padding: 18px 16px 14px 28px;
    box-shadow: 4px 5px 0 rgba(90, 70, 54, .15); transition: transform .15s; overflow: hidden; }
  .book:hover { transform: translateY(-6px) rotate(-1deg); }
  .book:before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: rgba(90, 70, 54, .12); border-right: 2px solid rgba(90, 70, 54, .25); }
  .book .bl { font-family: 'Kiwi Maru', serif; font-size: 28px; line-height: 1.2; }
  .book .bs { font-size: 13px; color: var(--ink-soft); }
  .book svg { position: absolute; right: 8px; bottom: 6px; }
  .book.c0 { background: #FCE3E1; } .book.c1 { background: #E1EEF9; } .book.c2 { background: #E6F2DA; } .book.c3 { background: #EFE7F7; } .book.c4 { background: #FDEBD3; } .book.c5 { background: #F6EFE2; }

  /* ============ ことりの吹き出し・お知らせ ============ */
  .say { display: flex; gap: 12px; align-items: flex-start; }
  .say .bubble { position: relative; background: var(--card); border: 2px solid var(--line-d); border-radius: var(--wobble); padding: 10px 16px; flex: 1; }
  .say .bubble:before { content: ''; position: absolute; left: -11px; top: 18px; width: 16px; height: 16px; background: var(--card); border-left: 2px solid var(--line-d); border-bottom: 2px solid var(--line-d); transform: rotate(45deg); }
  .note { background: rgba(199, 224, 243, .45); border: 2px dashed var(--sora-d); border-radius: var(--wobble2); padding: 10px 16px; font-size: 14.5px; }
  .note.warm { background: rgba(249, 216, 174, .4); border-color: var(--mikan-d); }
  .steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
  .steps li { counter-increment: s; position: relative; padding-left: 40px; margin: 8px 0; }
  .steps li:before { content: counter(s); position: absolute; left: 0; top: -1px; width: 28px; height: 28px; border-radius: 50%; background: var(--mikan); border: 2px solid var(--ink); text-align: center; font-weight: 900; line-height: 24px; font-family: 'Kiwi Maru', serif; }

  /* ============ 入力欄 ============ */
  input.text, select.text, textarea.text { border: 2px solid var(--line-d); border-radius: 10px 14px 10px 14px; padding: 6px 10px; background: #FFFFFF; }
  input.text:focus, select.text:focus, textarea.text:focus { outline: none; border-color: var(--ink); }
  input.num { width: 64px; text-align: right; }
  table.form { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  table.form th { text-align: left; font-weight: 700; color: var(--ink-soft); font-size: 13px; padding: 4px 6px; border-bottom: 2px solid var(--line); }
  table.form td { padding: 5px 6px; border-bottom: 1px dashed var(--line); }
  label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  label.check input { width: 18px; height: 18px; accent-color: var(--mikan-d); }

  /* ============ ダイアログ ============ */
  .veil { position: fixed; inset: 0; background: rgba(90, 70, 54, .28); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dialog { background: var(--card); border: 2px solid var(--ink); border-radius: var(--wobble); padding: 20px 24px; max-width: 520px; width: 100%; box-shadow: 6px 8px 0 rgba(90, 70, 54, .2); }
  .dialog.wide { max-width: 980px; max-height: 90vh; display: flex; flex-direction: column; }
  .histlist { overflow: auto; flex: 1; margin-top: 8px; }
  table.hist td, table.hist th { padding: 6px 8px; vertical-align: middle; }
  table.hist tr.muted td { color: var(--ink-soft); }
  .dialog h3 { margin: 0 0 10px; font-size: 20px; }

  /* ============ よみこみ中・おしらせ ============ */
  .loading { text-align: center; padding: 60px 10px; color: var(--ink-soft); }
  .loading .hop { display: inline-block; animation: hop 1s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translateY(-14px); } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 10px 22px; border-radius: var(--wobble2); z-index: 60; font-weight: 700; max-width: 90vw; box-shadow: 4px 5px 0 rgba(90, 70, 54, .25); }
  .toast.err { background: #B24C2A; }
  .empty { text-align: center; padding: 26px 10px; }
  .empty .title { font-size: 22px; display: block; margin-top: 6px; }
  .demo-bar { background: var(--fuji); border: 2px dashed var(--fuji-d); border-radius: 12px; padding: 6px 14px; margin: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }

  /* ============ 評価の基準・評定の表 ============ */
  details.crit-card { margin-bottom: 14px; padding: 10px 18px 14px; }
  details.crit-card > summary { cursor: pointer; font-family: 'Kiwi Maru', serif; font-size: 19px; list-style: none; padding: 4px 0 8px; }
  details.crit-card > summary::-webkit-details-marker { display: none; }
  details.crit-card > summary:before { content: '▸ '; color: var(--ink-soft); }
  details.crit-card[open] > summary:before { content: '▾ '; }
  table.crit-table { border-collapse: collapse; font-size: 14px; width: 100%; }
  table.crit-table th, table.crit-table td { padding: 5px 8px; border-bottom: 1px dashed var(--line); text-align: left; white-space: nowrap; }
  table.crit-table thead th { font-size: 12.5px; color: var(--ink-soft); border-bottom: 2px solid var(--line); }
  table.crit-table td.me { background: rgba(249, 216, 174, .22); border-radius: 8px; }
  .stepper { display: inline-flex; align-items: center; gap: 2px; }
  .stepper .st { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-d); background: var(--card); cursor: pointer; font-weight: 900; line-height: 1; padding: 0; }
  .stepper .st:hover { border-color: var(--ink); background: var(--kinari); }
  .stepper input.num { width: 54px; text-align: center; font-weight: 700; }
  .cbar { display: inline-flex; align-items: center; gap: 8px; }
  .cbar-in { display: inline-flex; width: 90px; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .cbar-in i { display: block; height: 100%; }
  .cnum { font-size: 13px; font-variant-numeric: tabular-nums; }
  .crit-tests { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; align-items: center; }
  .tchip { display: inline-flex; gap: 8px; align-items: center; background: #FFF9EE; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .tchip .tn { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .hy-cell { border: 2px solid var(--line); border-radius: var(--wobble2); padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; background: var(--card); }
  .hy-cell.hy3 { background: rgba(205, 229, 183, .35); } .hy-cell.hy1 { background: rgba(249, 216, 174, .35); }
  .hy-combo { display: flex; gap: 2px; grid-column: 1 / -1; }
  .hy-to { display: flex; gap: 6px; align-items: center; font-weight: 700; }
  .hy-to select { padding: 2px 8px; font-weight: 900; }
  .hy-n { text-align: right; }
  .ev.sm { width: 24px; height: 24px; font-size: 13px; }
  table.counts-table th.sname { font-family: 'Kiwi Maru', serif; font-size: 17px; vertical-align: middle; border-right: 2px solid var(--line); }
  table.counts-table tr.sub-first > * { border-top: 2px solid var(--line-d); }
  table.counts-table tr.none th.sname { color: var(--ink-soft); }
  /* ============ 教室と黒板（見本） ============
     黒板の深い緑に、チョークの白と色チョーク。掲示物（紙）は、マグネットでとめたクリーム色の紙。
     表（点数）は読みやすさを優先して、紙の上の「時間割」のような表。 */
  :root {
    --board: #2E4A3C; --board-d: #243B30; --chalk: #F3F0E6; --chalk-soft: rgba(243, 240, 230, .72);

/**
 * Rules.gs — 入力の検査と、文字・数のそろえ方（純粋関数）。
 *
 * シートや Session に触らない。tools/run-local-tests.js が Node から試す。
 * 画面から来る値は「どれを変えたいか」の指定にすぎない。ここで形・範囲・名簿にあるかを確かめてから使う。
 */
function normEmail_(s) { return String(s === null || s === undefined ? '' : s).trim().toLowerCase(); }

/** 先頭が = + - @ ' の文字列は、シートで数式にならないように ' を付ける。 */
function escapeFormula_(s) {
  s = String(s === null || s === undefined ? '' : s);
  return /^[=+\-@']/.test(s) ? "'" + s : s;
}

/** 全角の数字・英字・記号（－ ．）を半角にし、前後の空白を取る。 */
function toHalf_(v) {
  return String(v === null || v === undefined ? '' : v).trim()
    .replace(/[０-９Ａ-Ｚａ-ｚ．－]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
}

/** クラスの書き方をそろえる（３－１ → 3-1）。正しくなければ ''。 */
function normClassKey_(v) {
  var s = toHalf_(v).replace(/[ー―‐]/g, '-');
  var m = /^([1-6])-([0-9A-Za-z぀-ヿ一-鿿]{1,6})$/.exec(s);
  if (!m) return '';
  return m[1] + '-' + m[2].replace(/^0+(?=\d)/, '');
}
function gradeOf_(classKey) { return Number(String(classKey).split('-')[0]); }
function classLabel_(classKey) { var p = String(classKey).split('-'); return p[0] + '年' + p[1] + '組'; }

/** 4月はじまりの年度。 */
function fiscalYearOf_(yyyymmdd) {
  var m = /^(\d{4})-(\d{2})/.exec(String(yyyymmdd));
  var y = Number(m[1]), mo = Number(m[2]);
  return String(mo >= 4 ? y : y - 1);
}

function termsOf_(termSystem) { return TERM_LABELS[termSystem] || TERM_LABELS['3学期制']; }

function checkText_(v, max, what, allowEmpty) {
  var s = String(v === null || v === undefined ? '' : v).replace(/\r\n?/g, '\n').trim();
  if (!allowEmpty && !s) throw appError_(what + 'を入れてください。');
  if (s.length > max) throw appError_(what + 'は' + max + '字までです。');
  return s;
}
function checkInt_(v, min, max, what) {
  var n = Number(toHalf_(v));
  if (!isFinite(n) || Math.round(n) !== n || n < min || n > max) throw appError_(what + 'は' + min + '〜' + max + 'の数にしてください。');
  return n;
}
function checkArray_(v, max) {
  if (!Array.isArray(v) || v.length > max) throw appError_('入力の形が正しくありません。');
  return v;
}
function checkObject_(v) {
  if (!v || typeof v !== 'object' || Array.isArray(v)) throw appError_('入力の形が正しくありません。');
  return v;
}

/** 学年の教科の設定を検査する。subjects = [{name, kanten:[{label, gg, test, into, a, b}], total:{a,b}, hyoteiTerm, hyoteiYear}] */
function validateGradeSubjects_(subjects) {
  checkArray_(subjects, 20);
  if (!subjects.length) throw appError_('教科を1つ以上入れてください。');
  var names = {};
  return subjects.map(function (s) {
    checkObject_(s);
    var name = checkText_(s.name, MAX_LEN.subject, '教科の名前');
    if (names[name]) throw appError_('「' + name + '」が2回入っています。');
    names[name] = true;
    checkArray_(s.kanten, 10);
    var labels = {};
    var kanten = s.kanten.map(function (k) {
      checkObject_(k);
      var label = checkText_(k.label, MAX_LEN.kanten, '観点の名前');
      if (labels[label]) throw appError_(name + 'の観点「' + label + '」が2回入っています。');
      labels[label] = true;
      var gg = String(k.gg || '');
      if (['', '知', '思', '主'].indexOf(gg) === -1) throw appError_('GGの列は「知・思・主」のどれかにしてください。');
      var out = { label: label, gg: gg, test: k.test === true };
      if (out.test) {
        out.a = checkInt_(k.a, 1, 100, 'Aの基準');
        out.b = checkInt_(k.b, 0, 100, 'Cの基準');
        if (out.b >= out.a) throw appError_(name + '「' + label + '」の「C になる %」は、「A になる %」より小さくしてください。');
      }
      if (k.into) out.into = String(k.into);
      return out;
    });
    kanten.forEach(function (k) {
      if (k.into && (!labels[k.into] || kanten.some(function (x) { return x.label === k.into && (x.into || !x.test); }))) {
        throw appError_(name + '「' + k.label + '」のまとめ先が正しくありません。');
      }
      if (k.into && k.gg) throw appError_(name + '「' + k.label + '」は、まとめ先があるのでGGの列はいりません。');
    });
    if (!kanten.some(function (k) { return !k.into; })) throw appError_(name + 'に観点を入れてください。');
    checkObject_(s.total);
    var total = { a: checkInt_(s.total.a, 1, 100, 'Aの基準'), b: checkInt_(s.total.b, 0, 100, 'Cの基準') };
    return { name: name, kanten: kanten, total: total, hyoteiTerm: s.hyoteiTerm === true, hyoteiYear: s.hyoteiYear === true };
  });
}

/** テストの登録の検査。tests = [{testId?, name, points:{観点: 配点}}]。並び順は配列の順。 */
function validateTests_(tests, subjectConf) {
  checkArray_(tests, MAX_TESTS_PER_TERM);
  var allowed = subjectConf.kanten.filter(function (k) { return k.test; }).map(function (k) { return k.label; });
  var names = {};
  return tests.map(function (t, i) {
    checkObject_(t);
    var name = checkText_(t.name, MAX_LEN.testName, 'テストの名前');
    if (names[name]) throw appError_('テスト「' + name + '」が2回入っています。');
    names[name] = true;
    checkObject_(t.points);
    var points = {};
    Object.keys(t.points).forEach(function (label) {
      if (allowed.indexOf(label) === -1) throw appError_('「' + label + '」は、この教科のテストの観点ではありません。');
      var raw = t.points[label];
      if (raw === '' || raw === null || raw === undefined) return;
      points[label] = checkInt_(raw, 1, MAX_POINT, '「' + name + '」の配点');
    });
    if (!Object.keys(points).length) throw appError_('「' + name + '」に配点を1つ以上入れてください。');
    var id = t.testId === undefined || t.testId === '' ? '' : String(t.testId);
    if (id && !/^[A-Za-z0-9-]{8,64}$/.test(id)) throw appError_('入力の形が正しくありません。');
    return { testId: id, name: name, order: i + 1, points: points };
  });
}

/**
 * 点数の変更の検査。changes = [{studentEmail, testId, kanten, value}]。
 * students: そのクラスの児童のメール、tests: そのクラスのテスト（testId → test）。
 */
function validateScoreChanges_(changes, students, testsById) {
  checkArray_(changes, MAX_CHANGES);
  return changes.map(function (c) {
    checkObject_(c);
    var e = normEmail_(c.studentEmail);
    if (students.indexOf(e) === -1) throw appError_('名簿にない児童です。');
    var t = testsById[String(c.testId)];
    if (!t) throw appError_('このクラスのテストではありません。');
    var label = String(c.kanten);
    if (!(label in t.points)) throw appError_('このテストの観点ではありません。');
    var v = toHalf_(c.value);
    var value = '';
    if (v !== '') {
      if (!/^\d+(\.\d+)?$/.test(v) || Number(v) > t.points[label]) throw appError_('「' + t.name + '」' + label + 'の点は0〜' + t.points[label] + 'にしてください。');
      value = Number(v);
    }
    // base = 画面で読みこんだときの値（同時に編集されていないかを確かめる）。無ければ確かめない
    var out = { studentEmail: e, testId: t.testId, kanten: label, value: value };
    if (c.base !== undefined && c.base !== null) out.base = String(c.base).slice(0, 20);
    return out;
  });
}

/** 先生が入れる値（主体的・手直し）の検査。field は評価の観点か「評定」。 */
function validateManualChanges_(changes, students, subjects, terms) {
  checkArray_(changes, MAX_CHANGES);
  var termsOk = terms.concat([YEAR_TERM]);
  return changes.map(function (c) {
    checkObject_(c);
    var e = normEmail_(c.studentEmail);
    if (students.indexOf(e) === -1) throw appError_('名簿にない児童です。');
    var sub = subjects.filter(function (s) { return s.name === c.subject; })[0];
    if (!sub) throw appError_('この学年の教科ではありません。');
    var term = String(c.term);
    if (termsOk.indexOf(term) === -1) throw appError_('時期が正しくありません。');
    var field = String(c.field);
    var isHy = field === '評定';
    if (!isHy && !sub.kanten.some(function (k) { return k.label === field && !k.into; })) throw appError_('この教科の観点ではありません。');
    var v = toHalf_(c.value).toUpperCase();
    if (v === '◎') v = 'A'; else if (v === '○' || v === '〇') v = 'B'; else if (v === '△') v = 'C';
    else if (['／', '-', '－', '‐', 'ー', '―', '−', '–', '—'].indexOf(v) !== -1) v = '/';
    var ok = isHy ? /^([1-3]|\/)?$/.test(v) : /^([ABC]|\/)?$/.test(v);
    if (!ok) throw appError_(isHy ? '評定は 1・2・3 か ‐（評価できない）にしてください。' : '評価は A・B・C か ‐（評価できない）にしてください。');
    var out = { studentEmail: e, subject: sub.name, term: term, field: field, value: v };
    if (c.base !== undefined && c.base !== null) out.base = String(c.base).slice(0, 4);
    return out;
  });
}


/** 担任・担当の割り当ての検査。classes = [{classKey, homeroom, assistants:[]}]。 */
function normalizeAssignments_(classes, schoolClasses, staff) {
  checkArray_(classes, 100);
  var rows = [];
  classes.forEach(function (c) {
    checkObject_(c);
    var key = normClassKey_(c.classKey);
    if (schoolClasses.indexOf(key) === -1) throw appError_('名簿にないクラスです。');
    var hr = normEmail_(c.homeroom);
    if (hr) {
      if (staff.indexOf(hr) === -1) throw appError_('教職員の名簿にない先生です。');
      rows.push({ classKey: key, email: hr, role: ASSIGN_ROLE.homeroom });
    }
    checkArray_(c.assistants || [], MAX_ASSISTANTS).forEach(function (a) {
      var e = normEmail_(a);
      if (!e) return;
      if (staff.indexOf(e) === -1) throw appError_('教職員の名簿にない先生です。');
      if (e !== hr && !rows.some(function (r) { return r.classKey === key && r.email === e; })) rows.push({ classKey: key, email: e, role: ASSIGN_ROLE.assistant });
    });
  });
  return rows;
}

/** スプレッドシートの URL から ID を取り出す。取り出せなければ ''。 */
function sheetIdFromUrl_(url) {
  var u = String(url || '').trim();
  if (u.length > 500) return '';
  var m = /^https:\/\/docs\.google\.com\/spreadsheets\/(?:u\/\d+\/)?d\/([A-Za-z0-9_-]{20,128})(?:[\/?#]|$)/.exec(u);
  return m ? m[1] : '';
}

/** 「学校」の列の値が、その学校のものか。「nr-435_大安寺西小学校」のような値は学校コードで、そうでなければ学校名で見る。 */
function schoolMatches_(cell, schoolId, schoolName) {
  var v = String(cell || '').trim();
  if (!v) return false;
  var m = /^[a-z]*-?(\d{3,})_/.exec(v);
  if (m && /^\d+$/.test(String(schoolId))) return m[1] === String(schoolId);
  var bare = function (x) { return String(x || '').replace(/^.*_/, '').replace(/^奈良市立?/, '').trim(); };
  return bare(v) !== '' && bare(v) === bare(schoolName);
}

/** 「状態」の値が在籍・在職か（「active,multi」のようにカンマで続くことがある）。 */
function isActiveStatus_(v, list) {
  return String(v || '').split(/[,、]/).some(function (x) { return list.indexOf(x.trim()) !== -1; });
}

/**
 * 名簿マスターの「児童生徒」「教職員」シート（表示値の2次元配列、1行目が見出し）から、
 * その学校の行の、決まった列だけを抜き出す。見出しが足りなければ断る。
 */
function parseRosterMaster_(stuValues, staffValues, schoolId, schoolName, at) {
  function cols(values, want, what) {
    var head = (values[0] || []).map(function (h) { return String(h).trim(); });
    var idx = {};
    Object.keys(want).forEach(function (k) {
      var i = head.indexOf(want[k]);
      if (i === -1) throw appError_('名簿マスターの「' + what + '」シートに「' + want[k] + '」の列が見つかりません。');
      idx[k] = i;
    });
    return idx;
  }
  var si = cols(stuValues, MASTER_STUDENT_COLS, '児童生徒');
  var ti = cols(staffValues, MASTER_STAFF_COLS, '教職員');
  var roster = [], staff = [];
  stuValues.slice(1).forEach(function (r) {
    if (!schoolMatches_(r[si.school], schoolId, schoolName)) return;
    var email = normEmail_(r[si.email]);
    if (!/^[^@\s]+@[^@\s]+$/.test(email)) return;
    var name = (String(r[si.family] || '').trim() + ' ' + String(r[si.given] || '').trim()).trim();
    roster.push({ schoolId: String(schoolId), email: email, name: name, grade: toHalf_(r[si.grade]), classNo: toHalf_(r[si.classNo]),
      number: toHalf_(r[si.number]), status: isActiveStatus_(r[si.status], ENROLLED_STATUS) ? 'active' : String(r[si.status] || '').trim(), importedAt: at });
  });
  staffValues.slice(1).forEach(function (r) {
    if (!schoolMatches_(r[ti.school], schoolId, schoolName)) return;
    var email = normEmail_(r[ti.email]);
    if (!/^[^@\s]+@[^@\s]+$/.test(email)) return;
    var name = (String(r[ti.family] || '').trim() + ' ' + String(r[ti.given] || '').trim()).trim();
    staff.push({ schoolId: String(schoolId), email: email, name: name, title: String(r[ti.title] || '').trim(),
      status: isActiveStatus_(r[ti.status], STAFF_ACTIVE_STATUS) ? 'active' : String(r[ti.status] || '').trim(), importedAt: at });
  });
  return { roster: roster, staff: staff };
}

// ================= 評価の基準・評定の表 =================

/** 評価の基準の検査。input = { kanten: { 観点: {a, b} }, unit: {a, b} }。a = A になる %（以上）、b = C になる %（未満）。 */
function validateCriteria_(input, subjectConf) {
  checkObject_(input);
  function pair(v, what) {
    checkObject_(v);
    var a = checkInt_(v.a, 1, 100, what + 'のA'), b = checkInt_(v.b, 0, 100, what + 'のC');
    if (b >= a) throw appError_(what + 'の「C になる %」は、「A になる %」より小さくしてください。');
    return { a: a, b: b };
  }
  var allowed = subjectConf.kanten.filter(function (k) { return k.test && !k.into; }).map(function (k) { return k.label; });
  var kanten = {};
  Object.keys(checkObject_(input.kanten || {}) || {}).forEach(function (l) {
    if (allowed.indexOf(l) === -1) throw appError_('「' + l + '」は、この教科でテストの点をつける観点ではありません。');
    kanten[l] = pair(input.kanten[l], l);
  });
  return { kanten: kanten, unit: pair(input.unit, 'テストの評価') };
}

/** 観点が n 個のときの組み合わせ（並びは関係なし）。Logic.html の SL.combosOf と同じ。 */
function combosOf_(n) {
  var out = [], abc = ['A', 'B', 'C'];
  (function walk(prefix, from) {
    if (prefix.length === n) { out.push(prefix); return; }
    for (var i = from; i < 3; i++) walk(prefix + abc[i], i);
  })('', 0);
  return out;
}

/** 評定の表の検査。rule = { AAA: '3', AAB: '2', ... }（その教科の観点の数の組み合わせが全部そろっていること）。 */
function validateHyoteiRule_(rule, subjectConf) {
  checkObject_(rule);
  var n = subjectConf.kanten.filter(function (k) { return !k.into; }).length;
  var out = {};
  combosOf_(n).forEach(function (k) {
    var v = toHalf_(rule[k]);
    if (!/^[1-3]$/.test(v)) throw appError_('評定の表の「' + k + '」に 1・2・3 のどれかを入れてください。');
    out[k] = v;
  });
  if (Object.keys(rule).some(function (k) { return !(k in out); })) throw appError_('評定の表の形が正しくありません。');
  return out;
}

        if (cur !== x.value) hist.push({ key: Utilities.getUuid(), classKey: c, kind: 'manual', email: x.studentEmail, subject: x.subject, term: x.term, field: x.field, before: cur, after: x.value, at: '2026-11-17 11:' + (10 + hist.length % 50), by: a.name });

        students: classes['3-1'].length + classes['3-2'].length,

        staff: [{ email: 'demo.setup@example.com', name: 'デモ 教務', title: '教務主任' }, { email: 'demo.t31@example.com', name: 'デモ 担任', title: '教諭' }, { email: 'demo.t32@example.com', name: 'デモ 二組', title: '教諭' }] };
    },

    },

    getAdminView: function () { return { fiscalYear: '2026', schoolList: SCHOOL_LIST.map(function (x) { return { schoolId: x[0], schoolName: x[1] }; }), schools: [{ schoolId: 'demo', schoolName: 'デモ小学校', active: true, termSystem: '3学期制', setupTeachers: ['demo.setup@example.com'], students: 54, hasDataFile: true }] }; },
    registerSchool: function () { return api.getAdminView(); },

<script>
/*
 * Logic.html — 成績の計算（純粋関数）。画面（App.html）と、tools/run-local-tests.js が使う。
 *
 * 流れ:
 *   テストの点数 → 観点ごとの到達率 → 単元の A/B/C
 *   学期の中のテストを合わせた到達率 → 学期の観点の A/B/C（通知表）
 *   学期の観点の A/B/C を組み合わせ表に当てる → 1年間の観点の A/B/C（指導要録）
 *   観点の A/B/C を点（A=3・B=2・C=1）にして平均 → 評定（3・2・1）
 *
 * ★先生が手で直した値（手直し）は、いつも計算より優先する。
 * ★「主体的に学習に取り組む態度」はテストでは測れないので、先生が入れた値だけを使う。
 * ★DOM・google.script.run に触らない。
 */
(function (root) {
  'use strict';
  var SL = {};
  var YEAR = '1年間';
  var ABC = ['A', 'B', 'C'];

  /** 学期の評価から1年間の評価を出す組み合わせ表。学期の数ごと。 */
  var COMBO = {
    3: {
      AAA: 'A', AAB: 'A', AAC: 'B', ABA: 'A', ABB: 'B', ABC: 'B', ACA: 'B', ACB: 'B', ACC: 'B',
      BAA: 'A', BAB: 'B', BAC: 'B', BBA: 'B', BBB: 'B', BBC: 'B', BCA: 'B', BCB: 'B', BCC: 'C',
      CAA: 'B', CAB: 'B', CAC: 'B', CBA: 'B', CBB: 'B', CBC: 'C', CCA: 'B', CCB: 'C', CCC: 'C'
    },
    2: { AA: 'A', AB: 'A', AC: 'B', BA: 'A', BB: 'B', BC: 'B', CA: 'B', CB: 'B', CC: 'C' }
  };
  SL.COMBO = COMBO;
  SL.YEAR = YEAR;

  function r1(x) { return Math.round(x * 10) / 10; }
  function rate(sum, max) { return max > 0 ? r1(sum / max * 100) : null; }
  function abcOf(rt, a, b) {
    if (rt === null || rt === undefined) return '';
    return rt >= a ? 'A' : rt >= b ? 'B' : 'C';
  }
  SL.rate = rate;
  SL.abcOf = abcOf;

  /** 評価不能のしるし（‐ や / など）。中では '/' で持つ（GG の「評価不能」は /）。画面では ‐ と出す。 */
  var DASHES = ['/', '／', '-', '－', '‐', 'ー', '―', '−', '–', '—'];
  SL.isDash = function (s) { return DASHES.indexOf(String(s).trim()) !== -1; };
  /** 入力された評価の書き方をそろえる（a・Ａ・◎ → A など）。読めなければ null。‐・/ は評価不能（'/'）。 */
  SL.normAbc = function (v) {
    var s = String(v === null || v === undefined ? '' : v).trim()
      .replace(/[Ａ-Ｃａ-ｃ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).toUpperCase();
    if (s === '') return '';
    if (s === '◎') return 'A';
    if (s === '○' || s === '〇' || s === '◯') return 'B';
    if (s === '△') return 'C';
    if (SL.isDash(s)) return '/';
    return ABC.indexOf(s) !== -1 ? s : null;
  };
  /** 評定の書き方をそろえる（１→1）。読めなければ null。 */
  SL.normHyotei = function (v) {
    var s = String(v === null || v === undefined ? '' : v).trim()
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (s === '') return '';
    if (SL.isDash(s)) return '/';
    return /^[1-3]$/.test(s) ? s : null;
  };
  /** 点数の書き方をそろえる。読めなければ null、空なら ''。 */
  SL.normScore = function (v, max) {
    var s = String(v === null || v === undefined ? '' : v).trim()
      .replace(/[０-９．]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (s === '') return '';
    if (!/^\d+(\.\d+)?$/.test(s)) return null;
    var n = Number(s);
    if (max !== undefined && n > max) return null;
    return n;
  };

  // ================= 教科の設定 =================

  /** 教科の観点のうち、テストで点をつける観点（主体的…は入らない）。 */
  function testKanten(sub) { return sub.kanten.filter(function (k) { return k.test; }); }
  SL.testKanten = testKanten;
  /** 学期・1年間の評価を出す観点（漢字・言葉のように、ほかの観点にまとめるものは入らない）。 */
  function evalKanten(sub) { return sub.kanten.filter(function (k) { return !k.into; }); }
  SL.evalKanten = evalKanten;
  function kantenOf(sub, label) { return sub.kanten.filter(function (k) { return k.label === label; })[0] || null; }

  // ================= 評価の基準・評定の表 =================

  /**
   * クラス×教科×学期の評価の基準。{ kanten: { 観点: {a, b} }, unit: {a, b} }
   * a = A になる %（以上）、b = C になる %（未満）。間が B。
   */
  SL.criteriaFor = function (cd, sub, term) {
    var saved = (cd.criteria || {})[sub.name + '|' + term] || {};
    var out = { kanten: {}, unit: { a: sub.total.a, b: sub.total.b } };
    testKanten(sub).filter(function (k) { return !k.into; }).forEach(function (k) {
      var v = (saved.kanten || {})[k.label];
      out.kanten[k.label] = v ? { a: v.a, b: v.b } : { a: k.a, b: k.b };
    });
    if (saved.unit) out.unit = { a: saved.unit.a, b: saved.unit.b };
    return out;
  };

  /** 観点が n 個のときの、A・B・C の組み合わせ（並びは関係なし。AAB と ABA は同じ）。 */
  function combosOf(n) {
    var out = [];
    (function walk(prefix, from) {
      if (prefix.length === n) { out.push(prefix); return; }
      for (var i = from; i < 3; i++) walk(prefix + ABC[i], i);
    })('', 0);
    return out;
  }
  SL.combosOf = combosOf;
  /** 評定の表の初期値: 3 はぜんぶ A、1 は C が2つ以上（または全部 C）、ほかは 2。 */
  function defaultHyotei(n) {
    var out = {};
    combosOf(n).forEach(function (k) {
      var c = k.split('C').length - 1;
      out[k] = k.indexOf('B') === -1 && c === 0 ? '3' : (c >= Math.min(2, n) ? '1' : '2');
    });
    return out;
  }
  SL.defaultHyotei = defaultHyotei;
  /** クラス×教科の評定の表。 */
  SL.hyoteiRuleFor = function (cd, sub) {
    var n = evalKanten(sub).length;
    var def = defaultHyotei(n);
    var saved = (cd.hyoteiRules || {})[sub.name] || {};
    Object.keys(def).forEach(function (k) { if (/^[1-3]$/.test(saved[k] || '')) def[k] = saved[k]; });
    return def;
  };
  /** 観点の評価の並び → 組み合わせの名前（AAB など）。空・評価不能があれば ''。 */
  function comboKey(evals) {
    if (!evals.length || evals.some(function (e) { return ABC.indexOf(e) === -1; })) return '';
    return evals.slice().sort().join('');
  }
  SL.comboKey = comboKey;

  // ================= テスト（単元） =================

  /** 1人の子の、1つのテストの結果。点が1つも入っていなければ null。 */
  SL.testResult = function (cd, sub, test, sk) {
    var row = (cd.scores[test.testId] || {})[sk];
    if (!row) return null;
    var sum = 0, max = 0, any = false, per = {};
    Object.keys(test.points).forEach(function (label) {
      var v = row[label];
      if (v === null || v === undefined || v === '') return;
      any = true; sum += v; max += test.points[label];
      per[label] = v;
    });
    if (!any) return null;
    var rt = rate(sum, max);
    var t = SL.criteriaFor(cd, sub, test.term).unit;
    return { sum: sum, max: max, rate: rt, eval: abcOf(rt, t.a, t.b), per: per };
  };

  function testsOf(cd, subject, term) {
    return cd.tests.filter(function (t) { return t.subject === subject && (term === YEAR || t.term === term); })
      .sort(function (a, b) { return (cd.terms.indexOf(a.term) - cd.terms.indexOf(b.term)) || (a.order - b.order); });
  }
  SL.testsOf = testsOf;

  // ================= 学期の観点の評価 =================

  function manualOf(cd, sk, subject, term, field) {
    var v = cd.manual[[sk, subject, term, field].join('|')];
    return v === undefined ? '' : v;
  }
  SL.manualOf = manualOf;

  /**
   * 1人・1教科・1学期の観点ごとの結果。
   * 返す: { kanten: [{label, gg, sum, max, rate, auto, manual, final}], hyotei: {auto, manual, final}, total: {rate} }
   */
  SL.termEval = function (cd, sub, sk, term) {
    var tests = testsOf(cd, sub.name, term);
    var acc = {};
    sub.kanten.forEach(function (k) { acc[k.label] = { sum: 0, max: 0 }; });
    var allSum = 0, allMax = 0;
    tests.forEach(function (t) {
      var row = (cd.scores[t.testId] || {})[sk] || {};
      Object.keys(t.points).forEach(function (label) {
        var v = row[label];
        if (v === null || v === undefined || v === '') return;
        var k = kantenOf(sub, label);
        if (!k) return;
        var target = k.into ? k.into : label;
        if (!acc[target]) acc[target] = { sum: 0, max: 0 };
        acc[target].sum += v; acc[target].max += t.points[label];
        if (k.into) { acc[label].sum += v; acc[label].max += t.points[label]; }
        allSum += v; allMax += t.points[label];
      });
    });
    var crit = SL.criteriaFor(cd, sub, term);
    var out = evalKanten(sub).map(function (k) {
      var a = acc[k.label] || { sum: 0, max: 0 };
      var rt = k.test ? rate(a.sum, a.max) : null;
      var th = crit.kanten[k.label] || { a: k.a, b: k.b };
      var auto = k.test ? abcOf(rt, th.a, th.b) : '';
      var manual = manualOf(cd, sk, sub.name, term, k.label);
      return { label: k.label, gg: k.gg, test: k.test, sum: a.sum, max: a.max, rate: rt, auto: auto, manual: manual, final: manual || auto };
    });
    var hy = hyoteiOf(cd, sub, out.map(function (x) { return x.final; }));
    var hManual = manualOf(cd, sk, sub.name, term, '評定');
    return { kanten: out, hyotei: { auto: hy, manual: hManual, final: hManual || hy }, total: { rate: rate(allSum, allMax) } };
  };

  /** 観点の A/B/C の組み合わせを評定の表に当てる（3・2・1）。1つでも空・評価不能があれば ''。 */
  function hyoteiOf(cd, sub, evals) {
    if (evals.length && evals.every(function (e) { return e === '/'; })) return '/';
    var key = comboKey(evals);
    return key ? (SL.hyoteiRuleFor(cd, sub)[key] || '') : '';
  }
  SL.hyoteiOf = hyoteiOf;

  // ================= 1年間（指導要録） =================

  /** 学期の評価の並びを組み合わせ表に当てる。全部の学期がそろっていなければ ''。 */
  function combine(evals, n) {
    if (evals.length === n && evals.every(function (e) { return e === '/'; })) return '/';
    if (evals.length !== n || evals.some(function (e) { return ABC.indexOf(e) === -1; })) return '';
    return (COMBO[n] || {})[evals.join('')] || '';
  }
  SL.combine = combine;

  /** 1人・1教科の1年間（指導要録）の観点と評定。 */
  SL.yearEval = function (cd, sub, sk) {
    var terms = cd.terms.map(function (t) { return SL.termEval(cd, sub, sk, t); });
    var out = evalKanten(sub).map(function (k, i) {
      var seq = terms.map(function (te) { return te.kanten[i].final; });
      var auto = combine(seq, cd.terms.length);
      var manual = manualOf(cd, sk, sub.name, YEAR, k.label);
      return { label: k.label, gg: k.gg, terms: seq, auto: auto, manual: manual, final: manual || auto };
    });
    var hy = hyoteiOf(cd, sub, out.map(function (x) { return x.final; }));
    var hManual = manualOf(cd, sk, sub.name, YEAR, '評定');
    return { kanten: out, hyotei: { auto: hy, manual: hManual, final: hManual || hy } };
  };

  /** 時期（学期 or 1年間）ごとに呼び分ける。 */
  SL.evalFor = function (cd, sub, sk, term) {
    return term === YEAR ? SL.yearEval(cd, sub, sk) : SL.termEval(cd, sub, sk, term);
  };

  // ================= 校務支援システム（GG）に貼る表 =================

  /** GGの列（知・思・主・評定）。評定を出さない学年・時期は入れない。 */
  SL.ggColumns = function (cd, sub, term) {
    var cols = evalKanten(sub).filter(function (k) { return k.gg; }).map(function (k) { return { label: k.gg, kanten: k.label }; });
    var useHyotei = term === YEAR ? sub.hyoteiYear : sub.hyoteiTerm;
    if (useHyotei) cols.push({ label: '評定', kanten: '評定' });
    return cols;
  };

  /** GGに貼る行（名簿の順）。空はそのまま空にする（GGで手で入れる）。 */
  SL.ggRows = function (cd, sub, term) {
    var cols = SL.ggColumns(cd, sub, term);
    return cd.students.map(function (st) {
      var ev = SL.evalFor(cd, sub, st.key, term);
      return {
        key: st.key, no: st.no, name: st.name,
        cells: cols.map(function (c) {
          if (c.kanten === '評定') return ev.hyotei.final;
          var k = ev.kanten.filter(function (x) { return x.label === c.kanten; })[0];
          return k ? k.final : '';
        })
      };
    });
  };

  /** GG での教科の並び（GG の見出しの順）。図工は GG では「図画工作」。 */
  SL.GG_SUBJECT_ORDER = ['国語', '社会', '算数', '理科', '生活', '音楽', '図工', '家庭', '体育', '外国語'];
  SL.ggSubjectName = function (name) { return name === '図工' ? '図画工作' : name; };
  /**
   * 全教科をまとめて GG に貼る行。教科ごとに いつも「知・思・主・評定」の4列（評定を出さない時期は空）にして、
   * GG の見出し（国語_知 国語_思 国語_主 国語_評定 社会_知 …）と列がずれないようにする。
   */
  SL.ggAll = function (cd, term) {
    var subs = cd.subjects.slice().sort(function (a, b) {
      var ia = SL.GG_SUBJECT_ORDER.indexOf(a.name), ib = SL.GG_SUBJECT_ORDER.indexOf(b.name);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    var header = [];
    subs.forEach(function (sub) { ['知', '思', '主', '評定'].forEach(function (g) { header.push(SL.ggSubjectName(sub.name) + '_' + g); }); });
    var rows = cd.students.map(function (st) {
      var cells = [];
      subs.forEach(function (sub) {
        var ev = SL.evalFor(cd, sub, st.key, term);
        var useHyotei = term === YEAR ? sub.hyoteiYear : sub.hyoteiTerm;
        ['知', '思', '主'].forEach(function (g) {
          var k = evalKanten(sub).filter(function (x) { return x.gg === g; })[0];
          var e = k ? ev.kanten.filter(function (x) { return x.label === k.label; })[0] : null;
          cells.push(e ? e.final : '');
        });
        cells.push(useHyotei ? ev.hyotei.final : '');
      });
      return { key: st.key, no: st.no, name: st.name, cells: cells };
    });
    return { subjects: subs.map(function (x) { return SL.ggSubjectName(x.name); }), header: header, rows: rows };
  };

  /** 表の値をタブ区切りの文字にする（スプレッドシート・GGに貼れる形）。 */
  SL.toTsv = function (rows) {
    return rows.map(function (r) { return r.map(function (v) { return String(v === null || v === undefined ? '' : v).replace(/[\t\r\n]+/g, ' '); }).join('\t'); }).join('\n');
  };
  /** 貼りつけられた文字を表にする（Excel・スプレッドシート・GGからのコピー）。 */
  SL.fromTsv = function (text) {
    var s = String(text || '').replace(/\r\n?/g, '\n');
    if (s.slice(-1) === '\n') s = s.slice(0, -1);
    if (s === '') return [];
    return s.split('\n').map(function (line) { return line.split('\t'); });
  };

  // ================= 入れわすれ =================

  /** 何人かは点が入っているのに、空いている子がいるテスト。 */
  SL.missing = function (cd) {
    var out = [];
    cd.tests.forEach(function (t) {
      var sc = cd.scores[t.testId] || {};
      var entered = cd.students.filter(function (st) {
        var row = sc[st.key];
        return row && Object.keys(t.points).some(function (l) { return row[l] !== undefined && row[l] !== null && row[l] !== ''; });
      });
      if (!entered.length || entered.length === cd.students.length) return;
      out.push({ test: t, entered: entered.length, missing: cd.students.filter(function (st) { return entered.indexOf(st) === -1; }) });
    });
    return out;
  };

  // ================= 単元ごとの学級のようす =================

  /** テストごとの学級平均・A/B/Cの人数。 */
  SL.testStats = function (cd, sub, test) {
    var n = 0, sumRate = 0, abc = { A: 0, B: 0, C: 0 }, kSum = {}, kMax = {};
    cd.students.forEach(function (st) {
      var r = SL.testResult(cd, sub, test, st.key);
      if (!r) return;
      n++; sumRate += r.rate; abc[r.eval]++;
      Object.keys(r.per).forEach(function (l) { kSum[l] = (kSum[l] || 0) + r.per[l]; kMax[l] = (kMax[l] || 0) + test.points[l]; });
    });
    var kAvg = {};
    Object.keys(kSum).forEach(function (l) { kAvg[l] = rate(kSum[l], kMax[l]); });
    return { entered: n, avg: n ? r1(sumRate / n) : null, abc: abc, kAvg: kAvg };
  };

  /**
   * 学年のほかのクラス（名前なしの点数）を、いまの基準で数える。
   * peer = { label, n, tests: [{ subject, term, name, points, rows: [ {観点: 点} | null ] }] }（rows は n 人ぶん、並びはクラスの中でそろっている）
   * 返す: { kanten: { 観点: {A,B,C} }, tests: { テスト名: {A,B,C} } }
   */
  SL.peerCounts = function (peer, sub, term, crit) {
    var tests = peer.tests.filter(function (t) { return t.subject === sub.name && t.term === term; });
    var out = { kanten: {}, tests: {} };
    var acc = [];
