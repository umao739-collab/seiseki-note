<script>
/*

 */
(function () {
  'use strict';
  var SL = window.SL, Grid = window.Grid;
  var YEAR = SL.YEAR;
  var ABC_COLOR = { A: 'var(--A)', B: 'var(--B)', C: 'var(--C)' };

  // ================= 小さな道具 =================
  function h(tag, props) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];

      else if (k === 'class') e.className = v;
      else if (k === 'style') Object.keys(v).forEach(function (x) { e.style[x] = v[x]; });

      else e.setAttribute(k, String(v));
    });
    add(e, Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function add(e, kids) {
    kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;

  }
  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
    add(e, Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
  function pct(v) { return v === null || v === undefined ? '' : String(Math.round(v)); }

  // ================= 絵（すべてオリジナル） =================
  var uid = 0;
  /** 水彩のにじみ（ふちを少しゆらす）フィルター。 */
  // ---------- 文房具の絵（すべてオリジナル）：ノート・えんぴつ・三角定規 ----------
  /** えんぴつ（色・角度）。 */
  function pencil(w, c, rot) {
    // ななめにしても先やけしゴムが切れないよう、まわりに余白をとった描く範囲にする
    return s('svg', { width: w, height: Math.round(w * 64 / 124), viewBox: '-7 -10 124 64', 'aria-hidden': 'true', style: 'overflow: visible' },
      s('g', { transform: 'rotate(' + (rot === undefined ? -12 : rot) + ' 55 22)' },
        s('rect', { x: 18, y: 13, width: 64, height: 18, fill: c || '#F2C230' }),
        s('rect', { x: 18, y: 13, width: 64, height: 6, fill: '#fff', opacity: 0.3 }),
        s('rect', { x: 18, y: 25, width: 64, height: 6, fill: '#000', opacity: 0.08 }),
        s('path', { d: 'M82 13 L100 22 L82 31 Z', fill: '#F2D2A9' }),
        s('path', { d: 'M94 19 L100 22 L94 25 Z', fill: c && c !== '#F2C230' ? c : '#4A4540' }),
        s('rect', { x: 10, y: 13, width: 9, height: 18, fill: '#B9B4AA' }),
        s('rect', { x: 12, y: 13, width: 2, height: 18, fill: '#fff', opacity: 0.5 }),
        s('rect', { x: 3, y: 13, width: 8, height: 18, rx: 3, fill: '#F2A5B0' })));
  }
  /** リングノート。 */
  function note(w) {
    return s('svg', { width: w, height: Math.round(w * 1.15), viewBox: '0 0 80 92', 'aria-hidden': 'true' },
      s('rect', { x: 10, y: 6, width: 62, height: 82, rx: 4, fill: 'rgba(0,0,0,.2)' }),
      s('rect', { x: 8, y: 4, width: 62, height: 82, rx: 4, fill: '#FFFDF6', stroke: '#C9BCA3', 'stroke-width': 2 }),
      s('rect', { x: 8, y: 4, width: 14, height: 82, rx: 4, fill: '#3E7CC2' }),
      s('g', { stroke: '#A9D2F0', 'stroke-width': 1.6 }, [24, 34, 44, 54, 64].map(function (y) { return s('path', { d: 'M28 ' + y + 'h34' }); }), s('path', { d: 'M28 74h24' })),
      s('path', { d: 'M28 14h22', stroke: '#D9667F', 'stroke-width': 3, 'stroke-linecap': 'round' }),
      s('g', { fill: '#FFFDF6', stroke: '#8C7663', 'stroke-width': 1.5 }, [16, 30, 44, 58, 72].map(function (y) { return s('circle', { cx: 15, cy: y, r: 2.6 }); })));
  }
  /** 三角定規。 */
  function ruler(w) {
    return s('svg', { width: w, height: w, viewBox: '0 0 60 60', 'aria-hidden': 'true' },
      s('path', { d: 'M6 54 L6 6 L54 54 Z', fill: '#A9D2F0', 'fill-opacity': 0.55, stroke: '#3E7CC2', 'stroke-width': 2 }),
      s('path', { d: 'M14 46 L14 26 L34 46 Z', fill: 'none', stroke: '#3E7CC2', 'stroke-width': 1.5 }),
      s('g', { stroke: '#3E7CC2', 'stroke-width': 1.2 }, s('path', { d: 'M6 14h5M6 22h4M6 30h5M6 38h4M6 46h5' })));
  }
  /** 表紙のしるし（ノートとえんぴつ）。 */
  function logo() {
    var p = pencil(64, '#F2C230', -30);
    p.setAttribute('class', 'logo-pencil');
    return h('span', { class: 'logo' }, note(64), p);
  }
  /** 「まだない」「ぜんぶ入った」などの所の絵（ノートと三角定規）。 */
  function stillLife(w) { return h('span', { class: 'still' }, note(w), ruler(Math.round(w * 0.8))); }
  var PENCILS = ['#E2788D', '#4C8FD6', '#5FA65A', '#9A7BD1', '#E9963F', '#2EA3A8'];

  // ================= サーバー =================
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    args.push(S.actingAs);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || 'うまくいきませんでした。'));
      });
      r[fn].apply(r, args);
    });
  }

  // ================= 状態 =================
  var S = {
    actingAs: null, personas: window.__PERSONAS__ || [], isDemo: !!window.__IS_DEMO__,
    boot: null, view: 'loading', msg: '', classKey: null, cd: null, tab: 'scores',
    subject: null, term: null, pending: { scores: {}, manual: {}, criteria: {}, rules: {} }, base: { scores: {}, manual: {} }, setup: null, admin: null, setupGrade: null
  };
  function pendingCount() {
    return Object.keys(S.pending.scores).length + Object.keys(S.pending.manual).length + Object.keys(S.pending.criteria).length + Object.keys(S.pending.rules).length;
  }
  window.addEventListener('beforeunload', function (e) { if (pendingCount()) { e.preventDefault(); e.returnValue = ''; } });

  function toast(msg, isErr) {
    var old = document.getElementById('toast');
    if (old) old.parentNode.removeChild(old);
    var t = h('div', { id: 'toast', class: 'toast' + (isErr ? ' err' : ''), role: 'status' }, msg);
    document.body.appendChild(t);
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, isErr ? 6500 : 2600);
  }
  function fail(e) { toast(e.message || String(e), true); }
  /** ことわりのダイアログ。buttons = [[文字, 値, class]]。 */
  function ask(title, body, buttons) {
    return new Promise(function (resolve) {
      var veil = h('div', { class: 'veil' });
      var box = h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true' },
        h('div', { class: 'row', style: { alignItems: 'flex-start' } }, note(46), h('div', { style: { flex: '1' } }, h('h3', null, title), body)),
        h('div', { class: 'row', style: { justifyContent: 'flex-end', marginTop: '14px' } }, buttons.map(function (b) {
          return h('button', { class: 'btn ' + (b[2] || ''), onclick: function () { document.body.removeChild(veil); resolve(b[1]); } }, b[0]);
        })));
      veil.appendChild(box);
      document.body.appendChild(veil);
    });
  }
  /** 変更の記録（だれが・いつ・どのマスを・何から何に）。まちがえた変更は、1つずつ「もとにもどす」。 */
  function showHistory() {
    leaveOk().then(function (ok) {
      if (!ok) return;
      var cd = S.cd, changed = false;
      var veil = h('div', { class: 'veil' });
      var listBox = h('div', { class: 'histlist' }, h('p', { class: 'muted' }, '読んでいます…'));
      var filter = h('input', { class: 'text', type: 'search', placeholder: '子どもの名前・テストの名前でしぼる', style: { flex: '1', minWidth: '200px' } });
      function close() { document.body.removeChild(veil); if (changed) reloadClass(); }
      var box = h('div', { class: 'dialog wide', role: 'dialog', 'aria-modal': 'true' },
        h('div', { class: 'row', style: { alignItems: 'flex-start' } }, note(46), h('div', { style: { flex: '1' } },
          h('h3', null, '🕘 変更の記録（' + cd.label + '）'),
          h('p', { class: 'small', style: { margin: '0 0 8px' } }, '保存した変更が、新しい順に出ます。まちがえた変更は「もとにもどす」で、そのマスだけ前の値にもどせます（ほかのマスは変わりません）。'),
          h('div', { class: 'row' }, filter))),
        listBox,
        h('div', { class: 'row', style: { justifyContent: 'flex-end', marginTop: '12px' } }, h('button', { class: 'btn sora', onclick: close }, 'とじる')));
      veil.appendChild(box);
      document.body.appendChild(veil);
      var all = [];
      function val(x, kind) { return x === '' || x === null || x === undefined ? '（空）' : x === '/' ? '‐' : (kind === 'score' ? x + '点' : x); }
      function draw() {
        clear(listBox);
        var q = filter.value.trim();
        var rows = all.filter(function (x) { return !q || (x.student + x.where).indexOf(q) !== -1; });
        if (!rows.length) { listBox.appendChild(h('p', { class: 'muted' }, all.length ? '合う記録がありません。' : 'まだ記録がありません（この版から、保存するたびに記録されます）。')); return; }
        listBox.appendChild(h('table', { class: 'form hist' },
          h('thead', null, h('tr', null, ['いつ', 'だれが', '子ども', 'どこ', '変えた内容', ''].map(function (t) { return h('th', null, t); }))),
          h('tbody', null, rows.map(function (x) {
            var what = x.kind === 'test' ? (x.isUndo ? 'テストをもどした' : 'テストを消した') :
              h('span', null, (x.kind === 'score' ? short(x.field) : (x.field === '評定' ? '評定' : short(x.field))) + '　', h('s', { class: 'muted' }, val(x.before, x.kind)), ' → ', h('b', null, val(x.after, x.kind)));
            var act;
            if (x.isUndo) act = h('span', { class: 'muted small' }, '（もとにもどした記録）');
            else if (x.undone) act = h('span', { class: 'muted small' }, '✓ もどしました');
            else act = h('button', { class: 'btn plain small', onclick: function (e) {
              e.target.disabled = true; e.target.textContent = 'もどしています…';
              call('undoHistory', cd.classKey, x.key).then(function () {
                changed = true; x.undone = 'いま';
                toast('もとにもどしました'); load();
              }).catch(function (err) { e.target.disabled = false; e.target.textContent = x.kind === 'test' ? 'テストをもどす' : 'もとにもどす'; fail(err); });
            } }, x.kind === 'test' ? 'テストをもどす' : 'もとにもどす');
            return h('tr', { class: x.isUndo ? 'muted' : '' }, h('td', { class: 'small', style: { whiteSpace: 'nowrap' } }, String(x.at).slice(5, 16)), h('td', { class: 'small' }, x.byName),
              h('td', null, x.student || '—'), h('td', { class: 'small' }, x.where), h('td', null, what), h('td', null, act));
          }))));
      }
      function load() {
        call('getHistory', cd.classKey).then(function (r) { all = r.list || []; draw(); }).catch(function (e) { clear(listBox); listBox.appendChild(h('p', { class: 'muted' }, e.message)); });
      }
      filter.addEventListener('input', draw);
      load();
    });
  }
  function leaveOk() {
    if (!pendingCount()) return Promise.resolve(true);
    return ask('保存していない入力があります', h('p', null, 'まだ保存していない入力が ' + pendingCount() + 'つ あります。どうしますか？'),
      [['もどる', 'back', 'plain'], ['保存しないで進む', 'drop', 'plain'], ['保存して進む', 'save', 'wakaba']]).then(function (v) {
      if (v === 'back') return false;
      if (v === 'drop') { S.pending = { scores: {}, manual: {}, criteria: {}, rules: {} }; S.base = { scores: {}, manual: {} }; return reloadClass().then(function () { return true; }); }
      return saveAll().then(function () { return true; });
    });
  }

  // ================= はじめ =================
  function start() {
    if (S.isDemo && !S.actingAs) { S.view = 'persona'; render(); return; }
    S.view = 'loading'; S.msg = 'ひらいています…'; render();
    call('bootstrap').then(function (b) {
      S.boot = b;
      S.view = b.role === 'admin' ? 'admin' : 'home';
      if (b.role === 'admin') return openAdmin();
      render();
    }).catch(function (e) { S.view = 'error'; S.msg = e.message; render(); });
  }
  function openClass(classKey) {
    S.view = 'loading'; S.msg = classKey.replace('-', '年') + '組の成績をひらいています…'; render();
    call('getClassData', classKey).then(function (cd) {
      S.cd = cd; S.classKey = classKey; S.view = 'class';
      cd._savedCriteria = JSON.parse(JSON.stringify(cd.criteria || {}));
      S.pending = { scores: {}, manual: {}, criteria: {}, rules: {} }; S.base = { scores: {}, manual: {} };
      if (S.onSaved) S.onSaved();
      if (!S.subject || !cd.subjects.some(function (x) { return x.name === S.subject; })) S.subject = cd.subjects[0].name;
      if (!S.term || (cd.terms.indexOf(S.term) === -1 && S.term !== YEAR)) S.term = cd.terms[0];
      if (!cd.tests.length) S.tab = 'tests';
      render();
      loadPeers(cd);
    }).catch(function (e) { fail(e); S.view = 'home'; render(); });
  }
  function reloadClass() {
    var old = S.cd;
    return call('getClassData', S.classKey).then(function (cd) {
      cd._savedCriteria = JSON.parse(JSON.stringify(cd.criteria || {}));
      if (old && old.classKey === cd.classKey && old.peers) cd.peers = old.peers;
      S.cd = cd; render();
      loadPeers(cd);
    }).catch(fail);
  }
  /** 学年のほかのクラスの人数（名前なし）は重いので、画面を出したあとに読む。 */
  function loadPeers(cd) {
    call('getPeers', cd.classKey).then(function (peers) {
      if (S.cd !== cd) return;
      cd.peers = peers || [];
      if (S.peerRedraw) S.peerRedraw();
    }).catch(function () { if (S.cd === cd && !cd.peers) { cd.peers = []; if (S.peerRedraw) S.peerRedraw(); } });
  }
  function openSetup() {
    S.view = 'loading'; S.msg = '学校の設定をひらいています…'; render();
    call('getSchoolSetup').then(function (st) {
      S.setup = st; S.view = 'setup';
      render();
    }).catch(function (e) { fail(e); S.view = 'home'; render(); });
  }
  function openAdmin() {
    return call('getAdminView').then(function (a) { S.admin = a; S.view = 'admin'; render(); }).catch(function (e) { S.view = 'error'; S.msg = e.message; render(); });
  }

  // ================= わく =================
  function render() {
    var root = document.getElementById('app');
    clear(root);
    var who = S.boot ? (S.boot.schoolName ? S.boot.schoolName + '　' : '') + S.boot.name + (S.boot.role === 'admin' ? '' : ' 先生') : '';

      h('button', { class: 'head', title: 'メニューにもどる', onclick: goHome }, logo(), h('div', null, h('h1', null, 'せいせきノート'), h('div', { class: 'sub' }, 'テストの点から、通知表・要録・GGまで'))),
      who ? h('div', { class: 'who' }, who) : null));
    if (S.isDemo) root.appendChild(h('div', { class: 'demo-bar' }, '🧸 デモ（名前も点数も作りものです）',
      S.actingAs ? h('button', { class: 'linkbtn', onclick: function () { S.actingAs = null; S.boot = null; start(); } }, '体験する人をかえる') : null));
    var body;
    if (S.view === 'loading') body = h('div', { class: 'loading' }, h('div', { class: 'hop' }, pencil(80, '#F2C230', -20)), h('p', null, S.msg));
    else if (S.view === 'error') body = h('div', { class: 'page empty' }, stillLife(70), h('span', { class: 'title' }, 'ひらけませんでした'), h('p', null, S.msg),
      h('button', { class: 'btn', onclick: start }, 'もう一度ためす'));
    else if (S.view === 'persona') body = viewPersona();
    else if (S.view === 'home') body = viewHome();
    else if (S.view === 'class') body = viewClass();
    else if (S.view === 'setup') body = viewSetup();
    else if (S.view === 'admin') body = viewAdmin();
    root.appendChild(body);

  /** メニュー（ホーム）にもどる。保存していない入力があれば、先にたずねる。 */
  function goHome() {
    if (!S.boot || S.view === 'loading' || S.view === 'persona') return;
    if (S.boot.role !== 'teacher') { if (S.view !== 'admin') openAdmin(); return; }
    leaveOk().then(function (ok) { if (ok) { S.view = 'home'; S.cd = null; render(); window.scrollTo(0, 0); } });
  }
  function viewPersona() {
    return h('div', { class: 'page' }, h('h2', null, h('span', { class: 'wash' }, 'だれとして体験しますか？')),
      h('div', { class: 'grid3' }, S.personas.map(function (p) {
        return h('button', { class: 'btn plain', style: { padding: '14px', textAlign: 'left' }, onclick: function () { S.actingAs = p.email; start(); } }, p.label);
      })));
  }

  // ================= ホーム（本だな） =================
  function viewHome() {
    var b = S.boot;
    var wrap = h('div', { class: 'stack' });
    wrap.appendChild(h('div', { class: 'say' }, pencil(64, '#F2C230', -20), h('div', { class: 'bubble' },

    if (!b.classes.length) {
      wrap.appendChild(h('div', { class: 'page empty' }, stillLife(70), h('span', { class: 'title' }, 'まだ担当のクラスがありません'),

    } else {
      wrap.appendChild(h('div', { class: 'page' }, h('h2', null, h('span', { class: 'wash sakura' }, 'わたしのクラス')),
        h('div', { class: 'books' }, b.classes.map(function (c, i) {
          return h('button', { class: 'book c' + (i % 6), onclick: function () { openClass(c.classKey); } },
            h('div', { class: 'bl' }, c.label), h('div', { class: 'bs' }, c.count + '人'), pencil(84, PENCILS[i % PENCILS.length], -20));

        h('div', null, h('b', null, 'アプリ管理'), h('div', { class: 'muted' }, '学校の登録・利用中／休止')),
        h('span', { class: 'spacer' }), h('button', { class: 'btn fuji', onclick: function () { S.view = 'loading'; S.msg = 'ひらいています…'; render(); openAdmin(); } }, 'ひらく')));
    }
    if (b.isSetup) {
      wrap.appendChild(h('div', { class: 'card soft row' }, h('span', { style: { fontSize: '28px' } }, '🔧'),
        h('div', null, h('b', null, '学校の設定'), h('div', { class: 'muted' }, '名簿の取り込み・担任の割り当て')),
        h('span', { class: 'spacer' }), h('button', { class: 'btn sora', onclick: openSetup }, 'ひらく')));
    }
    return wrap;
  }

  // ================= クラス =================
  var CLASS_TABS = [
    ['tests', '📚', 'テストの登録', 't1'], ['scores', '✏️', '点数を入れる', 't2'], ['term', '🌸', '学期の成績', 't3'],
    ['year', '📖', '要録（1年間）', 't4'], ['kohyo', '📄', '個票', 't5']
  ];
  function viewClass() {
    var cd = S.cd;
    var wrap = h('div', null);
    wrap.appendChild(h('div', { class: 'row board-row', style: { margin: '6px 0 6px' } },
      h('button', { class: 'linkbtn', onclick: function () { leaveOk().then(function (ok) { if (ok) { S.view = 'home'; S.cd = null; render(); } }); } }, '← メニューにもどる'),
      h('h2', { class: 'title', style: { margin: '0 0 0 8px', fontSize: '26px' } }, cd.label), h('span', { class: 'muted' }, cd.students.length + '人・' + cd.termSystem),
      h('span', { class: 'spacer' }),
      h('button', { class: 'linkbtn', title: 'だれが・いつ・どのマスを変えたか。まちがえて消したときは、ここからもどせます', onclick: showHistory }, '🕘 変更の記録')));
    wrap.appendChild(h('nav', { class: 'shelf' }, CLASS_TABS.map(function (t) {
      return h('button', { class: 'tab ' + t[3] + (S.tab === t[0] ? ' on' : ''), onclick: function () {
        if (S.tab === t[0]) return;
        leaveOk().then(function (ok) { if (ok) { S.tab = t[0]; render(); } });
      } }, h('span', { class: 'ico' }, t[1]), t[2]);
    })));
    var page = h('div', { class: 'page' });
    S.onSaved = null;
    fixTerm(S.tab === 'kohyo' || S.tab === 'year');
    var v = { tests: viewTests, scores: viewScores, term: viewTerm, year: viewYear, kohyo: viewKohyo }[S.tab] || viewScores;
    page.appendChild(v());
    wrap.appendChild(page);
    return wrap;
  }
  function subjectOf() { return S.cd.subjects.filter(function (x) { return x.name === S.subject; })[0] || S.cd.subjects[0]; }

  /** このクラスの人数（いまの基準で）: 観点は学期の計算の評価、テストはテストごとの評価。 */

      var te = SL.termEval(cd, sub, st.key, term);
      te.kanten.forEach(function (x) { if (out.kanten[x.label] && x.auto) out.kanten[x.label][x.auto]++; });
    });
    SL.testsOf(cd, sub.name, term).forEach(function (t) {

          h('select', { class: 'text', 'aria-label': '学期制', onchange: function (e) { f.termSystem = e.target.value; } }, ['3学期制', '2学期制'].map(function (t) { return h('option', { value: t }, t); }))),
        h('div', { class: 'row', style: { marginTop: '8px' } }, inp('email', '設定担当の先生のメール', '260px'), inp('teacherName', '先生の名前'),
          h('button', { class: 'btn wakaba', onclick: function (ev) {
            if (!f.schoolId) { toast('学校をえらんでください', true); return; }
            ev.target.disabled = true;
            call('registerSchool', f).then(function (r) {
              S.admin = r;
              toast('登録しました');
              // 登録した人が自分なら、そのまま先生の画面へ（読みこみなおさなくてよい）
              return call('bootstrap').then(function (b) { S.boot = b; S.view = b.role === 'teacher' ? 'home' : 'admin'; render(); });
            }).catch(function (e) { ev.target.disabled = false; fail(e); });
          } }, '登録する')),
        h('p', { class: 'muted small' }, '登録した先生（設定担当）は、アプリをひらくと「学校の設定」から名簿を取り込めます。')));
  }

  start();
})();
</script>
