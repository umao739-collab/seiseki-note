<script>
/*
 * App.html — せいせきノートの画面。
 *
 * ★利用者の文字（名前・単元名・所見）は textContent でだけ出す。HTML を文字列で差しこまない
 *   （tools/run-local-tests.js が見張る）。
 * ★成績はこの画面の中だけで分析する。サーバーに送り返すのは、保存する所見の文と設定だけ。
 * ★どのファイルを読むかはサーバーが決める（本人がえらんだファイルだけ）。
 */
(function () {
  'use strict';
  var SL = window.SL;
  var ALL = SL.ALL_TERMS;
  var SUBJECT_COLOR = { '国語': '#E3779A', '社会': '#EE9550', '算数': '#5FA8E0', '理科': '#4FB68C', '生活': '#8DB955',
    '音楽': '#A884D6', '図工': '#E9B230', '家庭': '#E08E6D', '体育': '#3FA9B8', '外国語': '#7F8FD8' };
  function colorOf(sub) { return SUBJECT_COLOR[sub] || '#B59A80'; }

  // ================= 小さな道具 =================
  /** 要素を作る。props の on* はイベント、class・style・value・checked などはそのまま。子は文字か要素。 */
  function h(tag, props) {
    var el = document.createElement(tag);
    var kids = Array.prototype.slice.call(arguments, 2);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'class') el.className = v;
      else if (k === 'style') Object.keys(v).forEach(function (s) { el.style[s] = v[s]; });
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
      else el.setAttribute(k, String(v));
    });
    add(el, kids);
    return el;
  }
  function add(el, kids) {
    kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) add(el, c);
      else el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    });
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs) {
    var el = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, String(attrs[k])); });
    add(el, Array.prototype.slice.call(arguments, 2));
    return el;
  }
  function pct(v) { return v === null || v === undefined ? '—' : Math.round(v) + '%'; }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  /** マスコット「ノートちゃん」（オリジナルの絵）。 */
  function mascot(size, mood) {
    var mouth = mood === 'wow' ? s('ellipse', { cx: 32, cy: 41, rx: 4, ry: 5, fill: '#7A4B3A' })
      : s('path', { d: 'M25 39 Q32 46 39 39', stroke: '#7A4B3A', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' });
    return s('svg', { width: size, height: size, viewBox: '0 0 64 64', 'aria-hidden': 'true' },
      s('rect', { x: 9, y: 8, width: 46, height: 50, rx: 12, fill: '#FFE6DC', stroke: '#FF8F6B', 'stroke-width': 3 }),
      s('line', { x1: 17, y1: 8, x2: 17, y2: 58, stroke: '#FF8F6B', 'stroke-width': 2, 'stroke-dasharray': '3 4' }),
      s('path', { d: 'M38 9 L38 0 Q46 4 44 10', fill: '#4FB68C' }),
      s('circle', { cx: 26, cy: 30, r: 3.2, fill: '#4A3F35' }),
      s('circle', { cx: 40, cy: 30, r: 3.2, fill: '#4A3F35' }),
      s('circle', { cx: 21, cy: 37, r: 3.5, fill: '#FFB3A0', opacity: .8 }),
      s('circle', { cx: 45, cy: 37, r: 3.5, fill: '#FFB3A0', opacity: .8 }),
      mouth);
  }

  // ================= サーバーとのやりとり =================
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || 'うまくいきませんでした。'));
      });
      r[fn].apply(r, args);
    });
  }

  // ================= 状態 =================
  var S = {
    boot: null, model: null, settings: null, view: 'loading', loadingMsg: '',
    term: null, subject: null, sel: null,
    files: null, fileMsg: '',
    drafts: {}, seeds: {},
    kohyo: { avg: true, shoken: true },
    toast: null
  };

  function toast(msg, isErr) {
    S.toast = { msg: msg, err: !!isErr };
    renderToast();
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { S.toast = null; renderToast(); }, isErr ? 6000 : 2600);
  }
  function renderToast() {
    var old = document.getElementById('toast');
    if (old) old.parentNode.removeChild(old);
    if (S.toast) document.body.appendChild(h('div', { id: 'toast', class: 'toast' + (S.toast.err ? ' err' : ''), role: 'status' }, S.toast.msg));
  }
  function fail(e) { toast(e.message || String(e), true); }

  function go(view) { S.view = view; render(); window.scrollTo(0, 0); }

  function studentsOf() { return S.model ? S.model.students : []; }
  function selStudent() {
    var list = studentsOf();
    if (!list.length) return null;
    if (S.sel === null || !list.some(function (x) { return x.idx === S.sel; })) S.sel = list[0].idx;
    return list.filter(function (x) { return x.idx === S.sel; })[0];
  }
  function profileOf(idx) { return SL.profile(S.model, idx, S.term, S.settings); }
  function isDemo() { return S.model && S.model.source === 'demo'; }
  function gradeLabel() {
    var m = S.model.meta;
    return (m.grade || '') + (m.className ? m.className + '組' : '');
  }

  // ================= はじめ =================
  function start() {
    S.view = 'loading'; S.loadingMsg = 'ひらいています…'; render();
    call('bootstrap').then(function (b) {
      S.boot = b; S.settings = b.settings;
      S.kohyo.avg = b.settings.showClassAvg;
      if (b.file) return loadMine();
      S.fileMsg = b.fileProblem || '';
      go('setup');
    }).catch(function (e) { S.view = 'error'; S.loadingMsg = e.message; render(); });
  }
  function useModel(m) {
    SL.analyze(m);
    S.model = m;
    var terms = m.termLabels.filter(function (t) {
      return m.subjects.some(function (sub) { return sub.units.some(function (u) { return u.term === t && u._st.entered > 0; }); });
    });
    S.term = terms.length ? terms[terms.length - 1] : (m.termLabels[0] || ALL);
    S.subject = m.subjects.length ? m.subjects[0].name : null;
    S.sel = null; S.drafts = {}; S.seeds = {};
    go('home');
  }
  function loadMine() {
    S.view = 'loading'; S.loadingMsg = '成績を読みこんでいます…（10秒ほどかかることがあります）'; render();
    return call('loadMyClass').then(useModel).catch(function (e) { S.fileMsg = e.message; go('setup'); });
  }
  function loadDemo() {
    S.view = 'loading'; S.loadingMsg = '見本のクラスを用意しています…'; render();
    call('loadDemoClass').then(useModel).catch(fail);
  }

  // ================= 画面のわく =================
  var TABS = [
    ['home', '🏠', 'ホーム'], ['kohyo', '📄', '個票'], ['class', '📊', 'クラスの傾向'],
    ['shoken', '✏️', '所見づくり'], ['check', '🔍', '入れわすれ'], ['settings', '⚙️', '設定']
  ];
  function render() {
    var root = document.getElementById('app');
    clear(root);
    var top = h('div', { class: 'top' },
      h('div', { class: 'brand' }, mascot(46), h('div', null, h('b', null, 'せいせきノート'), h('small', null, 'SMILEスプレッドシートの成績から'))),
      S.model ? h('div', { class: 'file-chip' + (isDemo() ? ' demo' : ''), title: S.model.fileName }, (isDemo() ? '🧸 ' : '📗 ') + S.model.fileName) : null);
    root.appendChild(top);
    if (S.view === 'loading') { root.appendChild(h('div', { class: 'loading' }, h('div', { class: 'm' }, mascot(80)), h('p', null, S.loadingMsg))); return; }
    if (S.view === 'error') {
      root.appendChild(h('div', { class: 'card empty' }, mascot(80, 'wow'), h('b', null, 'ひらけませんでした'), h('p', null, S.loadingMsg),
        h('button', { class: 'btn', onclick: start }, 'もう一度ためす')));
      return;
    }
    if (S.view === 'setup' || !S.model) { root.appendChild(viewSetup()); return; }
    root.appendChild(h('nav', { class: 'tabs' }, TABS.map(function (t) {
      return h('button', { class: 'tab' + (S.view === t[0] ? ' on' : ''), onclick: function () { go(t[0]); } }, h('span', { class: 'ico' }, t[1]), t[2]);
    })));
    if (['home', 'kohyo', 'class', 'shoken'].indexOf(S.view) !== -1) root.appendChild(termBar());
    var v = { home: viewHome, kohyo: viewKohyo, class: viewClass, shoken: viewShoken, check: viewCheck, settings: viewSettings }[S.view] || viewHome;
    root.appendChild(v());
  }
  function termBar() {
    var terms = S.model.termLabels.concat([ALL]);
    return h('div', { class: 'termbar' }, h('span', { class: 'q' }, 'いつの成績？'),
      terms.map(function (t) { return h('button', { class: 'chip' + (S.term === t ? ' on' : ''), onclick: function () { S.term = t; render(); } }, t); }));
  }

  // ================= はじめに（ファイルをえらぶ） =================
  function viewSetup() {
    var wrap = h('div', null);
    wrap.appendChild(h('div', { class: 'hello', style: { marginBottom: '14px' } }, mascot(70),
      h('div', { class: 'bubble' }, h('b', null, 'はじめまして！'), h('div', null, 'いつも使っている「SMILEスプレッドシート」をえらぶだけで、個票・クラスの傾向・所見の下書きが作れます。'))));
    wrap.appendChild(h('div', { class: 'steps' },
      h('div', { class: 'step' }, h('i', null, '1'), 'ファイルをえらぶ'),
      h('div', { class: 'step' }, h('i', null, '2'), '読みこみ（自動）'),
      h('div', { class: 'step' }, h('i', null, '3'), 'できあがり！')));
    if (S.fileMsg) wrap.appendChild(h('div', { class: 'alert' }, '⚠️', h('div', null, S.fileMsg)));

    var list = h('div', { class: 'filelist' });
    var card = h('div', { class: 'card' }, h('h2', null, '📗 あなたのSMILEファイル', h('span', { class: 'sub' }, '名前に「SMILE」が入っているスプレッドシート')), list);
    function fill() {
      clear(list);
      if (S.files === null) { list.appendChild(h('p', { class: 'muted' }, 'さがしています…')); return; }
      if (!S.files.length) { list.appendChild(h('p', { class: 'muted' }, '見つかりませんでした。下にURLをはりつけてください。')); return; }
      S.files.forEach(function (f) {
        list.appendChild(h('button', { onclick: function () { choose(function () { return call('chooseFile', f.id); }); } },
          '📗', h('span', null, f.name), h('span', { class: 'd' }, f.updated + ' 更新')));
      });
    }
    fill();
    if (S.files === null) call('findMyFiles').then(function (fs) { S.files = fs; fill(); }).catch(function (e) { S.files = []; fill(); fail(e); });
    wrap.appendChild(card);

    var url = h('input', { class: 'text', type: 'url', placeholder: 'https://docs.google.com/spreadsheets/d/…', 'aria-label': 'SMILEファイルのURL' });
    wrap.appendChild(h('div', { class: 'card' }, h('h2', null, '🔗 URLをはりつけてえらぶ'),
      h('div', { class: 'row' }, h('div', { style: { flex: '1', minWidth: '240px' } }, url),
        h('button', { class: 'btn', onclick: function () { choose(function () { return call('chooseFileByUrl', url.value); }); } }, 'このファイルにする'))));

    wrap.appendChild(h('div', { class: 'card' }, h('h2', null, '🧸 まずは見本でためす'),
      h('p', { class: 'muted' }, '架空のクラス（名前も点数も作りもの）で、どんなことができるか見られます。あなたのファイルは読みません。'),
      h('button', { class: 'btn mint', onclick: loadDemo }, '見本のクラスをひらく')));
    wrap.appendChild(safetyCard());
    return wrap;
  }
  function choose(fn) {
    S.view = 'loading'; S.loadingMsg = 'ファイルを確かめています…'; render();
    fn().then(function () { S.fileMsg = ''; return loadMine(); }).catch(function (e) { S.fileMsg = e.message; go('setup'); });
  }
  function safetyCard() {
    return h('div', { class: 'card' }, h('h2', null, '🔒 安心のしくみ'),
      h('ul', { class: 'small', style: { margin: '0', paddingLeft: '20px' } },
        h('li', null, '成績は、あなたのSMILEファイルから「読むだけ」です。ほかの場所に写したり、送ったりしません。'),
        h('li', null, 'このアプリは、開いたあなたの権限で動きます。あなたが開けないファイルは読めません。'),
        h('li', null, '所見を保存するときだけ、あなたのファイルに「所見メモ」シートを足して書きます。ほかのシートは変えません。'),
        h('li', null, '「AIに頼む文」には、名前・番号・点数は入りません。')));
  }

  // ================= ホーム =================
  function viewHome() {
    var m = S.model;
    var wrap = h('div', null);
    var subjects = SL.overview(m, S.term);
    wrap.appendChild(h('div', { class: 'hello', style: { marginBottom: '14px' } }, mascot(64),
      h('div', { class: 'bubble' }, h('b', null, gradeLabel() + 'の成績を読みこみました！'),
        h('div', { class: 'muted' }, m.students.length + '人 ・ ' + m.subjects.length + '教科 ・ ' + (m.meta.termSystem || '')))));
    if (isDemo()) wrap.appendChild(h('div', { class: 'note', style: { marginBottom: '14px' } }, '🧸 これは見本のデータです（架空の名前と点数）。自分のファイルを使うときは「⚙️ 設定」からえらんでください。'));
    var miss = SL.missingCheck(m);
    var missN = miss.reduce(function (a, x) { return a + x.missing.length; }, 0);
    if (missN) {
      wrap.appendChild(h('div', { class: 'alert' }, h('span', { style: { fontSize: '26px' } }, '🔍'),
        h('div', null, h('b', null, '点数が空いているところが ' + missN + 'か所 あります'), h('div', { class: 'small' }, '入れわすれか、おやすみかを確かめておくと安心です。')),
        h('span', { class: 'spacer' }), h('button', { class: 'btn ghost', onclick: function () { go('check'); } }, '見てみる')));
    }
    wrap.appendChild(h('div', { class: 'card' }, h('h2', null, '📚 教科ごとの学級平均', h('span', { class: 'sub' }, S.term + '・テストの到達率')),
      h('div', { class: 'grid g3' }, subjects.map(function (x) {
        return h('button', { class: 'tile', onclick: function () { S.subject = x.subject; go('class'); } },
          h('span', { class: 'band', style: { background: colorOf(x.subject) } }),
          h('div', { style: { paddingLeft: '8px' } }, h('div', { class: 'nm' }, x.subject),
            h('div', { class: 'val' }, x.avg === null ? 'まだ' : Math.round(x.avg), x.avg === null ? null : h('small', null, '%')),
            h('div', { class: 'muted small' }, x.units ? 'テスト ' + x.units + '回ぶん' : 'この時期のテストはまだありません')));
      }))));
    function action(em, title, desc, view) {
      return h('button', { class: 'action', onclick: function () { go(view); } }, h('span', { class: 'em' }, em), h('div', null, h('b', null, title), h('span', { class: 'muted small' }, desc)));
    }
    wrap.appendChild(h('div', { class: 'grid g3' },
      action('📄', '個票をつくる', '一人ずつの「とくい」「のびしろ」がひと目でわかるシート。印刷・PDFにできます。', 'kohyo'),
      action('📊', 'クラスの傾向を見る', 'つまずきやすかった単元や、気にかけたい子がわかります。', 'class'),
      action('✏️', '所見の下書きをつくる', 'テストの結果から文の下書き。直してそのまま保存できます。', 'shoken')));
    return wrap;
  }

  // ================= 個票 =================
  function rosterList(onPick, dotOf) {
    return h('div', { class: 'roster' }, studentsOf().map(function (st) {
      return h('button', { class: S.sel === st.idx ? 'on' : '', onclick: function () { S.sel = st.idx; onPick(); } },
        h('span', { class: 'no' }, st.no), h('span', null, st.name), dotOf ? h('span', { class: 'dot ' + dotOf(st) }) : null);
    }));
  }
  function moveSel(d) {
    var list = studentsOf();
    var i = list.findIndex(function (x) { return x.idx === S.sel; });
    var n = list[Math.min(list.length - 1, Math.max(0, i + d))];
    if (n) { S.sel = n.idx; render(); }
  }
  function viewKohyo() {
    var st = selStudent();
    if (!st) return h('div', { class: 'card empty' }, '名簿に子どもがいません。');
    var p = profileOf(st.idx);
    var tools = h('div', { class: 'card row', style: { padding: '12px 16px' } },
      h('button', { class: 'btn ghost', onclick: function () { moveSel(-1); } }, '◀ 前の子'),
      h('button', { class: 'btn ghost', onclick: function () { moveSel(1); } }, '次の子 ▶'),
      h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: S.kohyo.avg, onchange: function (e) { S.kohyo.avg = e.target.checked; render(); } }), '学級平均も表示'),
      h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: S.kohyo.shoken, onchange: function (e) { S.kohyo.shoken = e.target.checked; render(); } }), '所見も入れる'),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn sky', onclick: function () { printSheets([st]); } }, '🖨 この子を印刷'),
      h('button', { class: 'btn', onclick: function () { printSheets(studentsOf()); } }, '🖨 全員を印刷'));
    return h('div', { class: 'split' }, rosterList(render),
      h('div', null, tools, reportSheet(p), h('p', { class: 'muted small' }, '💡 印刷の画面で「送信先」を「PDFに保存」にすると、PDFにできます。')));
  }
  function shokenTextOf(idx, no) {
    var key = idx + '|' + S.term;
    if (S.drafts[key] !== undefined) return S.drafts[key];
    var saved = S.model.shoken[no + '|' + S.term];
    return saved ? saved.text : '';
  }
  function barRow(label, rate, classRate, color, showAvg) {
    return h('div', { class: 'bar' }, h('span', { class: 'lb', title: label }, label),
      h('div', { class: 'track' },
        h('div', { class: 'fill', style: { width: Math.max(0, Math.min(100, rate || 0)) + '%', background: color } }),
        showAvg && classRate !== null ? h('div', { class: 'avgmark', title: '学級平均 ' + pct(classRate), style: { left: 'calc(' + Math.min(100, classRate) + '% - 1px)' } }) : null),
      h('span', { class: 'v' }, pct(rate)));
  }
  function evBadge(ev) { return h('span', { class: 'ev ' + (ev || 'none') }, ev || '・'); }
  function reportSheet(p) {
    var m = S.model;
    var showAvg = S.kohyo.avg;
    var head = h('div', { class: 'sheet-head' },
      h('div', null, h('div', { class: 'ribbon' }, '学習のようす'), h('div', { class: 'muted small', style: { marginTop: '4px' } }, p.term + '・テストの結果から')),
      h('div', { class: 'sheet-name' }, h('small', null, gradeLabel() + '　' + p.no + '番'), h('b', null, p.name)));
    function li(x) { return h('li', null, x.subject + '「' + SL.shortLabel(x.label) + '」' + (x.unit ? '（' + x.unit + '）' : '')); }
    var points = h('div', { class: 'points' },
      h('div', { class: 'pbox good' }, h('h4', null, '★ とくいなところ'),
        p.strengths.length ? h('ul', null, p.strengths.map(li)) : h('div', { class: 'small' }, p.best ? p.best.subject + '「' + SL.shortLabel(p.best.label) + '」がよく育っています' : 'これから見つけていこう')),
      p.growth.length ? h('div', { class: 'pbox up' }, h('h4', null, '↗ のびたところ'),
        h('ul', null, p.growth.map(function (g) { return h('li', null, g.subject + '（' + g.from + 'より）'); }))) : null,
      h('div', { class: 'pbox grow' }, h('h4', null, '🌱 のびしろ'),
        p.challenges.length ? h('ul', null, p.challenges.map(li)) : h('div', { class: 'small' }, 'どの教科も、よくがんばっています')));
    var grid = h('div', { class: 'subjgrid' }, p.subjects.map(function (sm) {
      var color = colorOf(sm.name);
      var shown = sm.units.slice(0, 9);
      return h('div', { class: 'scard' },
        h('div', { class: 'hd' }, h('span', { class: 'spill', style: { background: color } }, sm.name), evBadge(sm.eval),
          h('span', { class: 'rt' }, pct(sm.rate))),
        sm.kanten.map(function (k) { return barRow(SL.shortLabel(k.label), k.rate, k.classRate, color, showAvg); }),
        h('div', { class: 'ulist' }, shown.map(function (u) {
          return h('div', null, evBadge(u.eval), h('span', { class: 'u', title: u.name }, u.name),
            u.tag === 'good' ? h('span', { class: 'tag good' }, '★') : u.tag === 'grow' ? h('span', { class: 'tag grow' }, '🌱') : u.tag === 'missing' ? h('span', { class: 'tag miss' }, '未') : null,
            h('span', { class: 'r' }, pct(u.rate)));
        }), sm.units.length > shown.length ? h('div', { class: 'muted' }, '…ほか ' + (sm.units.length - shown.length) + '単元') : null));
    }));
    var text = S.kohyo.shoken ? shokenTextOf(p.idx, p.no) : '';
    return h('div', { class: 'sheet' }, head, points, grid,
      text ? h('div', { class: 'sheet-msg' }, h('h4', null, '先生から'), h('div', { style: { whiteSpace: 'pre-wrap' } }, text)) : null,
      h('div', { class: 'sheet-foot' }, h('span', null, showAvg ? '｜の線は学級平均です' : ''), h('span', null, 'せいせきノート')));
  }
  function printSheets(list) {
    var pr = document.getElementById('print');
    clear(pr);
    list.forEach(function (st) { pr.appendChild(reportSheet(profileOf(st.idx))); });
    setTimeout(function () { window.print(); }, 50);
  }

  // ================= クラスの傾向 =================
  function viewClass() {
    var m = S.model;
    var wrap = h('div', null);
    wrap.appendChild(h('div', { class: 'row', style: { marginBottom: '12px' } }, m.subjects.map(function (sub) {
      var on = S.subject === sub.name;
      return h('button', { class: 'chip' + (on ? ' on' : ''), style: on ? { background: colorOf(sub.name), borderColor: colorOf(sub.name) } : null,
        onclick: function () { S.subject = sub.name; render(); } }, sub.name);
    })));
    var c = SL.classView(m, S.subject, S.term, S.settings);
    if (!c || !c.units.length) { wrap.appendChild(h('div', { class: 'card empty' }, mascot(70), h('b', null, 'この時期のテストはまだありません'))); return wrap; }
    var color = colorOf(c.subject);
    wrap.appendChild(h('div', { class: 'grid g2' },
      h('div', { class: 'card' }, h('h2', null, '🌟 学級の平均', h('span', { class: 'sub' }, c.subject + '・' + c.term)),
        h('div', { style: { fontSize: '44px', fontWeight: '900', color: color, lineHeight: '1.1', marginBottom: '8px' } }, pct(c.avg)),
        c.kanten.map(function (k) { return barRow(SL.shortLabel(k.label), k.avg, null, color, false); })),
      h('div', { class: 'card' }, h('h2', null, '💡 つまずきやすかった単元'),
        c.weakUnits.length ? h('div', null, c.weakUnits.map(function (u) {
          return h('div', { class: 'row', style: { marginBottom: '6px' } }, h('span', { class: 'tag grow' }, u.term), h('b', null, u.name), h('span', { class: 'spacer' }), h('b', null, '平均 ' + pct(u.avg)));
        })) : h('p', { class: 'muted' }, 'どの単元も平均85%以上です。すばらしい！'),
        c.hint ? h('div', { class: 'note', style: { marginTop: '10px' } }, h('b', null, '「' + c.hint.label + '」が少し低めです。'), h('div', null, c.hint.text)) : null)));

    var legend = h('div', { class: 'legend', style: { marginBottom: '8px' } },
      h('span', null, h('i', { style: { background: 'var(--A)' } }), 'A'), h('span', null, h('i', { style: { background: 'var(--B)' } }), 'B'), h('span', null, h('i', { style: { background: 'var(--C)' } }), 'C'));
    wrap.appendChild(h('div', { class: 'card' }, h('h2', null, '📈 単元ごとのようす', h('span', { class: 'sub' }, '平均の到達率と、A・B・Cの人数')), legend,
      c.units.map(function (u) {
        var t = u.abc.A + u.abc.B + u.abc.C || 1;
        return h('div', { class: 'bar', style: { gridTemplateColumns: 'minmax(120px, 220px) 1fr 1fr 46px' } },
          h('span', { class: 'lb', title: u.name }, (S.term === ALL ? u.term + '　' : '') + u.name),
          h('div', { class: 'stack', title: 'A ' + u.abc.A + '人・B ' + u.abc.B + '人・C ' + u.abc.C + '人' },
            h('span', { style: { width: (u.abc.A / t * 100) + '%', background: 'var(--A)' } }),
            h('span', { style: { width: (u.abc.B / t * 100) + '%', background: 'var(--B)' } }),
            h('span', { style: { width: (u.abc.C / t * 100) + '%', background: 'var(--C)' } })),
          h('div', { class: 'track' }, h('div', { class: 'fill', style: { width: (u.avg || 0) + '%', background: color } })),
          h('span', { class: 'v' }, pct(u.avg)));
      })));

    wrap.appendChild(h('div', { class: 'card' }, h('h2', null, '🤝 気にかけたい子', h('span', { class: 'sub' }, '到達率が' + S.settings.weakRate + '%より低いか、Cが2つ以上（この画面だけに出ます・印刷されません）')),
      c.support.length ? h('div', { class: 'row' }, c.support.map(function (r) {
        return h('button', { class: 'chip', onclick: function () { S.sel = r.idx; go('kohyo'); } }, r.no + ' ' + r.name + '（' + pct(r.rate) + (r.cCount ? '・C' + r.cCount : '') + '）');
      })) : h('p', { class: 'muted' }, '今のところ、とくに気になる子はいません。')));

    var table = h('table', { class: 'heat' },
      h('thead', null, h('tr', null, h('th', null, ''), c.units.map(function (u) { return h('th', { class: 'u', title: u.name }, u.name); }), h('th', null, '平均'))),
      h('tbody', null, c.rows.map(function (r) {
        return h('tr', null, h('td', { class: 'nm', onclick: function () { S.sel = r.idx; go('kohyo'); } }, r.no + ' ' + r.name),
          r.cells.map(function (cell) { return cell ? h('td', { class: 'h' + cell.eval, title: pct(cell.rate) }, Math.round(cell.rate)) : h('td', { class: 'h0' }, '・'); }),
          h('td', { style: { fontWeight: '900' } }, r.rate === null ? '—' : Math.round(r.rate)));
      })));
    wrap.appendChild(h('div', { class: 'card' }, h('h2', null, '🗂 一覧表', h('span', { class: 'sub' }, '数字は到達率（%）・色はA/B/C。名前をおすと個票へ')), h('div', { class: 'heatwrap' }, table)));
    return wrap;
  }

  // ================= 所見づくり =================
  function savedOf(st) { return S.model.shoken[st.no + '|' + S.term]; }
  function dotOf(st) {
    var key = st.idx + '|' + S.term;
    var saved = savedOf(st);
    if (S.drafts[key] !== undefined && (!saved || saved.text !== S.drafts[key])) return 'draft';
    return saved && saved.text ? 'saved' : '';
  }
  function makeDraft(st) {
    var key = st.idx + '|' + S.term;
    return SL.shoken(profileOf(st.idx), { seed: S.seeds[key] || 0, length: S.settings.shokenLength, includeChallenge: S.settings.includeChallenge });
  }
  function copyText(text, done) {
    function fallback() {
      var ta = h('textarea', { style: { position: 'fixed', left: '-9999px' } });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) toast(done); else toast('コピーできませんでした。文をえらんで、Ctrl+C でコピーしてください。', true);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(done); }, fallback);
    else fallback();
  }
  function saveItems(items, okMsg) {
    if (isDemo()) { toast('見本のクラスでは保存できません（自分のファイルで使ってください）', true); return Promise.resolve(); }
    return call('saveShoken', items).then(function (r) {
      items.forEach(function (it) {
        S.model.shoken[it.no + '|' + it.term] = { text: it.text, at: r.savedAt };
        var st = studentsOf().filter(function (x) { return x.no === it.no; })[0];
        if (st) delete S.drafts[st.idx + '|' + it.term];
      });
      toast(okMsg);
      render();
    }).catch(fail);
  }
  function viewShoken() {
    var st = selStudent();
    if (!st) return h('div', { class: 'card empty' }, '名簿に子どもがいません。');
    var key = st.idx + '|' + S.term;
    var p = profileOf(st.idx);
    var saved = savedOf(st);
    var current = S.drafts[key] !== undefined ? S.drafts[key] : saved ? saved.text : '';
    var target = SL.SHOKEN_TARGET[S.settings.shokenLength];

    var counter = h('span', { class: 'count' });
    var ta = h('textarea', { class: 'shoken', 'aria-label': '所見', maxlength: 800, placeholder: '「✨ 下書きをつくる」をおすと、ここに文が入ります。そのまま直せます。' });
    ta.value = current;
    function updateCount() {
      counter.textContent = ta.value.length + '字 ／ 目安 ' + target + '字';
      counter.className = 'count' + (ta.value.length > target * 1.2 ? ' over' : '');
    }
    ta.addEventListener('input', function () { S.drafts[key] = ta.value; updateCount(); });
    updateCount();
    function setDraft(text) { S.drafts[key] = text; ta.value = text; updateCount(); }

    var lens = [['short', '短め'], ['normal', 'ふつう'], ['long', '長め']];
    var chips = h('div', { class: 'row', style: { marginBottom: '10px' } },
      p.strengths.map(function (x) { return h('span', { class: 'tag good' }, '★ ' + x.subject + '・' + SL.shortLabel(x.label)); }),
      p.growth.map(function (x) { return h('span', { class: 'tag up' }, '↗ ' + x.subject); }),
      p.challenges.map(function (x) { return h('span', { class: 'tag grow' }, '🌱 ' + x.subject + '・' + SL.shortLabel(x.label)); }),
      !p.strengths.length && !p.growth.length && !p.challenges.length ? h('span', { class: 'muted small' }, 'この時期のテストの結果が少ないようです') : null);

    var editor = h('div', { class: 'card' },
      h('h2', null, '✏️ ' + st.no + '番 ' + st.name, h('span', { class: 'sub' }, S.term + 'の所見')),
      chips,
      h('div', { class: 'row', style: { marginBottom: '10px' } },
        h('div', { class: 'seg' }, lens.map(function (l) {
          return h('button', { class: S.settings.shokenLength === l[0] ? 'on' : '', onclick: function () { S.settings.shokenLength = l[0]; setDraft(makeDraft(st)); render(); } }, l[1]);
        })),
        h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: S.settings.includeChallenge, onchange: function (e) { S.settings.includeChallenge = e.target.checked; setDraft(makeDraft(st)); render(); } }), '課題も1つ入れる'),
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn', onclick: function () { setDraft(makeDraft(st)); render(); } }, '✨ 下書きをつくる'),
        h('button', { class: 'btn ghost', onclick: function () { S.seeds[key] = (S.seeds[key] || 0) + 1; setDraft(makeDraft(st)); render(); } }, '🔁 別の言い方')),
      ta,
      h('div', { class: 'row', style: { marginTop: '8px' } }, counter, h('span', { class: 'spacer' }),
        saved ? h('span', { class: 'muted small' }, '💾 ' + saved.at + ' に保存') : null),
      h('div', { class: 'row', style: { marginTop: '10px' } },
        h('button', { class: 'btn mint', disabled: isDemo(), onclick: function () { saveItems([{ no: st.no, term: S.term, text: ta.value }], st.name + 'さんの所見を保存しました'); } }, '💾 保存する'),
        h('button', { class: 'btn ghost', onclick: function () { copyText(ta.value, 'コピーしました'); } }, '📋 コピー'),
        h('button', { class: 'btn ghost', onclick: function () { copyText(SL.aiPrompt(p, { length: S.settings.shokenLength, grade: S.model.meta.grade }), 'AIに頼む文をコピーしました（名前・点数は入っていません）'); } }, '🤖 AIに頼む文をコピー'),
        h('button', { class: 'btn ghost', onclick: function () { moveSel(1); } }, '次の子 ▶')),
      isDemo() ? h('p', { class: 'muted small' }, '🧸 見本のクラスでは保存できません。') : null,
      h('p', { class: 'muted small', style: { marginBottom: '0' } }, '※ 下書きは、テストの結果だけをもとにしています。授業中の様子など、先生にしかわからないことを書き足してください。'));

    var bulk = h('div', { class: 'card row', style: { padding: '12px 16px' } },
      h('span', { class: 'muted small row', style: { gap: '14px' } }, h('span', null, h('span', { class: 'dot saved', style: { display: 'inline-block', marginRight: '4px' } }), '保存ずみ'), h('span', null, h('span', { class: 'dot draft', style: { display: 'inline-block', marginRight: '4px' } }), '下書き（まだ保存していない）')),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn ghost', onclick: function () {
        var n = 0;
        studentsOf().forEach(function (x) {
          var k = x.idx + '|' + S.term;
          if (S.drafts[k] !== undefined || (savedOf(x) && savedOf(x).text)) return;
          S.drafts[k] = makeDraft(x); n++;
        });
        toast(n ? n + '人ぶんの下書きを作りました（まだ書いていない子だけ）' : 'みんな、もう下書きか保存ずみです');
        render();
      } }, '✨ 全員の下書きをいっきに'),
      h('button', { class: 'btn mint', disabled: isDemo(), onclick: function () {
        var items = [];
        studentsOf().forEach(function (x) {
          var k = x.idx + '|' + S.term;
          if (S.drafts[k] === undefined) return;
          var sv = savedOf(x);
          if (sv && sv.text === S.drafts[k]) return;
          items.push({ no: x.no, term: S.term, text: S.drafts[k] });
        });
        if (!items.length) { toast('保存していない下書きはありません'); return; }
        saveItems(items, items.length + '人ぶんの所見を保存しました');
      } }, '💾 下書きをまとめて保存'));
    return h('div', null, bulk, h('div', { class: 'split' }, rosterList(render, dotOf), editor));
  }

  // ================= 入れわすれ =================
  function viewCheck() {
    var list = SL.missingCheck(S.model);
    if (!list.length) return h('div', { class: 'card empty' }, mascot(90), h('b', null, 'ぜんぶ入っています！'), h('p', { class: 'muted' }, 'テストをした単元は、全員の点数が入っています。'));
    return h('div', null,
      h('div', { class: 'note', style: { marginBottom: '14px' } }, '🔍 何人かは点数が入っているのに、空いている子がいる単元です。おやすみでテストを受けていない子もここに出ます。SMILEファイルで確かめてください。'),
      h('div', { class: 'grid g2' }, list.map(function (x) {
        return h('div', { class: 'card' },
          h('div', { class: 'row', style: { marginBottom: '6px' } }, h('span', { class: 'spill', style: { background: colorOf(x.subject) } }, x.subject), h('span', { class: 'tag miss' }, x.term), h('b', null, x.unit)),
          h('div', { class: 'muted small', style: { marginBottom: '6px' } }, x.total + '人中 ' + x.entered + '人 入力ずみ'),
          h('div', { class: 'row' }, x.missing.map(function (st) { return h('span', { class: 'chip', style: { cursor: 'default' } }, st.no + ' ' + st.name); })));
      })));
  }

  // ================= 設定 =================
  function viewSettings() {
    var st = JSON.parse(JSON.stringify(S.settings));
    function rangeRow(label, key, min, max, desc) {
      var val = h('b', null, st[key] + '%');
      return h('div', { style: { marginBottom: '12px' } }, h('div', { class: 'row' }, h('span', { style: { minWidth: '150px', fontWeight: '700' } }, label),
        h('input', { type: 'range', min: min, max: max, step: 1, value: st[key], oninput: function (e) { st[key] = Number(e.target.value); val.textContent = st[key] + '%'; } }), val),
        h('div', { class: 'muted small' }, desc));
    }
    var lenSel = h('select', { class: 'text', style: { width: 'auto' }, onchange: function (e) { st.shokenLength = e.target.value; } },
      [['short', '短め（100字くらい）'], ['normal', 'ふつう（200字くらい）'], ['long', '長め（300字くらい）']].map(function (o) { return h('option', { value: o[0], selected: st.shokenLength === o[0] }, o[1]); }));
    return h('div', null,
      h('div', { class: 'card' }, h('h2', null, '📗 読みこむファイル'),
        h('p', null, S.model.fileName),
        h('div', { class: 'row' },
          h('button', { class: 'btn ghost', onclick: function () {
            call('forgetFile').then(function () { S.model = null; S.files = null; S.fileMsg = ''; go('setup'); }).catch(fail);
          } }, '別のファイルをえらぶ'),
          isDemo() ? null : h('button', { class: 'btn ghost', onclick: loadMine }, '🔄 読みこみなおす'),
          isDemo() ? null : h('button', { class: 'btn ghost', onclick: loadDemo }, '🧸 見本を見る'))),
      h('div', { class: 'card' }, h('h2', null, '🎯 「とくい」「のびしろ」の決め方'),
        rangeRow('★ とくい', 'strongRate', 60, 100, 'この%以上で、学級平均より少し高い観点を「とくい」にします。'),
        rangeRow('🌱 のびしろ', 'weakRate', 30, 90, 'この%より低いか、学級平均よりかなり低い観点を「のびしろ」にします。')),
      h('div', { class: 'card' }, h('h2', null, '✏️ 所見・個票'),
        h('div', { class: 'row', style: { marginBottom: '10px' } }, h('span', { style: { minWidth: '150px', fontWeight: '700' } }, '所見の長さ'), lenSel),
        h('div', { style: { marginBottom: '6px' } }, h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: st.includeChallenge, onchange: function (e) { st.includeChallenge = e.target.checked; } }), '所見に課題を1つ入れる（前向きな言い方で）')),
        h('div', null, h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: st.showClassAvg, onchange: function (e) { st.showClassAvg = e.target.checked; } }), '個票に学級平均の線を出す'))),
      h('button', { class: 'btn big mint', onclick: function () {
        call('saveSettings', st).then(function (r) { S.settings = r; S.kohyo.avg = r.showClassAvg; toast('設定を保存しました'); render(); }).catch(fail);
      } }, '💾 設定を保存'),
      h('div', { style: { height: '14px' } }),
      safetyCard(),
      h('p', { class: 'muted small' }, 'せいせきノート ' + (S.boot ? 'ver.' + S.boot.version : '')));
  }

  start();
})();
</script>
