<script>
/*
 * App.html — せいせきノートの画面（やさしい絵本）。
 *
 * ★利用者の文字（名前・テスト名・教科名）は textContent でだけ出す。HTML を文字列で差しこまない。
 * ★役割と担当クラスはサーバー（bootstrap）が決める。画面で切りかえない（デモのペルソナ切替を除く）。
 * ★計算（到達率・A/B/C・要録・評定）は Logic.html。サーバーには点数と先生が入れた値だけを送る。
 */
(function () {
  'use strict';
  var SL = window.SL, Grid = window.Grid;
  var YEAR = SL.YEAR;
  var ABC_COLOR = { A: 'var(--A)', B: 'var(--B)', C: 'var(--C)' };

  // ================= 小さな道具 =================
  function h(tag, props) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'class') e.className = v;
      else if (k === 'style') Object.keys(v).forEach(function (x) { e.style[x] = v[x]; });
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') e[k] = v;
      else e.setAttribute(k, String(v));
    });
    add(e, Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function add(e, kids) {
    kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) add(e, c);
      else e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    });
  }
  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
    add(e, Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
  function pct(v) { return v === null || v === undefined ? '' : String(Math.round(v)); }

  // ================= 絵（すべてオリジナル） =================
  var uid = 0;
  /** 水彩のにじみ（ふちを少しゆらす）フィルター。 */
  function wcFilter(id, scale) {
    return s('filter', { id: id, x: '-10%', y: '-10%', width: '120%', height: '120%' },
      s('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.035', numOctaves: '3', seed: '7', result: 't' }),
      s('feDisplacementMap', { in: 'SourceGraphic', in2: 't', scale: scale || 7 }),
      s('feGaussianBlur', { stdDeviation: '0.4' }));
  }
  /** 線を少しだけゆらす（手がきの感じ）。顔がくずれないように弱め。 */
  function softFilter(id) {
    return s('filter', { id: id, x: '-10%', y: '-10%', width: '120%', height: '120%' },
      s('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.04', numOctaves: '2', seed: '3', result: 't' }),
      s('feDisplacementMap', { in: 'SourceGraphic', in2: 't', scale: 1.3 }));
  }
  function cheekGrad(id) {
    return s('radialGradient', { id: id },
      s('stop', { offset: '0', 'stop-color': '#F7A9A3', 'stop-opacity': '.85' }),
      s('stop', { offset: '1', 'stop-color': '#F7A9A3', 'stop-opacity': '0' }));
  }
  var INK = '#6B5444';
  /**
   * うさぎ（このアプリの案内役）。片耳がぺたんと折れているのが目じるし。
   * mood: 'normal'（ふつう）/ 'happy'（にっこり）/ 'wow'（おどろき）
   */
  function rabbit(size, mood) {
    var f = 'rb' + (++uid), c = 'ck' + uid;
    var eyes = mood === 'happy'
      ? [s('path', { d: 'M34 62 Q39 57 44 62', stroke: '#4A3A2E', 'stroke-width': 2.4, fill: 'none', 'stroke-linecap': 'round' }),
        s('path', { d: 'M56 62 Q61 57 66 62', stroke: '#4A3A2E', 'stroke-width': 2.4, fill: 'none', 'stroke-linecap': 'round' })]
      : [s('ellipse', { cx: 39, cy: 62, rx: 3.6, ry: 4.4, fill: '#4A3A2E' }), s('circle', { cx: 40.3, cy: 60.3, r: 1.3, fill: '#fff' }),
        s('ellipse', { cx: 61, cy: 62, rx: 3.6, ry: 4.4, fill: '#4A3A2E' }), s('circle', { cx: 62.3, cy: 60.3, r: 1.3, fill: '#fff' })];
    var mouth = mood === 'wow'
      ? s('ellipse', { cx: 50, cy: 72.5, rx: 2.4, ry: 3, fill: '#8A5A4C' })
      : s('path', { d: 'M50 69 Q47.5 72 45.5 70 M50 69 Q52.5 72 54.5 70', stroke: INK, 'stroke-width': 1.5, fill: 'none', 'stroke-linecap': 'round' });
    return s('svg', { width: size, height: size, viewBox: '0 0 100 100', 'aria-hidden': 'true' },
      s('defs', null, softFilter(f), cheekGrad(c)),
      s('g', { filter: 'url(#' + f + ')' },
        s('path', { d: 'M40 40 C 33 26, 33 7, 40 5 C 47 4, 47 24, 46 38 Z', fill: '#FFFDF7', stroke: INK, 'stroke-width': 2 }),
        s('path', { d: 'M41 35 C 37 24, 38 12, 41 10 C 44 10, 44 22, 44 33 Z', fill: '#F8C6C2' }),
        s('path', { d: 'M57 36 C 60 24, 70 16, 79 20 C 86 24, 76 32, 62 40 Z', fill: '#FFFDF7', stroke: INK, 'stroke-width': 2 }),
        s('path', { d: 'M61 35 C 64 27, 71 22, 77 23 C 79 26, 72 30, 64 36 Z', fill: '#F8C6C2' }),
        s('ellipse', { cx: 50, cy: 63, rx: 31, ry: 26.5, fill: '#FFFDF7', stroke: INK, 'stroke-width': 2 })),
      s('ellipse', { cx: 32, cy: 70, rx: 8, ry: 5, fill: 'url(#' + c + ')' }),
      s('ellipse', { cx: 68, cy: 70, rx: 8, ry: 5, fill: 'url(#' + c + ')' }),
      eyes,
      s('ellipse', { cx: 50, cy: 67.5, rx: 2, ry: 1.4, fill: '#F09A93' }),
      mouth);
  }
  /** ことり（まんまる）。 */
  function bird(size, color) {
    var f = 'bd' + (++uid), c = 'ck' + uid;
    return s('svg', { width: size, height: size, viewBox: '0 0 40 40', 'aria-hidden': 'true' },
      s('defs', null, softFilter(f), cheekGrad(c)),
      s('g', { filter: 'url(#' + f + ')' },
        s('path', { d: 'M18 9 Q20 4 23 7', stroke: INK, 'stroke-width': 1.4, fill: 'none', 'stroke-linecap': 'round' }),
        s('ellipse', { cx: 20, cy: 22, rx: 14, ry: 13, fill: color || '#C7E0F3', stroke: INK, 'stroke-width': 1.6 }),
        s('path', { d: 'M9 23 Q13 18 18 24 Q13 28 9 23 Z', fill: '#FFFDF7', opacity: .75 })),
      s('ellipse', { cx: 29, cy: 25, rx: 3.2, ry: 2.2, fill: 'url(#' + c + ')' }),
      s('ellipse', { cx: 25, cy: 20, rx: 1.7, ry: 2.1, fill: '#4A3A2E' }), s('circle', { cx: 25.6, cy: 19.3, r: .6, fill: '#fff' }),
      s('path', { d: 'M31 20.5 L35 22 L31 23.5 Z', fill: '#F2B36B' }),
      s('path', { d: 'M17 34.5 L16.5 37.5 M23 34.5 L23.5 37.5', stroke: INK, 'stroke-width': 1.3, 'stroke-linecap': 'round' }));
  }

  // ================= サーバー =================
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    args.push(S.actingAs);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error((e && e.message) || 'うまくいきませんでした。'));
      });
      r[fn].apply(r, args);
    });
  }

  // ================= 状態 =================
  var S = {
    actingAs: null, personas: window.__PERSONAS__ || [], isDemo: !!window.__IS_DEMO__,
    boot: null, view: 'loading', msg: '', classKey: null, cd: null, tab: 'scores',
    subject: null, term: null, pending: { scores: {}, manual: {}, criteria: {}, rules: {} }, setup: null, admin: null, setupGrade: null
  };
  function pendingCount() {
    return Object.keys(S.pending.scores).length + Object.keys(S.pending.manual).length + Object.keys(S.pending.criteria).length + Object.keys(S.pending.rules).length;
  }
  window.addEventListener('beforeunload', function (e) { if (pendingCount()) { e.preventDefault(); e.returnValue = ''; } });

  function toast(msg, isErr) {
    var old = document.getElementById('toast');
    if (old) old.parentNode.removeChild(old);
    var t = h('div', { id: 'toast', class: 'toast' + (isErr ? ' err' : ''), role: 'status' }, msg);
    document.body.appendChild(t);
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, isErr ? 6500 : 2600);
  }
  function fail(e) { toast(e.message || String(e), true); }
  /** ことわりのダイアログ。buttons = [[文字, 値, class]]。 */
  function ask(title, body, buttons) {
    return new Promise(function (resolve) {
      var veil = h('div', { class: 'veil' });
      var box = h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true' },
        h('div', { class: 'row', style: { alignItems: 'flex-start' } }, rabbit(54, 'wow'), h('div', { style: { flex: '1' } }, h('h3', null, title), body)),
        h('div', { class: 'row', style: { justifyContent: 'flex-end', marginTop: '14px' } }, buttons.map(function (b) {
          return h('button', { class: 'btn ' + (b[2] || ''), onclick: function () { document.body.removeChild(veil); resolve(b[1]); } }, b[0]);
        })));
      veil.appendChild(box);
      document.body.appendChild(veil);
    });
  }
  function leaveOk() {
    if (!pendingCount()) return Promise.resolve(true);
    return ask('保存していない入力があります', h('p', null, 'まだ保存していない入力が ' + pendingCount() + 'つ あります。どうしますか？'),
      [['もどる', 'back', 'plain'], ['保存しないで進む', 'drop', 'plain'], ['保存して進む', 'save', 'wakaba']]).then(function (v) {
      if (v === 'back') return false;
      if (v === 'drop') { S.pending = { scores: {}, manual: {}, criteria: {}, rules: {} }; return reloadClass().then(function () { return true; }); }
      return saveAll().then(function () { return true; });
    });
  }

  // ================= はじめ =================
  function start() {
    if (S.isDemo && !S.actingAs) { S.view = 'persona'; render(); return; }
    S.view = 'loading'; S.msg = 'ひらいています…'; render();
    call('bootstrap').then(function (b) {
      S.boot = b;
      S.view = b.role === 'admin' ? 'admin' : 'home';
      if (b.role === 'admin') return openAdmin();
      render();
    }).catch(function (e) { S.view = 'error'; S.msg = e.message; render(); });
  }
  function openClass(classKey) {
    S.view = 'loading'; S.msg = classKey.replace('-', '年') + '組の成績をひらいています…'; render();
    call('getClassData', classKey).then(function (cd) {
      S.cd = cd; S.classKey = classKey; S.view = 'class';
      S.pending = { scores: {}, manual: {}, criteria: {}, rules: {} };
      if (!S.subject || !cd.subjects.some(function (x) { return x.name === S.subject; })) S.subject = cd.subjects[0].name;
      if (!S.term || (cd.terms.indexOf(S.term) === -1 && S.term !== YEAR)) S.term = cd.terms[0];
      if (!cd.tests.length) S.tab = 'tests';
      render();
    }).catch(function (e) { fail(e); S.view = 'home'; render(); });
  }
  function reloadClass() {
    return call('getClassData', S.classKey).then(function (cd) { S.cd = cd; render(); }).catch(fail);
  }
  function openSetup() {
    S.view = 'loading'; S.msg = '学校の設定をひらいています…'; render();
    call('getSchoolSetup').then(function (st) {
      S.setup = st; S.view = 'setup';
      render();
    }).catch(function (e) { fail(e); S.view = 'home'; render(); });
  }
  function openAdmin() {
    return call('getAdminView').then(function (a) { S.admin = a; S.view = 'admin'; render(); }).catch(function (e) { S.view = 'error'; S.msg = e.message; render(); });
  }

  // ================= わく =================
  function render() {
    var root = document.getElementById('app');
    clear(root);
    var who = S.boot ? (S.boot.schoolName ? S.boot.schoolName + '　' : '') + S.boot.name + (S.boot.role === 'admin' ? '' : ' 先生') : '';
    root.appendChild(h('header', { class: 'cover' },
      h('div', { class: 'head' }, rabbit(72, 'happy'), h('div', null, h('h1', null, 'せいせきノート'), h('div', { class: 'sub' }, 'テストの点から、通知表・要録・GGまで'))),
      who ? h('div', { class: 'who' }, who) : null));
    if (S.isDemo) root.appendChild(h('div', { class: 'demo-bar' }, '🧸 デモ（名前も点数も作りものです）',
      S.actingAs ? h('button', { class: 'linkbtn', onclick: function () { S.actingAs = null; S.boot = null; start(); } }, '体験する人をかえる') : null));
    var body;
    if (S.view === 'loading') body = h('div', { class: 'loading' }, h('div', { class: 'hop' }, bird(56)), h('p', null, S.msg));
    else if (S.view === 'error') body = h('div', { class: 'page empty' }, rabbit(90, 'wow'), h('span', { class: 'title' }, 'ひらけませんでした'), h('p', null, S.msg),
      h('button', { class: 'btn', onclick: start }, 'もう一度ためす'));
    else if (S.view === 'persona') body = viewPersona();
    else if (S.view === 'home') body = viewHome();
    else if (S.view === 'class') body = viewClass();
    else if (S.view === 'setup') body = viewSetup();
    else if (S.view === 'admin') body = viewAdmin();
    root.appendChild(body);
  }

  function viewPersona() {
    return h('div', { class: 'page' }, h('h2', null, h('span', { class: 'wash' }, 'だれとして体験しますか？')),
      h('div', { class: 'grid3' }, S.personas.map(function (p) {
        return h('button', { class: 'btn plain', style: { padding: '14px', textAlign: 'left' }, onclick: function () { S.actingAs = p.email; start(); } }, p.label);
      })));
  }

  // ================= ホーム（本だな） =================
  function viewHome() {
    var b = S.boot;
    var wrap = h('div', { class: 'stack' });
    wrap.appendChild(h('div', { class: 'say' }, bird(52, '#F6C9C6'), h('div', { class: 'bubble' },
      h('b', null, b.name + ' 先生、こんにちは。'), h('div', { class: 'muted' }, b.fiscalYear + '年度・' + b.termSystem + '　ひらくクラスをえらんでください。'))));
    if (!b.classes.length) {
      wrap.appendChild(h('div', { class: 'page empty' }, rabbit(90, 'wow'), h('span', { class: 'title' }, 'まだ担当のクラスがありません'),
        h('p', { class: 'muted' }, '学校の設定担当の先生に、担任・担当の割り当てをお願いしてください。')));
    } else {
      wrap.appendChild(h('div', { class: 'page' }, h('h2', null, h('span', { class: 'wash sakura' }, 'わたしのクラス')),
        h('div', { class: 'books' }, b.classes.map(function (c, i) {
          return h('button', { class: 'book c' + (i % 6), onclick: function () { openClass(c.classKey); } },
            h('div', { class: 'bl' }, c.label), h('div', { class: 'bs' }, c.count + '人'), bird(46, ['#F6C9C6', '#C7E0F3', '#CDE5B7', '#DDD0EE', '#F9D8AE', '#F7EBD3'][i % 6]));
        }))));
    }
    if (b.isAdmin) {
      wrap.appendChild(h('div', { class: 'card soft row' }, h('span', { style: { fontSize: '28px' } }, '🏫'),
        h('div', null, h('b', null, 'アプリ管理'), h('div', { class: 'muted' }, '学校の登録・利用中／休止')),
        h('span', { class: 'spacer' }), h('button', { class: 'btn fuji', onclick: function () { S.view = 'loading'; S.msg = 'ひらいています…'; render(); openAdmin(); } }, 'ひらく')));
    }
    if (b.isSetup) {
      wrap.appendChild(h('div', { class: 'card soft row' }, h('span', { style: { fontSize: '28px' } }, '🔧'),
        h('div', null, h('b', null, '学校の設定'), h('div', { class: 'muted' }, '名簿の取り込み・担任の割り当て')),
        h('span', { class: 'spacer' }), h('button', { class: 'btn sora', onclick: openSetup }, 'ひらく')));
    }
    return wrap;
  }

  // ================= クラス =================
  var CLASS_TABS = [
    ['tests', '📚', 'テストの登録', 't1'], ['scores', '✏️', '点数を入れる', 't2'], ['counts', '📊', '人数の一覧', 't5'], ['term', '🌸', '学期の成績', 't3'],
    ['year', '📖', '要録（1年間）', 't4'], ['gg', '📋', 'GGに貼る', 't5'], ['check', '🔍', '入れわすれ', 't6']
  ];
  function viewClass() {
    var cd = S.cd;
    var wrap = h('div', null);
    wrap.appendChild(h('div', { class: 'row board-row', style: { margin: '6px 0 6px' } },
      h('button', { class: 'linkbtn', onclick: function () { leaveOk().then(function (ok) { if (ok) { S.view = 'home'; S.cd = null; render(); } }); } }, '← メニューにもどる'),
      h('h2', { class: 'title', style: { margin: '0 0 0 8px', fontSize: '26px' } }, cd.label), h('span', { class: 'muted' }, cd.students.length + '人・' + cd.termSystem)));
    wrap.appendChild(h('nav', { class: 'shelf' }, CLASS_TABS.map(function (t) {
      return h('button', { class: 'tab ' + t[3] + (S.tab === t[0] ? ' on' : ''), onclick: function () {
        if (S.tab === t[0]) return;
        leaveOk().then(function (ok) { if (ok) { S.tab = t[0]; render(); } });
      } }, h('span', { class: 'ico' }, t[1]), t[2]);
    })));
    var page = h('div', { class: 'page' });
    fixTerm(S.tab === 'gg' || S.tab === 'year');
    var v = { tests: viewTests, scores: viewScores, counts: viewCounts, term: viewTerm, year: viewYear, gg: viewGG, check: viewCheck }[S.tab] || viewScores;
    page.appendChild(v());
    wrap.appendChild(page);
    return wrap;
  }
  function subjectOf() { return S.cd.subjects.filter(function (x) { return x.name === S.subject; })[0] || S.cd.subjects[0]; }
  /** 1年間を選べない画面では、学期にもどす。画面を作る前に呼ぶ。 */
  function fixTerm(allowYear) {
    if (!allowYear && S.term === YEAR) S.term = S.cd.terms[S.cd.terms.length - 1];
  }
  function pickers(opts) {
    var cd = S.cd;
    var terms = cd.terms.concat(opts.year ? [YEAR] : []);
    fixTerm(opts.year);
    var bar = h('div', { class: 'toolbar' });
    bar.appendChild(h('div', { class: 'pick' }, h('span', { class: 'q' }, '教科'), cd.subjects.map(function (x) {
      return h('button', { class: 'pill' + (S.subject === x.name ? ' on' : ''), onclick: function () {
        leaveOk().then(function (ok) { if (ok) { S.subject = x.name; render(); } });
      } }, x.name);
    })));
    if (!opts.noTerm) bar.appendChild(h('div', { class: 'pick' }, h('span', { class: 'q' }, 'いつ'), terms.map(function (t) {
      return h('button', { class: 'pill' + (S.term === t ? ' on' : ''), onclick: function () {
        leaveOk().then(function (ok) { if (ok) { S.term = t; render(); } });
      } }, t);
    })));
    if (opts.extra) bar.appendChild(opts.extra);
    return bar;
  }
  function kClass(label, gg) {
    if (gg === '知' || /知識|技能|漢字|言葉/.test(label)) return 'k-know';
    if (gg === '思' || /思考|判断|表現/.test(label)) return 'k-think';
    if (gg === '主' || /主体/.test(label)) return 'k-att';
    return '';
  }
  function short(label) {
    return /思考|判断|表現/.test(label) ? '思・判・表' : /^知識/.test(label) ? '知・技' : /主体/.test(label) ? '主体的' : label;
  }
  function gridHelp() {
    return h('div', { class: 'gridhelp' },
      h('span', null, h('kbd', null, '矢印'), 'でうごく'), h('span', null, h('kbd', null, 'Enter'), 'で下へ'),
      h('span', null, h('kbd', null, 'Ctrl'), '+', h('kbd', null, 'V'), 'で Excel・GG からまとめて貼りつけ'),
      h('span', null, h('kbd', null, 'Ctrl'), '+', h('kbd', null, 'C'), 'でコピー'),
      h('span', null, h('kbd', null, 'Delete'), 'で消す'), h('span', null, h('kbd', null, 'Ctrl'), '+', h('kbd', null, 'Z'), 'でもどす'),
      h('span', null, 'Mac は Ctrl のかわりに ⌘'));
  }
  function saveBar() {
    var n = pendingCount();
    return h('div', { class: 'savebar' + (n ? '' : ' clean') },
      n ? h('span', null, '✏️ 保存していない入力が ', h('b', null, n), ' つあります') : h('span', null, '🌱 ぜんぶ保存されています'),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn wakaba', disabled: !n, onclick: function () { saveAll(); } }, '💾 保存する'));
  }
  function refreshSaveBar() {
    var old = document.querySelector('.savebar');
    if (old) old.parentNode.replaceChild(saveBar(), old);
  }
  function saveAll() {
    var cd = S.cd;
    var sc = Object.keys(S.pending.scores).map(function (k) { var p = k.split('|'); return { testId: p[0], studentEmail: p[1], kanten: p.slice(2).join('|'), value: S.pending.scores[k] }; });
    var mn = Object.keys(S.pending.manual).map(function (k) { var p = k.split('|'); return { studentEmail: p[0], subject: p[1], term: p[2], field: p[3], value: S.pending.manual[k] }; });
    var jobs = [];
    if (sc.length) jobs.push(call('saveScores', cd.classKey, sc));
    if (mn.length) jobs.push(call('saveManual', cd.classKey, mn));
    var nc = 0;
    Object.keys(S.pending.criteria).forEach(function (k) {
      var p = k.split('|'); nc++;
      jobs.push(call('saveCriteria', cd.classKey, p[0], p[1], cd.criteria[k]));
    });
    Object.keys(S.pending.rules).forEach(function (sub) { nc++; jobs.push(call('saveHyoteiRule', cd.classKey, sub, cd.hyoteiRules[sub])); });
    var btn = document.querySelector('.savebar .btn');

    function inp(key, ph, w) { return h('input', { class: 'text', placeholder: ph, style: { width: w || '180px' }, oninput: function (e) { f[key] = e.target.value; } }); }
    return h('div', { class: 'stack' },
      S.boot && S.boot.role === 'teacher' ? h('div', { class: 'board-row' }, h('button', { class: 'linkbtn', onclick: function () { S.view = 'home'; render(); } }, '← メニューにもどる')) : null,
      h('div', { class: 'page' }, h('h2', null, h('span', { class: 'wash' }, '登録している学校'), h('span', { class: 'sub' }, a.fiscalYear + '年度')),
        a.schools.length ? h('table', { class: 'form' }, h('thead', null, h('tr', null, h('th', null, '学校'), h('th', null, '学期制'), h('th', null, '児童'), h('th', null, '設定担当'), h('th', null, '今年度データ'), h('th', null, ''))),
          h('tbody', null, a.schools.map(function (x) {
            return h('tr', null, h('td', null, h('b', null, x.schoolName), h('div', { class: 'muted small' }, x.schoolId)), h('td', null, x.termSystem), h('td', null, x.students),
              h('td', { class: 'small' }, x.setupTeachers.join(', ')), h('td', null, x.hasDataFile ? '✅' : '—'),
              h('td', null, h('button', { class: 'btn plain', onclick: function () {
                call('updateSchool', { schoolId: x.schoolId, active: !x.active }).then(function (r) { S.admin = r; render(); }).catch(fail);
              } }, x.active ? '休止にする' : '利用中にする')));
          }))) : h('p', { class: 'muted' }, 'まだ学校がありません。')),
      h('div', { class: 'page' }, h('h2', null, h('span', { class: 'wash sora' }, '学校を登録する')),
        h('div', { class: 'row' },
          h('select', { class: 'text', style: { minWidth: '300px' }, 'aria-label': '学校', onchange: function (e) { f.schoolId = e.target.value; } },
            [h('option', { value: '' }, '学校をえらぶ')].concat((a.schoolList || []).map(function (x) {
              return h('option', { value: x.schoolId }, x.schoolId + '　' + x.schoolName + (done[x.schoolId] ? '（登録ずみ）' : ''));
            }))),
          h('select', { class: 'text', 'aria-label': '学期制', onchange: function (e) { f.termSystem = e.target.value; } }, ['3学期制', '2学期制'].map(function (t) { return h('option', { value: t }, t); }))),
        h('div', { class: 'row', style: { marginTop: '8px' } }, inp('email', '設定担当の先生のメール', '260px'), inp('teacherName', '先生の名前'),
          h('button', { class: 'btn wakaba', onclick: function (ev) {
            if (!f.schoolId) { toast('学校をえらんでください', true); return; }
            ev.target.disabled = true;
            call('registerSchool', f).then(function (r) {
              S.admin = r;
              toast('登録しました');
              // 登録した人が自分なら、そのまま先生の画面へ（読みこみなおさなくてよい）
              return call('bootstrap').then(function (b) { S.boot = b; S.view = b.role === 'teacher' ? 'home' : 'admin'; render(); });
            }).catch(function (e) { ev.target.disabled = false; fail(e); });
          } }, '登録する')),
        h('p', { class: 'muted small' }, '登録した先生（設定担当）は、アプリをひらくと「学校の設定」から名簿を取り込めます。')));
  }

  start();
})();
</script>
