<style>
  :root {
    --bg: #FFF7EE; --card: #FFFFFF; --ink: #4A3F35; --mute: #8A7D70; --line: #F1E3D3;
    --peach: #FF8F6B; --peach-soft: #FFE6DC; --mint: #4FB68C; --mint-soft: #DCF3E8;
    --sky: #5FA8E0; --sky-soft: #E0EFFB; --lemon: #F2BE3A; --lemon-soft: #FFF2C9;
    --berry: #E3779A; --berry-soft: #FCE3EB;
    --A: #4FB68C; --B: #5FA8E0; --C: #F29A5B;
    --radius: 18px; --shadow: 0 2px 0 #F1E3D3, 0 6px 18px rgba(165, 120, 80, .10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'Meiryo', sans-serif; font-size: 16px; line-height: 1.6; }
  button, input, select, textarea { font: inherit; color: inherit; }
  #app { max-width: 1180px; margin: 0 auto; padding: 14px 16px 60px; }
  .hidden { display: none !important; }

  /* ---------- 上の帯 ---------- */
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-size: 24px; font-weight: 900; letter-spacing: .04em; }
  .brand small { display: block; font-size: 12px; color: var(--mute); margin-top: -4px; }
  .file-chip { margin-left: auto; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 13px; color: var(--mute); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-chip.demo { background: var(--lemon-soft); border-color: #F5DD8E; color: #8A6A10; }

  /* ---------- タブ ---------- */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 4px; }
  .tab { flex: 0 0 auto; border: none; cursor: pointer; background: #fff; border-radius: 999px; padding: 9px 18px; font-weight: 700; box-shadow: var(--shadow); color: var(--ink); }
  .tab:hover { background: var(--peach-soft); }
  .tab.on { background: var(--peach); color: #fff; box-shadow: 0 3px 0 #E06E4B; }
  .tab .ico { margin-right: 4px; }

  .termbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
  .termbar .q { font-size: 14px; color: var(--mute); font-weight: 700; }
  .chip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 14px; cursor: pointer; font-weight: 700; font-size: 14px; }
  .chip:hover { border-color: var(--peach); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---------- カード ---------- */
  .card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .card h2 .sub { font-size: 13px; font-weight: 500; color: var(--mute); }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--mute); font-size: 14px; }
  .small { font-size: 13px; }
  .spacer { flex: 1; }

  /* ---------- ボタン ---------- */
  .btn { border: none; cursor: pointer; border-radius: 14px; padding: 10px 18px; font-weight: 700; background: var(--peach); color: #fff; box-shadow: 0 3px 0 #E06E4B; transition: transform .05s; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #E06E4B; }
  .btn.mint { background: var(--mint); box-shadow: 0 3px 0 #3A9672; }
  .btn.sky { background: var(--sky); box-shadow: 0 3px 0 #4588BD; }
  .btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
  .btn.ghost:hover { border-color: var(--peach); }
  .btn.big { font-size: 18px; padding: 14px 24px; border-radius: 18px; }
  .btn:disabled { background: #DDD3C8 !important; box-shadow: none !important; color: #fff !important; cursor: default; }
  .btn.ghost:disabled { background: #fff !important; color: #C7BBAE !important; }

  /* ---------- マスコットの吹き出し ---------- */
  .hello { display: flex; gap: 14px; align-items: center; }
  .bubble { position: relative; background: #fff; border-radius: 18px; padding: 12px 16px; box-shadow: var(--shadow); flex: 1; }
  .bubble:before { content: ''; position: absolute; left: -10px; top: 22px; border: 6px solid transparent; border-right: 10px solid #fff; }
  .bubble b { font-size: 18px; }

  /* ---------- ホーム ---------- */
  .tile { border-radius: var(--radius); padding: 14px 16px; cursor: pointer; border: none; text-align: left; box-shadow: var(--shadow); background: #fff; position: relative; overflow: hidden; }
  .tile .nm { font-weight: 900; font-size: 18px; }
  .tile .val { font-size: 30px; font-weight: 900; line-height: 1.1; }
  .tile .val small { font-size: 14px; }
  .tile .band { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; }
  .action { display: flex; gap: 12px; align-items: flex-start; text-align: left; cursor: pointer; border: none; background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .action:hover { background: #FFFBF6; }
  .action .em { font-size: 34px; line-height: 1; }
  .action b { display: block; font-size: 17px; }
  .alert { background: var(--lemon-soft); border: 2px dashed #EBCB6A; border-radius: var(--radius); padding: 12px 16px; display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .note { background: var(--sky-soft); border-radius: 14px; padding: 10px 14px; font-size: 14px; }

  /* ---------- 2列（名簿＋本文） ---------- */
  .split { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: start; }
  .roster { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; max-height: 76vh; overflow-y: auto; position: sticky; top: 8px; }
  .roster button { display: flex; width: 100%; gap: 8px; align-items: center; border: none; background: none; text-align: left; padding: 7px 10px; border-radius: 12px; cursor: pointer; font-size: 15px; }
  .roster button:hover { background: var(--peach-soft); }
  .roster button.on { background: var(--peach); color: #fff; }
  .roster .no { display: inline-block; min-width: 24px; font-weight: 900; color: var(--mute); }
  .roster button.on .no { color: #fff; }
  @media (max-width: 760px) { .split { grid-template-columns: 1fr; } .roster { max-height: 200px; position: static; } .file-chip { margin-left: 0; max-width: 100%; } }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-left: auto; flex: 0 0 auto; background: #EEE4D9; }
  .dot.saved { background: var(--mint); } .dot.draft { background: var(--lemon); }

  /* ---------- 評価のバッジ・タグ ---------- */
  .ev { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 900; font-size: 14px; flex: 0 0 auto; }
  .ev.A { background: var(--A); } .ev.B { background: var(--B); } .ev.C { background: var(--C); } .ev.none { background: #E6DCD0; }
  .tag { display: inline-flex; gap: 4px; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; }
  .tag.good { background: var(--lemon-soft); color: #8A6A10; }
  .tag.grow { background: var(--mint-soft); color: #2E7D5B; }
  .tag.up { background: var(--sky-soft); color: #2F6E9E; }
  .tag.miss { background: #F3ECE4; color: var(--mute); }

  /* ---------- バー ---------- */
  .bar { display: grid; grid-template-columns: 110px 1fr 46px; gap: 8px; align-items: center; font-size: 14px; margin: 4px 0; }
  .bar .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { position: relative; height: 14px; background: #F4ECE3; border-radius: 999px; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
  .avgmark { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--ink); opacity: .55; }
  .bar .v { text-align: right; font-weight: 700; }
  .stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: #F4ECE3; }
  .stack span { display: block; height: 100%; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--mute); align-items: center; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  /* ---------- 一覧表（ヒートマップ） ---------- */
  .heatwrap { overflow-x: auto; }
  table.heat { border-collapse: separate; border-spacing: 3px; font-size: 13px; }
  table.heat th { font-weight: 700; color: var(--mute); padding: 2px 4px; white-space: nowrap; }
  table.heat th.u { writing-mode: vertical-rl; text-orientation: mixed; height: 120px; vertical-align: bottom; max-height: 140px; }
  table.heat td { text-align: center; min-width: 38px; height: 28px; border-radius: 8px; font-weight: 700; }
  table.heat td.nm { text-align: left; background: none; position: sticky; left: 0; background: #fff; white-space: nowrap; padding-right: 8px; cursor: pointer; }
  table.heat td.nm:hover { color: var(--peach); }
  td.hA { background: var(--mint-soft); color: #2E7D5B; } td.hB { background: var(--sky-soft); color: #2F6E9E; } td.hC { background: #FFE2CF; color: #B4592A; } td.h0 { background: #F6F1EB; color: #C9BCAE; }

  /* ---------- 所見 ---------- */
  textarea.shoken { width: 100%; min-height: 190px; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; line-height: 1.8; background: #FFFDF9; resize: vertical; }
  textarea.shoken:focus { outline: none; border-color: var(--peach); box-shadow: 0 0 0 3px var(--peach-soft); }
  .seg { display: inline-flex; background: #F4ECE3; border-radius: 999px; padding: 3px; }
  .seg button { border: none; background: none; border-radius: 999px; padding: 5px 14px; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--mute); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .count { font-size: 13px; color: var(--mute); }
  .count.over { color: #C0532B; font-weight: 700; }
  label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 14px; }
  label.check input { width: 18px; height: 18px; accent-color: var(--peach); }

  /* ---------- はじめに ---------- */
  .steps { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .step { display: flex; gap: 8px; align-items: center; background: #fff; border-radius: 999px; padding: 6px 14px 6px 6px; box-shadow: var(--shadow); font-weight: 700; font-size: 14px; }
  .step i { font-style: normal; display: inline-flex; width: 28px; height: 28px; border-radius: 50%; align-items: center; justify-content: center; background: var(--peach); color: #fff; }
  .filelist button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; background: #FFFBF6; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
  .filelist button:hover { border-color: var(--peach); background: #fff; }
  .filelist .d { margin-left: auto; color: var(--mute); font-size: 13px; white-space: nowrap; }
  input.text { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
  input.text:focus { outline: none; border-color: var(--peach); }
  input[type=range] { accent-color: var(--peach); width: 220px; }

  /* ---------- よみこみ中・おしらせ ---------- */
  .loading { text-align: center; padding: 70px 10px; color: var(--mute); }
  .loading .m { animation: bob 1.2s ease-in-out infinite; display: inline-block; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.2); z-index: 50; max-width: 90vw; font-weight: 700; }
  .toast.err { background: #C0532B; }
  .empty { text-align: center; padding: 30px 10px; }
  .empty b { font-size: 20px; display: block; margin-top: 8px; }

  /* ---------- 個票（画面と印刷で同じ形） ---------- */
  .sheet { background: #fff; border-radius: 10px; padding: 22px 24px; box-shadow: var(--shadow); max-width: 820px; }
  .sheet-head { display: flex; align-items: flex-end; gap: 12px; border-bottom: 3px dotted var(--line); padding-bottom: 10px; margin-bottom: 12px; }
  .ribbon { background: var(--peach); color: #fff; font-weight: 900; padding: 4px 18px 4px 14px; border-radius: 10px 999px 999px 10px; font-size: 15px; }
  .sheet-name { margin-left: auto; text-align: right; }
  .sheet-name small { display: block; color: var(--mute); font-size: 13px; }
  .sheet-name b { font-size: 26px; font-weight: 900; }
  .points { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .pbox { border-radius: 14px; padding: 8px 12px; font-size: 14px; }
  .pbox h4 { margin: 0 0 4px; font-size: 14px; }
  .pbox.good { background: var(--lemon-soft); } .pbox.grow { background: var(--mint-soft); } .pbox.up { background: var(--sky-soft); }
  .pbox ul { margin: 0; padding-left: 18px; }
  .subjgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 640px) { .subjgrid { grid-template-columns: 1fr; } }
  .scard { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; break-inside: avoid; }
  .scard .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .spill { color: #fff; font-weight: 900; border-radius: 999px; padding: 1px 12px; font-size: 15px; }
  .scard .rt { margin-left: auto; font-weight: 900; font-size: 18px; }
  .scard .bar { grid-template-columns: 78px 1fr 40px; font-size: 13px; margin: 3px 0; }
  .ulist { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 4px; }
  .ulist div { display: flex; gap: 6px; align-items: center; font-size: 12.5px; padding: 1px 0; }
  .ulist .ev { width: 18px; height: 18px; font-size: 11px; }
  .ulist .u { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ulist .r { color: var(--mute); }
  .sheet-msg { margin-top: 12px; border: 2px solid var(--peach-soft); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; line-height: 1.8; }
  .sheet-msg h4 { margin: 0 0 4px; color: var(--peach); }
  .sheet-foot { margin-top: 10px; font-size: 11px; color: #B8AA9B; display: flex; justify-content: space-between; }

  #print { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 10mm; }
    html, body { background: #fff; }
    #app, .toast { display: none !important; }
    #print { display: block; }
    #print .sheet { box-shadow: none; max-width: none; padding: 0; page-break-after: always; break-after: page; }
    #print .sheet:last-child { page-break-after: auto; break-after: auto; }
    #print .subjgrid { grid-template-columns: repeat(2, 1fr); }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
