<script>
/*
 * Logic.html — 成績の計算（純粋関数）。画面（App.html）と、tools/run-local-tests.js が使う。
 *
 * 流れ:
 *   テストの点数 → 観点ごとの到達率 → 単元の A/B/C
 *   学期の中のテストを合わせた到達率 → 学期の観点の A/B/C（通知表）
 *   学期の観点の A/B/C を組み合わせ表に当てる → 1年間の観点の A/B/C（指導要録）
 *   観点の A/B/C を点（A=3・B=2・C=1）にして平均 → 評定（3・2・1）
 *
 * ★先生が手で直した値（手直し）は、いつも計算より優先する。
 * ★「主体的に学習に取り組む態度」はテストでは測れないので、先生が入れた値だけを使う。
 * ★DOM・google.script.run に触らない。
 */
(function (root) {
  'use strict';
  var SL = {};
  var YEAR = '1年間';
  var ABC = ['A', 'B', 'C'];

  /** 学期の評価から1年間の評価を出す組み合わせ表。学期の数ごと。 */
  var COMBO = {
    3: {
      AAA: 'A', AAB: 'A', AAC: 'B', ABA: 'A', ABB: 'B', ABC: 'B', ACA: 'B', ACB: 'B', ACC: 'B',
      BAA: 'A', BAB: 'B', BAC: 'B', BBA: 'B', BBB: 'B', BBC: 'B', BCA: 'B', BCB: 'B', BCC: 'C',
      CAA: 'B', CAB: 'B', CAC: 'B', CBA: 'B', CBB: 'B', CBC: 'C', CCA: 'B', CCB: 'C', CCC: 'C'
    },
    2: { AA: 'A', AB: 'A', AC: 'B', BA: 'A', BB: 'B', BC: 'B', CA: 'B', CB: 'B', CC: 'C' }
  };
  SL.COMBO = COMBO;
  SL.YEAR = YEAR;

  function r1(x) { return Math.round(x * 10) / 10; }
  function rate(sum, max) { return max > 0 ? r1(sum / max * 100) : null; }
  function abcOf(rt, a, b) {
    if (rt === null || rt === undefined) return '';
    return rt >= a ? 'A' : rt >= b ? 'B' : 'C';
  }
  SL.rate = rate;
  SL.abcOf = abcOf;

  /** 評価不能のしるし（‐ や / など）。中では '/' で持つ（GG の「評価不能」は /）。画面では ‐ と出す。 */
  var DASHES = ['/', '／', '-', '－', '‐', 'ー', '―', '−', '–', '—'];
  SL.isDash = function (s) { return DASHES.indexOf(String(s).trim()) !== -1; };
  /** 入力された評価の書き方をそろえる（a・Ａ・◎ → A など）。読めなければ null。‐・/ は評価不能（'/'）。 */
  SL.normAbc = function (v) {
    var s = String(v === null || v === undefined ? '' : v).trim()
      .replace(/[Ａ-Ｃａ-ｃ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).toUpperCase();
    if (s === '') return '';
    if (s === '◎') return 'A';
    if (s === '○' || s === '〇' || s === '◯') return 'B';
    if (s === '△') return 'C';
    if (SL.isDash(s)) return '/';
    return ABC.indexOf(s) !== -1 ? s : null;
  };
  /** 評定の書き方をそろえる（１→1）。読めなければ null。 */
  SL.normHyotei = function (v) {
    var s = String(v === null || v === undefined ? '' : v).trim()
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (s === '') return '';
    if (SL.isDash(s)) return '/';
    return /^[1-3]$/.test(s) ? s : null;
  };
  /** 点数の書き方をそろえる。読めなければ null、空なら ''。 */
  SL.normScore = function (v, max) {
    var s = String(v === null || v === undefined ? '' : v).trim()
      .replace(/[０-９．]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (s === '') return '';
    if (!/^\d+(\.\d+)?$/.test(s)) return null;
    var n = Number(s);
    if (max !== undefined && n > max) return null;
    return n;
  };

  // ================= 教科の設定 =================

  /** 教科の観点のうち、テストで点をつける観点（主体的…は入らない）。 */
  function testKanten(sub) { return sub.kanten.filter(function (k) { return k.test; }); }
  SL.testKanten = testKanten;
  /** 学期・1年間の評価を出す観点（漢字・言葉のように、ほかの観点にまとめるものは入らない）。 */
  function evalKanten(sub) { return sub.kanten.filter(function (k) { return !k.into; }); }
  SL.evalKanten = evalKanten;
  function kantenOf(sub, label) { return sub.kanten.filter(function (k) { return k.label === label; })[0] || null; }

  // ================= 評価の基準・評定の表 =================

  /**
   * クラス×教科×学期の評価の基準。{ kanten: { 観点: {a, b} }, unit: {a, b} }
   * a = A になる %（以上）、b = C になる %（未満）。間が B。
   */
  SL.criteriaFor = function (cd, sub, term) {
    var saved = (cd.criteria || {})[sub.name + '|' + term] || {};
    var out = { kanten: {}, unit: { a: sub.total.a, b: sub.total.b } };
    testKanten(sub).filter(function (k) { return !k.into; }).forEach(function (k) {
      var v = (saved.kanten || {})[k.label];
      out.kanten[k.label] = v ? { a: v.a, b: v.b } : { a: k.a, b: k.b };
    });
    if (saved.unit) out.unit = { a: saved.unit.a, b: saved.unit.b };
    return out;
  };

  /** 観点が n 個のときの、A・B・C の組み合わせ（並びは関係なし。AAB と ABA は同じ）。 */
  function combosOf(n) {
    var out = [];
    (function walk(prefix, from) {
      if (prefix.length === n) { out.push(prefix); return; }
      for (var i = from; i < 3; i++) walk(prefix + ABC[i], i);
    })('', 0);
    return out;
  }
  SL.combosOf = combosOf;
  /** 評定の表の初期値: 3 はぜんぶ A、1 は C が2つ以上（または全部 C）、ほかは 2。 */
  function defaultHyotei(n) {
    var out = {};
    combosOf(n).forEach(function (k) {
      var c = k.split('C').length - 1;
      out[k] = k.indexOf('B') === -1 && c === 0 ? '3' : (c >= Math.min(2, n) ? '1' : '2');
    });
    return out;
  }
  SL.defaultHyotei = defaultHyotei;
  /** クラス×教科の評定の表。 */
  SL.hyoteiRuleFor = function (cd, sub) {
    var n = evalKanten(sub).length;
    var def = defaultHyotei(n);
    var saved = (cd.hyoteiRules || {})[sub.name] || {};
    Object.keys(def).forEach(function (k) { if (/^[1-3]$/.test(saved[k] || '')) def[k] = saved[k]; });
    return def;
  };
  /** 観点の評価の並び → 組み合わせの名前（AAB など）。空・評価不能があれば ''。 */
  function comboKey(evals) {
    if (!evals.length || evals.some(function (e) { return ABC.indexOf(e) === -1; })) return '';
    return evals.slice().sort().join('');
  }
  SL.comboKey = comboKey;

  // ================= テスト（単元） =================

  /** 1人の子の、1つのテストの結果。点が1つも入っていなければ null。 */
  SL.testResult = function (cd, sub, test, sk) {
    var row = (cd.scores[test.testId] || {})[sk];
    if (!row) return null;
    var sum = 0, max = 0, any = false, per = {};
    Object.keys(test.points).forEach(function (label) {
      var v = row[label];
      if (v === null || v === undefined || v === '') return;
      any = true; sum += v; max += test.points[label];
      per[label] = v;
    });
    if (!any) return null;
    var rt = rate(sum, max);
    var t = SL.criteriaFor(cd, sub, test.term).unit;
    return { sum: sum, max: max, rate: rt, eval: abcOf(rt, t.a, t.b), per: per };
  };

  function testsOf(cd, subject, term) {
    return cd.tests.filter(function (t) { return t.subject === subject && (term === YEAR || t.term === term); })
      .sort(function (a, b) { return (cd.terms.indexOf(a.term) - cd.terms.indexOf(b.term)) || (a.order - b.order); });
  }
  SL.testsOf = testsOf;

  // ================= 学期の観点の評価 =================

  function manualOf(cd, sk, subject, term, field) {
    var v = cd.manual[[sk, subject, term, field].join('|')];
    return v === undefined ? '' : v;
  }
  SL.manualOf = manualOf;

  /**
   * 1人・1教科・1学期の観点ごとの結果。
   * 返す: { kanten: [{label, gg, sum, max, rate, auto, manual, final}], hyotei: {auto, manual, final}, total: {rate} }
   */
  SL.termEval = function (cd, sub, sk, term) {
    var tests = testsOf(cd, sub.name, term);
    var acc = {};
    sub.kanten.forEach(function (k) { acc[k.label] = { sum: 0, max: 0 }; });
    var allSum = 0, allMax = 0;
    tests.forEach(function (t) {
      var row = (cd.scores[t.testId] || {})[sk] || {};
      Object.keys(t.points).forEach(function (label) {
        var v = row[label];
        if (v === null || v === undefined || v === '') return;
        var k = kantenOf(sub, label);
        if (!k) return;
        var target = k.into ? k.into : label;
        if (!acc[target]) acc[target] = { sum: 0, max: 0 };
        acc[target].sum += v; acc[target].max += t.points[label];
        if (k.into) { acc[label].sum += v; acc[label].max += t.points[label]; }
        allSum += v; allMax += t.points[label];
      });
    });
    var crit = SL.criteriaFor(cd, sub, term);
    var out = evalKanten(sub).map(function (k) {
      var a = acc[k.label] || { sum: 0, max: 0 };
      var rt = k.test ? rate(a.sum, a.max) : null;
      var th = crit.kanten[k.label] || { a: k.a, b: k.b };
      var auto = k.test ? abcOf(rt, th.a, th.b) : '';
      var manual = manualOf(cd, sk, sub.name, term, k.label);
      return { label: k.label, gg: k.gg, test: k.test, sum: a.sum, max: a.max, rate: rt, auto: auto, manual: manual, final: manual || auto };
    });
    var hy = hyoteiOf(cd, sub, out.map(function (x) { return x.final; }));
    var hManual = manualOf(cd, sk, sub.name, term, '評定');
    return { kanten: out, hyotei: { auto: hy, manual: hManual, final: hManual || hy }, total: { rate: rate(allSum, allMax) } };
  };

  /** 観点の A/B/C の組み合わせを評定の表に当てる（3・2・1）。1つでも空・評価不能があれば ''。 */
  function hyoteiOf(cd, sub, evals) {
    if (evals.length && evals.every(function (e) { return e === '/'; })) return '/';
    var key = comboKey(evals);
    return key ? (SL.hyoteiRuleFor(cd, sub)[key] || '') : '';
  }
  SL.hyoteiOf = hyoteiOf;

  // ================= 1年間（指導要録） =================

  /** 学期の評価の並びを組み合わせ表に当てる。全部の学期がそろっていなければ ''。 */
  function combine(evals, n) {
    if (evals.length === n && evals.every(function (e) { return e === '/'; })) return '/';
    if (evals.length !== n || evals.some(function (e) { return ABC.indexOf(e) === -1; })) return '';
    return (COMBO[n] || {})[evals.join('')] || '';
  }
  SL.combine = combine;

  /** 1人・1教科の1年間（指導要録）の観点と評定。 */
  SL.yearEval = function (cd, sub, sk) {
    var terms = cd.terms.map(function (t) { return SL.termEval(cd, sub, sk, t); });
    var out = evalKanten(sub).map(function (k, i) {
      var seq = terms.map(function (te) { return te.kanten[i].final; });
      var auto = combine(seq, cd.terms.length);
      var manual = manualOf(cd, sk, sub.name, YEAR, k.label);
      return { label: k.label, gg: k.gg, terms: seq, auto: auto, manual: manual, final: manual || auto };
    });
    var hy = hyoteiOf(cd, sub, out.map(function (x) { return x.final; }));
    var hManual = manualOf(cd, sk, sub.name, YEAR, '評定');
    return { kanten: out, hyotei: { auto: hy, manual: hManual, final: hManual || hy } };
  };

  /** 時期（学期 or 1年間）ごとに呼び分ける。 */
  SL.evalFor = function (cd, sub, sk, term) {
    return term === YEAR ? SL.yearEval(cd, sub, sk) : SL.termEval(cd, sub, sk, term);
  };

  // ================= 校務支援システム（GG）に貼る表 =================

  /** GGの列（知・思・主・評定）。評定を出さない学年・時期は入れない。 */
  SL.ggColumns = function (cd, sub, term) {
    var cols = evalKanten(sub).filter(function (k) { return k.gg; }).map(function (k) { return { label: k.gg, kanten: k.label }; });
    var useHyotei = term === YEAR ? sub.hyoteiYear : sub.hyoteiTerm;
    if (useHyotei) cols.push({ label: '評定', kanten: '評定' });
    return cols;
  };

  /** GGに貼る行（名簿の順）。空はそのまま空にする（GGで手で入れる）。 */
  SL.ggRows = function (cd, sub, term) {
    var cols = SL.ggColumns(cd, sub, term);
    return cd.students.map(function (st) {
      var ev = SL.evalFor(cd, sub, st.key, term);
      return {
        key: st.key, no: st.no, name: st.name,
        cells: cols.map(function (c) {
          if (c.kanten === '評定') return ev.hyotei.final;
          var k = ev.kanten.filter(function (x) { return x.label === c.kanten; })[0];
          return k ? k.final : '';
        })
      };
    });
  };

  /** 表の値をタブ区切りの文字にする（スプレッドシート・GGに貼れる形）。 */
  SL.toTsv = function (rows) {
    return rows.map(function (r) { return r.map(function (v) { return String(v === null || v === undefined ? '' : v).replace(/[\t\r\n]+/g, ' '); }).join('\t'); }).join('\n');
  };
  /** 貼りつけられた文字を表にする（Excel・スプレッドシート・GGからのコピー）。 */
  SL.fromTsv = function (text) {
    var s = String(text || '').replace(/\r\n?/g, '\n');
    if (s.slice(-1) === '\n') s = s.slice(0, -1);
    if (s === '') return [];
    return s.split('\n').map(function (line) { return line.split('\t'); });
  };

  // ================= 入れわすれ =================

  /** 何人かは点が入っているのに、空いている子がいるテスト。 */
  SL.missing = function (cd) {
    var out = [];
    cd.tests.forEach(function (t) {
      var sc = cd.scores[t.testId] || {};
      var entered = cd.students.filter(function (st) {
        var row = sc[st.key];
        return row && Object.keys(t.points).some(function (l) { return row[l] !== undefined && row[l] !== null && row[l] !== ''; });
      });
      if (!entered.length || entered.length === cd.students.length) return;
      out.push({ test: t, entered: entered.length, missing: cd.students.filter(function (st) { return entered.indexOf(st) === -1; }) });
    });
    return out;
  };

  // ================= 単元ごとの学級のようす =================

  /** テストごとの学級平均・A/B/Cの人数。 */
  SL.testStats = function (cd, sub, test) {
    var n = 0, sumRate = 0, abc = { A: 0, B: 0, C: 0 }, kSum = {}, kMax = {};
    cd.students.forEach(function (st) {
      var r = SL.testResult(cd, sub, test, st.key);
      if (!r) return;
      n++; sumRate += r.rate; abc[r.eval]++;
      Object.keys(r.per).forEach(function (l) { kSum[l] = (kSum[l] || 0) + r.per[l]; kMax[l] = (kMax[l] || 0) + test.points[l]; });
    });
    var kAvg = {};
    Object.keys(kSum).forEach(function (l) { kAvg[l] = rate(kSum[l], kMax[l]); });
    return { entered: n, avg: n ? r1(sumRate / n) : null, abc: abc, kAvg: kAvg };
  };

  /**
   * 学年のほかのクラス（名前なしの点数）を、いまの基準で数える。
   * peer = { label, n, tests: [{ subject, term, name, points, rows: [ {観点: 点} | null ] }] }（rows は n 人ぶん、並びはクラスの中でそろっている）
   * 返す: { kanten: { 観点: {A,B,C} }, tests: { テスト名: {A,B,C} } }
   */
  SL.peerCounts = function (peer, sub, term, crit) {
    var tests = peer.tests.filter(function (t) { return t.subject === sub.name && t.term === term; });
    var out = { kanten: {}, tests: {} };
    var acc = [];
    for (var i = 0; i < peer.n; i++) acc.push({});
    tests.forEach(function (t) {
      var cnt = { A: 0, B: 0, C: 0 };
      t.rows.forEach(function (row, i) {
        if (!row) return;
        var sum = 0, max = 0, any = false;
        Object.keys(t.points).forEach(function (l) {
          var v = row[l];
          if (v === null || v === undefined || v === '') return;
          any = true; sum += v; max += t.points[l];
          var k = sub.kanten.filter(function (x) { return x.label === l; })[0];
          if (!k) return;
          var target = k.into || l;
          var a = acc[i][target] = acc[i][target] || { sum: 0, max: 0 };
          a.sum += v; a.max += t.points[l];
        });
        if (any) cnt[abcOf(rate(sum, max), crit.unit.a, crit.unit.b)]++;
      });
      out.tests[t.name] = cnt;
    });
    Object.keys(crit.kanten).forEach(function (l) {
      var cnt = { A: 0, B: 0, C: 0 };
      acc.forEach(function (a) { if (a[l] && a[l].max) cnt[abcOf(rate(a[l].sum, a[l].max), crit.kanten[l].a, crit.kanten[l].b)]++; });
      out.kanten[l] = cnt;
    });
    return out;
  };


  // ================= 個票・所見 =================
  var STRONG_RATE = 85, WEAK_RATE = 70;
  var TEST_UNIT_RE = /たしかめ|まとめ|テスト|ふくしゅう|復習|総合/;
  function pick(arr, seed, salt) { return arr[Math.abs((seed || 0) + (salt || 0)) % arr.length]; }
  function fill(t, v) { return t.replace(/\{(\w+)\}/g, function (_, k) { return v[k] === undefined ? '' : v[k]; }); }
  /** 観点の名前から種類を決める（漢字・言葉は国語の知識・技能の中身）。 */
  function kantenType(label) {
    if (/漢字/.test(label)) return 'kanji';
    if (/言葉|ことば|語彙/.test(label)) return 'words';
    if (/思考|判断|表現/.test(label)) return 'think';
    if (/知識|技能/.test(label)) return 'know';
    return 'other';
  }
  SL.kantenType = kantenType;
  SL.shortLabel = function (label) { var t = kantenType(label); return t === 'think' ? '思・判・表' : t === 'know' ? '知・技' : label; };

  /** 教科×時期の学級の到達率（観点ごと・教科全体）。 */
  function classRates(cd, sub, term) {
    var k = {}, all = { sum: 0, max: 0 };
    cd.students.forEach(function (st) {
      var te = SL.termEval(cd, sub, st.key, term);
      te.kanten.forEach(function (x) {
        if (!x.test) return;
        var a = k[x.label] = k[x.label] || { sum: 0, max: 0 };
        a.sum += x.sum; a.max += x.max;
      });
      SL.testsOf(cd, sub.name, term).forEach(function (t) { var r = SL.testResult(cd, sub, t, st.key); if (r) { all.sum += r.sum; all.max += r.max; } });
    });
    var out = { kanten: {}, all: rate(all.sum, all.max) };
    Object.keys(k).forEach(function (l) { out.kanten[l] = rate(k[l].sum, k[l].max); });
    return out;
  }

  /** 1人・1教科・1時期のまとめ。テストが無ければ null。 */
  function subjectSummary(cd, sub, sk, term) {
    var tests = SL.testsOf(cd, sub.name, term);
    if (!tests.length) return null;
    var te = SL.termEval(cd, sub, sk, term);
    var ev = SL.evalFor(cd, sub, sk, term);
    var cr = classRates(cd, sub, term);
    var sum = 0, max = 0;
    var units = tests.map(function (t) {
      var r = SL.testResult(cd, sub, t, sk);
      var st = SL.testStats(cd, sub, t);
      if (!r) return { term: t.term, name: t.name, rate: null, classAvg: st.avg, eval: '', tag: 'missing' };
      sum += r.sum; max += r.max;
      var tag = '';
      if (r.rate >= STRONG_RATE && (r.rate - st.avg >= 5 || r.rate >= 98)) tag = 'good';
      else if (r.rate < WEAK_RATE || r.rate <= st.avg - 15) tag = 'grow';
      return { term: t.term, name: t.name, rate: r.rate, classAvg: st.avg, eval: r.eval, tag: tag, per: r.per, points: t.points };
    });
    if (!max) return null;
    return {
      name: sub.name, rate: rate(sum, max), classRate: cr.all,
      kanten: te.kanten.filter(function (x) { return x.test; }).map(function (x) {
        var f = ev.kanten.filter(function (y) { return y.label === x.label; })[0];
        return { label: x.label, rate: x.rate, classRate: cr.kanten[x.label] === undefined ? null : cr.kanten[x.label], max: x.max, eval: f ? f.final : '' };
      }),
      evals: ev.kanten.map(function (x) { return { label: x.label, gg: x.gg, eval: x.final }; }),
      hyotei: ev.hyotei.final,
      units: units
    };
  }
  /** その観点がいちばんよくできた単元（まとめのテストはなるべくさける）。 */
  function bestUnitFor(sm, label) {
    var best = null;
    sm.units.forEach(function (u) {
      if (!u.per) return;
      Object.keys(u.per).forEach(function (l) {
        if (l !== label && kantenType(l) !== kantenType(label) && !(kantenType(label) === 'know' && /漢字|言葉/.test(l))) return;
        var r = u.per[l] / u.points[l] * 100 - (TEST_UNIT_RE.test(u.name) ? 30 : 0);
        if (!best || r >= best.r) best = { r: r, name: u.name };
      });
    });
    return best && !TEST_UNIT_RE.test(best.name) ? best.name : '';
  }
  function rel(s) { return s && s.rate !== null && s.classRate !== null ? s.rate - s.classRate : null; }
  /** 前の学期とくらべて、学級の中での位置が上がった教科。 */
  function growthOf(cd, sk, term) {
    var terms = cd.terms.filter(function (t) { return cd.tests.some(function (x) { return x.term === t; }); });
    var at = term === YEAR ? terms.length - 1 : terms.indexOf(term);
    if (at < 1) return [];
    var now = terms[at], prev = terms[at - 1];
    var out = [];
    cd.subjects.forEach(function (sub) {
      var a = rel(subjectSummary(cd, sub, sk, prev)), b = rel(subjectSummary(cd, sub, sk, now));
      if (a === null || b === null) return;
      if (b - a >= 8) out.push({ subject: sub.name, from: prev, to: now, diff: r1(b - a) });
    });
    return out.sort(function (x, y) { return y.diff - x.diff; });
  }

  /** 1人のプロフィール（個票・所見のもと）。term は学期か「1年間」。 */
  SL.profile = function (cd, sk, term) {
    var idx = 0, st = null;
    cd.students.forEach(function (x, i) { if (x.key === sk) { idx = i; st = x; } });
    var subjects = [];
    cd.subjects.forEach(function (sub) { var sm = subjectSummary(cd, sub, sk, term); if (sm) subjects.push(sm); });
    var cands = [];
    subjects.forEach(function (sm) {
      sm.kanten.forEach(function (k) {
        if (k.rate === null || k.classRate === null || k.max < 50) return;
        cands.push({ subject: sm.name, label: k.label, type: kantenType(k.label), rate: k.rate, diff: r1(k.rate - k.classRate), summary: sm });
      });
    });
    var strengths = cands.filter(function (c) { return (c.rate >= STRONG_RATE && c.diff >= 3) || (c.diff >= 10 && c.rate >= WEAK_RATE + 5); })
      .sort(function (a, b) { return (b.rate + b.diff * 1.5) - (a.rate + a.diff * 1.5); });
    var challenges = cands.filter(function (c) { return c.rate < WEAK_RATE || c.diff <= -12; })
      .sort(function (a, b) { return (a.rate + a.diff) - (b.rate + b.diff); });
    var best = cands.slice().sort(function (a, b) { return (b.diff + b.rate / 10) - (a.diff + a.rate / 10); })[0] || null;
    function slim(c) { return { subject: c.subject, label: c.label, type: c.type, rate: c.rate, diff: c.diff, unit: bestUnitFor(c.summary, c.label) }; }
    return {
      idx: idx, key: sk, no: st ? st.no : idx + 1, name: st ? st.name : '', term: term,
      subjects: subjects,
      strengths: strengths.slice(0, 3).map(slim), challenges: challenges.slice(0, 2).map(slim),
      best: best ? slim(best) : null, growth: growthOf(cd, sk, term)
    };
  };

  var PHRASE = {
    '国語': { know: '言葉のきまりや文の組み立てについての理解', think: '文章を読んで内容をとらえ、自分の考えをまとめる力', kanji: '漢字の読み書き', words: '言葉の意味や使い方についての理解' },
    '算数': { know: '計算や図形などの基礎的な知識・技能', think: '学習したことを使って、筋道を立てて考える力' },
    '社会': { know: '社会の様子についての知識や、資料を読み取る力', think: '社会の出来事の意味を考え、表現する力' },
    '理科': { know: '観察や実験についての知識・技能', think: '予想を立て、結果をもとに考える力' },
    '生活': { know: '身近な人や自然についての気付き', think: '気付いたことを工夫して表す力' },
    '音楽': { know: '音楽についての知識や技能', think: '曲の特徴を感じ取り、表現を工夫する力' },
    '図工': { know: '形や色についての知識や技能', think: '発想を広げ、表し方を工夫する力' },
    '家庭': { know: '生活に関わる知識や技能', think: '生活の課題を見つけ、工夫する力' },
    '体育': { know: '運動や健康についての知識や技能', think: '自分の課題を見つけ、解決の仕方を考える力' },
    '外国語': { know: '英語の表現や語句についての理解', think: '場面に応じて伝え合う力' },
    _: { know: '基礎的な知識や技能', think: '考えたことを判断し、表現する力', kanji: '漢字の読み書き', words: '言葉についての理解' }
  };
  function phraseOf(subject, label) {
    var t = kantenType(label);
    var p = PHRASE[subject] || {};
    return p[t] || PHRASE._[t] || (label + 'の力');
  }
  SL.phraseOf = phraseOf;

  var T = {
    strongUnit: [
      '{subj}の「{unit}」の学習では、{ph}がしっかりと身についており、確かな理解を示しました。',
      '{subj}では、{ph}に優れています。「{unit}」の学習でも、学んだことを生かして問題に取り組むことができました。',
      '「{unit}」の学習では、{ph}を発揮し、{subj}の学習に自信をもって取り組むことができました。'
    ],
    strong: [
      '{subj}では、{ph}が確かに身についています。',
      '{subj}の学習では、{ph}を十分に発揮することができました。',
      '{subj}では、{ph}に優れ、安定した理解を示しています。'
    ],
    best: [
      '{subj}では、{ph}を少しずつ確かなものにしてきています。',
      '{subj}の学習では、{ph}が育ってきています。'
    ],
    second: [
      'また、{subj}でも{ph}が身についてきています。',
      '{subj}においても、{ph}が着実に育っています。',
      'さらに、{subj}では{ph}を生かして学習に取り組みました。'
    ],
    alsoSame: [
      'また、{ph}も確かに身についています。',
      'あわせて、{ph}も十分に育っています。'
    ],
    growth: [
      '{subj}では、{from}に比べて理解が深まり、着実に力を伸ばしています。',
      '{subj}の学習では、{from}よりもさらに力を伸ばすことができました。'
    ],
    steady: [
      '{subjs}の学習でも、学んだことを確実に身につけています。',
      '{subjs}でも、安定した理解を示しています。'
    ],
    challenge: [
      '{subj}では、{ph}を、これからさらに伸ばしていきたいところです。くり返し取り組むことで、確かな力にしていけるよう支援していきます。',
      '{subj}では、{ph}をさらに高めていくことが今後の目標です。一つ一つ確かめながら学習を進められるよう、声をかけていきます。'
    ],
    challengeSame: [
      'また、{ph}を、これからさらに伸ばしていきたいところです。くり返し取り組むことで、確かな力にしていけるよう支援していきます。',
      'あわせて、{ph}をさらに高めていくことが今後の目標です。一つ一つ確かめながら学習を進められるよう、声をかけていきます。'
    ],
    close: [
      'これからも、得意なことを生かして、さまざまな学習に意欲的に取り組んでいけるよう励ましていきます。',
      '今後も自分のよさを生かしながら、学習に取り組んでいけるよう見守っていきます。',
      'これからの学習でも、自信をもって取り組めるよう応援していきます。'
    ]
  };
  var TARGET = { short: 100, normal: 200, long: 300 };
  SL.SHOKEN_TARGET = TARGET;

  /**
   * テストの結果から所見の下書きを作る。名前・点数・順位は書かない。
   * opts = { seed, length: 'short'|'normal'|'long', includeChallenge }
   */
  SL.shoken = function (profile, opts) {
    opts = opts || {};
    var seed = (opts.seed || 0) + profile.idx;
    var target = TARGET[opts.length] || TARGET.normal;
    var parts = [];
    var used = {};
    var first = profile.strengths[0];
    if (first) {
      used[first.subject] = true;
      var v = { subj: first.subject, ph: phraseOf(first.subject, first.label), unit: first.unit };
      parts.push({ p: 0, s: fill(pick(first.unit ? T.strongUnit : T.strong, seed, 0), v) });
    } else if (profile.best) {
      used[profile.best.subject] = true;
      parts.push({ p: 0, s: fill(pick(T.best, seed, 0), { subj: profile.best.subject, ph: phraseOf(profile.best.subject, profile.best.label) }) });
    }
    var sec = profile.strengths.filter(function (x) { return !used[x.subject]; })[0];
    if (sec) {
      used[sec.subject] = true;
      parts.push({ p: 2, s: fill(pick(T.second, seed, 1), { subj: sec.subject, ph: phraseOf(sec.subject, sec.label) }) });
    } else if (first && profile.strengths[1] && phraseOf(first.subject, profile.strengths[1].label) !== phraseOf(first.subject, first.label)) {
      // 同じ教科のもう1つの観点
      parts.push({ p: 2, s: fill(pick(T.alsoSame, seed, 1), { ph: phraseOf(first.subject, profile.strengths[1].label) }) });
    }
    var g = profile.growth.filter(function (x) { return !used[x.subject]; })[0] || profile.growth[0];
    if (g) { used[g.subject] = true; parts.push({ p: 1, s: fill(pick(T.growth, seed, 2), { subj: g.subject, from: g.from }) }); }
    // ほかにも学級と同じくらい以上によくできている教科があれば、まとめて書く
    var steady = profile.subjects.filter(function (sm) {
      return !used[sm.name] && sm.rate !== null && sm.rate >= 80 && sm.rate >= sm.classRate - 2;
    }).map(function (sm) { return sm.name; });
    if (steady.length) parts.push({ p: 2.5, s: fill(pick(T.steady, seed, 5), { subjs: steady.slice(0, 3).join('や') }) });
    if (opts.includeChallenge !== false && profile.challenges[0]) {
      var c = profile.challenges[0];
      var lead = first || profile.best;
      var same = lead && lead.subject === c.subject;
      parts.push({ p: 3, s: fill(pick(same ? T.challengeSame : T.challenge, seed, 3), { subj: c.subject, ph: phraseOf(c.subject, c.label) }) });
    }
    var close = { p: 4, s: pick(T.close, seed, 4) };
    // 大事な順（とくい→のび→ふたつめ→課題）に、目安の字数におさまるだけ入れる。しめの文は入れば入れる
    var chosen = [];
    var len = 0;
    parts.slice().sort(function (a, b) { return a.p - b.p; }).forEach(function (x, i) {
      if (i === 0 || len + x.s.length <= target * 1.1) { chosen.push(x); len += x.s.length; }
    });
    if (!chosen.length || len + close.s.length <= target * 1.15) chosen.push(close);
    // 書く順は「よいところ→ふたつめ→のび→課題→しめ」
    var order = [0, 2, 1, 2.5, 3, 4];
    chosen.sort(function (a, b) { return order.indexOf(a.p) - order.indexOf(b.p); });
    return chosen.map(function (x) { return x.s; }).join('');
  };

  function levelWord(diff) {
    return diff >= 10 ? '学級の中でもとても高い' : diff >= 4 ? '学級の中では高め' : diff > -4 ? '学級と同じくらい' : diff > -10 ? '学級の中では少し低め' : '学級の中では低め';
  }
  function absWord(rt) {
    return rt >= 90 ? 'ほとんどできている' : rt >= 80 ? 'よくできている' : rt >= 60 ? 'おおむねできている' : 'まだ身についていないところがある';
  }

  /**
   * AI（Gemini など）に貼りつけて所見を頼むための文。名前・番号・点数は入れない（言葉での程度だけ）。
   * opts = { length, grade }
   */
  /** 1人ぶんの「テストの結果のまとめ」の行（名前・番号・点数・% は入れない）。 */
  function summaryLines(profile) {
    var L = [];
    profile.subjects.forEach(function (sm) {
      if (sm.rate === null) return;
      var ks = sm.kanten.filter(function (k) { return k.rate !== null && k.classRate !== null; })
        .map(function (k) { return k.label + 'は' + levelWord(k.rate - k.classRate); });
      L.push('・' + sm.name + '：全体として' + absWord(sm.rate) + '（' + levelWord(sm.rate - sm.classRate) + '）。' + (ks.length ? ks.join('、') + '。' : ''));
    });
    if (profile.strengths.length) L.push('とくいなところ：' + profile.strengths.map(function (x) { return x.subject + '「' + x.label + '」' + (x.unit ? '（単元「' + x.unit + '」）' : ''); }).join('、'));
    if (profile.growth.length) L.push('のびてきたところ：' + profile.growth.map(function (x) { return x.subject + '（' + x.from + 'より学級の中での位置が上がった）'; }).join('、'));
    if (profile.challenges.length) L.push('これから伸ばしたいところ：' + profile.challenges.map(function (x) { return x.subject + '「' + x.label + '」'; }).join('、'));
    if (!L.length) L.push('・この時期のテストの結果はまだありません。');
    return L;
  }
  /** 学級の中での記号（児童01・児童02…）。名簿の順。 */
  SL.aiCode = function (i) { return '児童' + (i + 1 < 10 ? '0' : '') + (i + 1); };

  /**
   * 学級全員ぶんを、一度に AI（Gemini など）に頼む文。名前・番号・点数は入れず、「児童01」などの記号だけ。
   * 返事は「【児童01】」で始まる形にしてもらい、SL.parseAiReply で一人ひとりに振り分ける。
   */
  SL.aiPromptClass = function (profiles, opts) {
    opts = opts || {};
    var n = TARGET[opts.length] || TARGET.normal;
    var L = [];
    L.push('あなたは小学校の担任の先生です。次の「テストの結果のまとめ」をもとに、' + profiles.length + '人ぶんの通知表の所見の下書きを、1人' + n + '字くらいで書いてください。');
    L.push('');
    L.push('【書き方のきまり】');
    L.push('・かならず「【児童01】」のように、記号を【】でかこんだ行のすぐあとに、その子の所見を書いてください。記号の順に、全員ぶん書いてください。');
    L.push('・所見のほかの文（あいさつ・説明・見出し）は書かないでください。');
    L.push('・子どもの名前は書かないでください（「〇〇さん」も不要です）。記号（児童01など）も所見の文の中には書かないでください。');
    L.push('・点数・順位・ほかの子との比べ方は書かないでください。');
    L.push('・よいところを中心に書き、課題は前向きな言葉で1つまでにしてください。');
    L.push('・テストの結果からわかることだけを書き、授業中の様子など、わからないことは作らないでください。');
    L.push('・保護者が読んでわかる、やわらかい言葉にしてください。一人ひとり、言い回しを変えてください。');
    L.push('・途中で切れたときは、「続き」と言われたら、続きの記号から書いてください。');
    L.push('');
    L.push('【テストの結果のまとめ】' + (opts.grade ? '（学年：' + opts.grade + '・' : '（') + '時期：' + (profiles[0] ? profiles[0].term : '') + '）');
    profiles.forEach(function (p, i) {
      L.push('');
      L.push('【' + SL.aiCode(i) + '】');
      summaryLines(p).forEach(function (x) { L.push(x); });
    });
    return L.join('\n');
  };

  /** AI の返事を「【児童01】…」ごとに分ける。返す: { '0': 文, '1': 文, … }（名簿の何番目か） */
  SL.parseAiReply = function (text) {
    var s = String(text || '').replace(/\r\n?/g, '\n').replace(/[［\[]/g, '【').replace(/[］\]]/g, '】')
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    var re = /【\s*児童\s*(\d{1,3})\s*】/g;
    var marks = [], m;
    while ((m = re.exec(s))) marks.push({ i: Number(m[1]) - 1, start: m.index, end: re.lastIndex });
    var out = {};
    marks.forEach(function (mk, k) {
      var body = s.slice(mk.end, k + 1 < marks.length ? marks[k + 1].start : s.length)
        .replace(/^[\s:：]+/, '').replace(/\*\*/g, '').replace(/\n{3,}/g, '\n\n').trim();
      if (mk.i >= 0 && body) out[mk.i] = body.slice(0, 800);
    });
    return out;
  };

  SL.aiPrompt = function (profile, opts) {
    opts = opts || {};
    var n = TARGET[opts.length] || TARGET.normal;
    var L = [];
    L.push('あなたは小学校の担任の先生です。次の「テストの結果のまとめ」をもとに、通知表の所見の下書きを' + n + '字くらいで1つ書いてください。');
    L.push('');
    L.push('【書き方のきまり】');
    L.push('・子どもの名前は書かないでください（「〇〇さん」も不要です）。');
    L.push('・点数・順位・ほかの子との比べ方は書かないでください。');
    L.push('・よいところを中心に書き、課題は前向きな言葉で1つまでにしてください。');
    L.push('・テストの結果からわかることだけを書き、授業中の様子など、わからないことは作らないでください。先生が書き足すとよい所は【　】で示してください。');
    L.push('・保護者が読んでわかる、やわらかい言葉にしてください。');
    L.push('');
    L.push('【テストの結果のまとめ】');
    if (opts.grade) L.push('学年：' + opts.grade);
    L.push('時期：' + profile.term);
    profile.subjects.forEach(function (sm) {
      if (sm.rate === null) return;
      var ks = sm.kanten.filter(function (k) { return k.rate !== null && k.classRate !== null; })
        .map(function (k) { return k.label + 'は' + levelWord(k.rate - k.classRate); });
      L.push('・' + sm.name + '：全体として' + absWord(sm.rate) + '（' + levelWord(sm.rate - sm.classRate) + '）。' + (ks.length ? ks.join('、') + '。' : ''));
    });
    if (profile.strengths.length) {
      L.push('とくいなところ：' + profile.strengths.map(function (x) { return x.subject + '「' + x.label + '」' + (x.unit ? '（単元「' + x.unit + '」）' : ''); }).join('、'));
    }
    if (profile.growth.length) {
      L.push('のびてきたところ：' + profile.growth.map(function (x) { return x.subject + '（' + x.from + 'より学級の中での位置が上がった）'; }).join('、'));
    }
    if (profile.challenges.length) {
      L.push('これから伸ばしたいところ：' + profile.challenges.map(function (x) { return x.subject + '「' + x.label + '」'; }).join('、'));
    }
    return L.join('\n');
  };


  root.SL = SL;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
