<script>
/*
 * Logic.html — 成績の計算（純粋関数）。画面（App.html）と、tools/run-local-tests.js が使う。
 *
 * 流れ（SMILEスプレッドシートと同じ考え方）:
 *   テストの点数 → 観点ごとの到達率 → 単元の A/B/C
 *   学期の中のテストを合わせた到達率 → 学期の観点の A/B/C（通知表）
 *   学期の観点の A/B/C を組み合わせ表に当てる → 1年間の観点の A/B/C（指導要録）
 *   観点の A/B/C を点（A=3・B=2・C=1）にして平均 → 評定（3・2・1）
 *
 * ★先生が手で直した値（手直し）は、いつも計算より優先する。
 * ★「主体的に学習に取り組む態度」はテストでは測れないので、先生が入れた値だけを使う。
 * ★DOM・google.script.run に触らない。
 */
(function (root) {
  'use strict';
  var SL = {};
  var YEAR = '1年間';
  var ABC = ['A', 'B', 'C'];
  var POINT = { A: 3, B: 2, C: 1 };

  /** 組み合わせ表（SMILEの「通知表評価の読込設定」と同じ）。学期の数ごと。 */
  var COMBO = {
    3: {
      AAA: 'A', AAB: 'A', AAC: 'B', ABA: 'A', ABB: 'B', ABC: 'B', ACA: 'B', ACB: 'B', ACC: 'B',
      BAA: 'A', BAB: 'B', BAC: 'B', BBA: 'B', BBB: 'B', BBC: 'B', BCA: 'B', BCB: 'B', BCC: 'C',
      CAA: 'B', CAB: 'B', CAC: 'B', CBA: 'B', CBB: 'B', CBC: 'C', CCA: 'B', CCB: 'C', CCC: 'C'
    },
    2: { AA: 'A', AB: 'A', AC: 'B', BA: 'A', BB: 'B', BC: 'B', CA: 'B', CB: 'B', CC: 'C' }
  };
  SL.COMBO = COMBO;
  SL.YEAR = YEAR;

  function r1(x) { return Math.round(x * 10) / 10; }
  function rate(sum, max) { return max > 0 ? r1(sum / max * 100) : null; }
  function abcOf(rt, a, b) {
    if (rt === null || rt === undefined) return '';
    return rt >= a ? 'A' : rt >= b ? 'B' : 'C';
  }
  SL.rate = rate;
  SL.abcOf = abcOf;

  /** 入力された評価の書き方をそろえる（a・Ａ・◎ → A など）。読めなければ null。'/' は評価不能。 */
  SL.normAbc = function (v) {
    var s = String(v === null || v === undefined ? '' : v).trim()
      .replace(/[Ａ-Ｃａ-ｃ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).toUpperCase();
    if (s === '') return '';
    if (s === '◎') return 'A';
    if (s === '○' || s === '〇' || s === '◯') return 'B';
    if (s === '△') return 'C';
    if (s === '/' || s === '／') return '/';
    return ABC.indexOf(s) !== -1 ? s : null;
  };
  /** 評定の書き方をそろえる（１→1）。読めなければ null。 */
  SL.normHyotei = function (v) {
    var s = String(v === null || v === undefined ? '' : v).trim()
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (s === '') return '';
    if (s === '/' || s === '／') return '/';
    return /^[1-3]$/.test(s) ? s : null;
  };
  /** 点数の書き方をそろえる。読めなければ null、空なら ''。 */
  SL.normScore = function (v, max) {
    var s = String(v === null || v === undefined ? '' : v).trim()
      .replace(/[０-９．]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (s === '') return '';
    if (!/^\d+(\.\d+)?$/.test(s)) return null;
    var n = Number(s);
    if (max !== undefined && n > max) return null;
    return n;
  };

  // ================= 教科の設定 =================

  /** 教科の観点のうち、テストで点をつける観点（主体的…は入らない）。 */
  function testKanten(sub) { return sub.kanten.filter(function (k) { return k.test; }); }
  SL.testKanten = testKanten;
  /** 学期・1年間の評価を出す観点（漢字・言葉のように、ほかの観点にまとめるものは入らない）。 */
  function evalKanten(sub) { return sub.kanten.filter(function (k) { return !k.into; }); }
  SL.evalKanten = evalKanten;
  function kantenOf(sub, label) { return sub.kanten.filter(function (k) { return k.label === label; })[0] || null; }

  // ================= テスト（単元） =================

  /** 1人の子の、1つのテストの結果。点が1つも入っていなければ null。 */
  SL.testResult = function (cd, sub, test, sk) {
    var row = (cd.scores[test.testId] || {})[sk];
    if (!row) return null;
    var sum = 0, max = 0, any = false, per = {};
    Object.keys(test.points).forEach(function (label) {
      var v = row[label];
      if (v === null || v === undefined || v === '') return;
      any = true; sum += v; max += test.points[label];
      per[label] = v;
    });
    if (!any) return null;
    var rt = rate(sum, max);
    var t = sub.total;
    return { sum: sum, max: max, rate: rt, eval: abcOf(rt, t.a, t.b), per: per };
  };

  function testsOf(cd, subject, term) {
    return cd.tests.filter(function (t) { return t.subject === subject && (term === YEAR || t.term === term); })
      .sort(function (a, b) { return (cd.terms.indexOf(a.term) - cd.terms.indexOf(b.term)) || (a.order - b.order); });
  }
  SL.testsOf = testsOf;

  // ================= 学期の観点の評価 =================

  function manualOf(cd, sk, subject, term, field) {
    var v = cd.manual[[sk, subject, term, field].join('|')];
    return v === undefined ? '' : v;
  }
  SL.manualOf = manualOf;

  /**
   * 1人・1教科・1学期の観点ごとの結果。
   * 返す: { kanten: [{label, gg, sum, max, rate, auto, manual, final}], hyotei: {auto, manual, final}, total: {rate} }
   */
  SL.termEval = function (cd, sub, sk, term) {
    var tests = testsOf(cd, sub.name, term);
    var acc = {};
    sub.kanten.forEach(function (k) { acc[k.label] = { sum: 0, max: 0 }; });
    var allSum = 0, allMax = 0;
    tests.forEach(function (t) {
      var row = (cd.scores[t.testId] || {})[sk] || {};
      Object.keys(t.points).forEach(function (label) {
        var v = row[label];
        if (v === null || v === undefined || v === '') return;
        var k = kantenOf(sub, label);
        if (!k) return;
        var target = k.into ? k.into : label;
        if (!acc[target]) acc[target] = { sum: 0, max: 0 };
        acc[target].sum += v; acc[target].max += t.points[label];
        if (k.into) { acc[label].sum += v; acc[label].max += t.points[label]; }
        allSum += v; allMax += t.points[label];
      });
    });
    var out = evalKanten(sub).map(function (k) {
      var a = acc[k.label] || { sum: 0, max: 0 };
      var rt = k.test ? rate(a.sum, a.max) : null;
      var auto = k.test ? abcOf(rt, k.a, k.b) : '';
      var manual = manualOf(cd, sk, sub.name, term, k.label);
      return { label: k.label, gg: k.gg, test: k.test, sum: a.sum, max: a.max, rate: rt, auto: auto, manual: manual, final: manual || auto };
    });
    var hy = hyoteiOf(sub, out.map(function (x) { return x.final; }));
    var hManual = manualOf(cd, sk, sub.name, term, '評定');
    return { kanten: out, hyotei: { auto: hy, manual: hManual, final: hManual || hy }, total: { rate: rate(allSum, allMax) } };
  };

  /** 観点の A/B/C から評定（3・2・1）。1つでも空・評価不能があれば ''。 */
  function hyoteiOf(sub, evals) {
    if (!evals.length || evals.some(function (e) { return !POINT[e]; })) return '';
    var avg = evals.reduce(function (s, e) { return s + POINT[e]; }, 0) / evals.length;
    var t = sub.total;
    return avg >= t.r3 ? '3' : avg >= t.r2 ? '2' : '1';
  }
  SL.hyoteiOf = hyoteiOf;

  // ================= 1年間（指導要録） =================

  /** 学期の評価の並びを組み合わせ表に当てる。全部の学期がそろっていなければ ''。 */
  function combine(evals, n) {
    if (evals.length !== n || evals.some(function (e) { return ABC.indexOf(e) === -1; })) return '';
    return (COMBO[n] || {})[evals.join('')] || '';
  }
  SL.combine = combine;

  /** 1人・1教科の1年間（指導要録）の観点と評定。 */
  SL.yearEval = function (cd, sub, sk) {
    var terms = cd.terms.map(function (t) { return SL.termEval(cd, sub, sk, t); });
    var out = evalKanten(sub).map(function (k, i) {
      var seq = terms.map(function (te) { return te.kanten[i].final; });
      var auto = combine(seq, cd.terms.length);
      var manual = manualOf(cd, sk, sub.name, YEAR, k.label);
      return { label: k.label, gg: k.gg, terms: seq, auto: auto, manual: manual, final: manual || auto };
    });
    var hy = hyoteiOf(sub, out.map(function (x) { return x.final; }));
    var hManual = manualOf(cd, sk, sub.name, YEAR, '評定');
    return { kanten: out, hyotei: { auto: hy, manual: hManual, final: hManual || hy } };
  };

  /** 時期（学期 or 1年間）ごとに呼び分ける。 */
  SL.evalFor = function (cd, sub, sk, term) {
    return term === YEAR ? SL.yearEval(cd, sub, sk) : SL.termEval(cd, sub, sk, term);
  };

  // ================= 校務支援システム（GG）に貼る表 =================

  /** GGの列（知・思・主・評定）。評定を出さない学年・時期は入れない。 */
  SL.ggColumns = function (cd, sub, term) {
    var cols = evalKanten(sub).filter(function (k) { return k.gg; }).map(function (k) { return { label: k.gg, kanten: k.label }; });
    var useHyotei = term === YEAR ? sub.hyoteiYear : sub.hyoteiTerm;
    if (useHyotei) cols.push({ label: '評定', kanten: '評定' });
    return cols;
  };

  /** GGに貼る行（名簿の順）。空はそのまま空にする（GGで手で入れる）。 */
  SL.ggRows = function (cd, sub, term) {
    var cols = SL.ggColumns(cd, sub, term);
    return cd.students.map(function (st) {
      var ev = SL.evalFor(cd, sub, st.key, term);
      return {
        key: st.key, no: st.no, name: st.name,
        cells: cols.map(function (c) {
          if (c.kanten === '評定') return ev.hyotei.final;
          var k = ev.kanten.filter(function (x) { return x.label === c.kanten; })[0];
          return k ? k.final : '';
        })
      };
    });
  };

  /** 表の値をタブ区切りの文字にする（スプレッドシート・GGに貼れる形）。 */
  SL.toTsv = function (rows) {
    return rows.map(function (r) { return r.map(function (v) { return String(v === null || v === undefined ? '' : v).replace(/[\t\r\n]+/g, ' '); }).join('\t'); }).join('\n');
  };
  /** 貼りつけられた文字を表にする（Excel・スプレッドシート・GGからのコピー）。 */
  SL.fromTsv = function (text) {
    var s = String(text || '').replace(/\r\n?/g, '\n');
    if (s.slice(-1) === '\n') s = s.slice(0, -1);
    if (s === '') return [];
    return s.split('\n').map(function (line) { return line.split('\t'); });
  };

  // ================= 入れわすれ =================

  /** 何人かは点が入っているのに、空いている子がいるテスト。 */
  SL.missing = function (cd) {
    var out = [];
    cd.tests.forEach(function (t) {
      var sc = cd.scores[t.testId] || {};
      var entered = cd.students.filter(function (st) {
        var row = sc[st.key];
        return row && Object.keys(t.points).some(function (l) { return row[l] !== undefined && row[l] !== null && row[l] !== ''; });
      });
      if (!entered.length || entered.length === cd.students.length) return;
      out.push({ test: t, entered: entered.length, missing: cd.students.filter(function (st) { return entered.indexOf(st) === -1; }) });
    });
    return out;
  };

  // ================= 単元ごとの学級のようす =================

  /** テストごとの学級平均・A/B/Cの人数。 */
  SL.testStats = function (cd, sub, test) {
    var n = 0, sumRate = 0, abc = { A: 0, B: 0, C: 0 }, kSum = {}, kMax = {};
    cd.students.forEach(function (st) {
      var r = SL.testResult(cd, sub, test, st.key);
      if (!r) return;
      n++; sumRate += r.rate; abc[r.eval]++;
      Object.keys(r.per).forEach(function (l) { kSum[l] = (kSum[l] || 0) + r.per[l]; kMax[l] = (kMax[l] || 0) + test.points[l]; });
    });
    var kAvg = {};
    Object.keys(kSum).forEach(function (l) { kAvg[l] = rate(kSum[l], kMax[l]); });
    return { entered: n, avg: n ? r1(sumRate / n) : null, abc: abc, kAvg: kAvg };
  };

  root.SL = SL;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
